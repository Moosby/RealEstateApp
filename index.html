<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة العقارات المتكامل</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body className="bg-slate-100 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const initialData = {
      buildings: [{ id: 'b1', name: 'المبنى الرئيسي' }],
      units: [],
      contracts: [],
      installments: [],
      custodies: [],
      transactions: []
    };

    function MainApp() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        return saved ? JSON.parse(saved) : initialData;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const fileInputRef = useRef(null);

      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' });

      useEffect(() => {
        localStorage.setItem('real_estate_core_data', JSON.stringify(data));
      }, [data]);

      const showMessage = (msg, isError = false) => {
        isError ? setErrorMsg(msg) : setSuccessMsg(msg);
        setTimeout(() => { setErrorMsg(''); setSuccessMsg(''); }, 4000);
      };

      const custodyCalculations = useMemo(() => {
        return data.custodies.map(c => {
          const used = data.transactions.filter(t => t.type === 'expense' && t.custodyId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...c, used, remaining: c.totalAmount - used };
        });
      }, [data]);

      const totals = useMemo(() => {
        const totalSales = data.contracts.reduce((sum, c) => sum + Number(c.totalAmount), 0);
        const totalIncome = data.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
        const totalExpenses = data.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
        const netCustody = custodyCalculations.reduce((sum, c) => sum + c.remaining, 0);
        return { totalSales, totalIncome, totalExpenses, netCustody, netSafe: totalIncome - totalExpenses };
      }, [data, custodyCalculations]);

      const handleAddContract = (e) => {
        e.preventDefault();
        try {
          const contractId = 'cont_' + Date.now();
          const downPayment = Number(newContract.downPayment);
          const totalAmount = Number(newContract.totalAmount);
          const count = Number(newContract.installmentsCount);
          
          if (downPayment > totalAmount) throw new Error('المقدم أكبر من إجمالي المبلغ!');

          const contract = {
            id: contractId,
            clientName: newContract.clientName,
            unitId: newContract.unitId,
            totalAmount,
            downPayment,
            date: new Date().toISOString().split('T')[0]
          };

          const remaining = totalAmount - downPayment;
          const instAmount = count > 0 ? (remaining / count) : 0;
          const newInstallments = [];
          
          let currentDate = new Date(newContract.firstInstallmentDate);
          for(let i=0; i<count; i++) {
            newInstallments.push({
              id: 'inst_' + Date.now() + '_' + i,
              contractId,
              amount: instAmount,
              dueDate: currentDate.toISOString().split('T')[0],
              status: 'pending'
            });
            currentDate.setMonth(currentDate.getMonth() + 1);
          }

          const transaction = {
            id: 't_' + Date.now(),
            type: 'income',
            amount: downPayment,
            description: `مقدم تعاقد من ${newContract.clientName}`,
            date: new Date().toISOString().split('T')[0]
          };

          setData(prev => ({
            ...prev,
            contracts: [...prev.contracts, contract],
            installments: [...prev.installments, ...newInstallments],
            transactions: [...prev.transactions, transaction]
          }));
          
          setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' });
          showMessage('تم تسجيل العقد والمقدم وجدولة الأقساط بنجاح');
        } catch (err) { showMessage(err.message, true); }
      };

      const payInstallment = (instId, amount, clientName) => {
        if(window.confirm('هل أنت متأكد من تحصيل هذا القسط؟')) {
           const updatedInsts = data.installments.map(i => i.id === instId ? { ...i, status: 'paid' } : i);
           const newTrans = {
             id: 't_' + Date.now(),
             type: 'income',
             amount: amount,
             description: `تحصيل قسط من ${clientName}`,
             date: new Date().toISOString().split('T')[0]
           };
           setData(prev => ({ ...prev, installments: updatedInsts, transactions: [...prev.transactions, newTrans] }));
           showMessage('تم تحصيل القسط بنجاح');
        }
      };

      const handleExport = () => {
        const dataStr = JSON.stringify(data, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `RealEstate_Backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            if(importedData.transactions && importedData.contracts) {
              setData(importedData);
              showMessage('تم استرجاع البيانات بنجاح!');
            } else { throw new Error('ملف غير صالح'); }
          } catch(err) { showMessage('حدث خطأ أثناء قراءة الملف', true); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-slate-900 text-white p-4 shadow-lg flex justify-between items-center">
            <h1 className="text-xl font-bold">🏢 نظام إدارة العقارات</h1>
          </header>

          <nav className="bg-slate-800 text-slate-200 flex overflow-x-auto border-b border-slate-700">
            <button onClick={() => setActiveTab('dashboard')} className={`p-3 font-medium whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-slate-700 text-emerald-400 border-b-2 border-emerald-400' : ''}`}>الرئيسية</button>
            <button onClick={() => setActiveTab('sales')} className={`p-3 font-medium whitespace-nowrap ${activeTab === 'sales' ? 'bg-slate-700 text-emerald-400 border-b-2 border-emerald-400' : ''}`}>المبيعات والأقساط</button>
            <button onClick={() => setActiveTab('backup')} className={`p-3 font-medium whitespace-nowrap ${activeTab === 'backup' ? 'bg-slate-700 text-emerald-400 border-b-2 border-emerald-400' : ''}`}>النسخ الاحتياطي</button>
          </nav>

          {errorMsg && <div className="bg-red-500 text-white p-3 text-center font-bold">{errorMsg}</div>}
          {successMsg && <div className="bg-emerald-600 text-white p-3 text-center font-bold">{successMsg}</div>}

          <main className="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            {activeTab === 'dashboard' && (
              <div>
                <h2 className="text-2xl font-bold mb-4">المركز المالي العام</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                  <div className="bg-white p-4 rounded-xl shadow border-r-4 border-blue-500">
                    <p className="text-sm text-slate-500">إجمالي المبيعات (عقود)</p>
                    <p className="text-2xl font-bold text-slate-800">{totals.totalSales.toLocaleString()}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow border-r-4 border-emerald-500">
                    <p className="text-sm text-slate-500">إجمالي المقبوضات (الخزينة)</p>
                    <p className="text-2xl font-bold text-emerald-600">{totals.totalIncome.toLocaleString()}</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'sales' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white p-4 rounded-xl shadow lg:col-span-1">
                  <h3 className="text-lg font-bold mb-4">تسجيل عقد بيع</h3>
                  <form onSubmit={handleAddContract} className="space-y-3">
                    <div>
                      <label className="block text-sm mb-1">اسم العميل</label>
                      <input type="text" className="w-full border p-2 rounded" value={newContract.clientName} onChange={e => setNewContract({...newContract, clientName: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm mb-1">إجمالي مبلغ البيع</label>
                      <input type="number" className="w-full border p-2 rounded" value={newContract.totalAmount} onChange={e => setNewContract({...newContract, totalAmount: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm mb-1">المقدم المدفوع (سيتم إضافته للخزينة)</label>
                      <input type="number" className="w-full border p-2 rounded" value={newContract.downPayment} onChange={e => setNewContract({...newContract, downPayment: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm mb-1">عدد الأقساط المتبقية</label>
                      <input type="number" className="w-full border p-2 rounded" value={newContract.installmentsCount} onChange={e => setNewContract({...newContract, installmentsCount: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm mb-1">تاريخ أول قسط</label>
                      <input type="date" className="w-full border p-2 rounded" value={newContract.firstInstallmentDate} onChange={e => setNewContract({...newContract, firstInstallmentDate: e.target.value})} required />
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">حفظ وجدولة الأقساط</button>
                  </form>
                </div>

                <div className="bg-white p-4 rounded-xl shadow lg:col-span-2">
                  <h3 className="text-lg font-bold mb-4">متابعة الأقساط</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-right border-collapse text-sm">
                      <thead>
                        <tr className="bg-slate-100 border-b">
                          <th className="p-2">العميل</th>
                          <th className="p-2">تاريخ الاستحقاق</th>
                          <th className="p-2">المبلغ</th>
                          <th className="p-2">الحالة</th>
                          <th className="p-2">إجراء</th>
                        </tr>
                      </thead>
                      <tbody>
                        {data.installments.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate)).map(inst => {
                          const contract = data.contracts.find(c => c.id === inst.contractId);
                          const isOverdue = new Date(inst.dueDate) < new Date() && inst.status === 'pending';
                          return (
                            <tr key={inst.id} className={`border-b ${isOverdue ? 'bg-red-50' : ''}`}>
                              <td className="p-2 font-bold">{contract?.clientName}</td>
                              <td className="p-2" dir="ltr">{inst.dueDate}</td>
                              <td className="p-2">{Number(inst.amount).toLocaleString()}</td>
                              <td className="p-2">
                                {inst.status === 'paid' ? <span className="text-emerald-600 font-bold">مدفوع</span> : (isOverdue ? <span className="text-red-600 font-bold">متأخر</span> : 'مستحق')}
                              </td>
                              <td className="p-2">
                                {inst.status === 'pending' && (
                                  <button onClick={() => payInstallment(inst.id, inst.amount, contract?.clientName)} className="bg-emerald-500 text-white px-2 py-1 rounded hover:bg-emerald-600">تحصيل</button>
                                )}
                              </td>
                            </tr>
                          )
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'backup' && (
              <div className="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto text-center">
                <h2 className="text-xl font-bold mb-2">النسخ الاحتياطي (ضروري جداً)</h2>
                <p className="text-slate-600 mb-6 text-sm">التطبيق يعمل أوفلاين على جهازك، يجب تحميل نسخة احتياطية من بياناتك أسبوعياً لتجنب فقدانها.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="border p-4 rounded-lg bg-blue-50">
                    <button onClick={handleExport} className="w-full bg-blue-600 text-white py-2 rounded font-bold">تحميل نسخة لبياناتي</button>
                  </div>
                  <div className="border p-4 rounded-lg bg-amber-50">
                    <input type="file" accept=".json" ref={fileInputRef} className="hidden" onChange={handleImport} />
                    <button onClick={() => fileInputRef.current.click()} className="w-full bg-amber-600 text-white py-2 rounded font-bold">استرجاع نسخة سابقة</button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>

  <!-- سكريبت تشغيل وضع الأوفلاين -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('تم تفعيل وضع الأوفلاين بنجاح'))
          .catch(err => console.log('حدث خطأ في Service Worker', err));
      });
    }
  </script>
</body>
</html>
