<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة العقارات</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; font-weight: bold !important; font-size: 1.1rem !important; }
      .print-hide { display: none !important; }
      .print-show { display: block !important; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      th, td { border: 2px solid black !important; padding: 4px 8px !important; }
      .print-row-text { font-size: 0.95rem !important; }
      .print-header { font-size: 1.2rem !important; }
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body className="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const todayDateStr = new Date().toISOString().substring(0, 10);

    // --- مكون إدخال الأرقام الاحترافي (للفواصل التلقائية) ---
    function NumberInput({ value, onChange, placeholder, className, required }) {
      const displayVal = (value !== '' && value !== undefined && value !== null && !isNaN(value)) ? Number(value).toLocaleString('en-US') : '';
      return (
        <input type="text" inputMode="numeric" value={displayVal} placeholder={placeholder} required={required}
          className={className}
          onChange={(e) => {
            const raw = e.target.value.replace(/[^0-9]/g, '');
            onChange(raw);
          }}
        />
      );
    }

    // --- مكون القائمة المنسدلة الذكية ---
    function MultiSelectDropdown({ options, selected, onChange, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);
      useEffect(() => {
        const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);
      return (
        <div className="relative z-20 w-full" ref={dropdownRef}>
          <div className="w-full border p-2 text-sm rounded bg-white cursor-pointer font-bold flex justify-between items-center shadow-sm" onClick={() => setIsOpen(!isOpen)}>
            <span className="truncate">{selected.length === 0 ? placeholder : `محدد (${selected.length})`}</span><span className="text-xs">▼</span>
          </div>
          {isOpen && (
            <div className="absolute top-full right-0 w-full bg-white border mt-1 shadow-2xl max-h-48 overflow-y-auto z-50 p-2 space-y-2 rounded animate-fade-in">
              <label className="flex items-center gap-2 cursor-pointer font-bold border-b pb-2"><input type="checkbox" checked={selected.length===0} onChange={()=>onChange([])}/> الكل / غير محدد</label>
              {options.map(opt => (
                <label key={opt.id} className="flex items-center gap-2 cursor-pointer whitespace-nowrap text-sm">
                  <input type="checkbox" checked={selected.includes(opt.id)} onChange={(e)=>{ const newIds = e.target.checked ? [...selected, opt.id] : selected.filter(id=>id!==opt.id); onChange(newIds); }}/> {opt.label}
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

    const initialData = { pinCode: '0000', buildings: [], units: [], categories: [], contracts: [], installments: [], custodies: [], transactions: [] };

    function MainApp() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        if (saved) { try { const parsed = JSON.parse(saved); return { ...initialData, ...parsed }; } catch (e) { return initialData; } }
        return initialData;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState({ show: false, msg: '', isError: false });
      const [appModal, setAppModal] = useState({ show: false, type: '', props: {} });
      const [editingTxId, setEditingTxId] = useState(null);

      const [newBuilding, setNewBuilding] = useState('');
      const [newUnit, setNewUnit] = useState({ buildingId: '', unitNumber: '', price: '' });
      const [newCategory, setNewCategory] = useState('');
      const [newCustody, setNewCustody] = useState({ personName: '', totalAmount: '', notes: '' });
      
      const [newTransaction, setNewTransaction] = useState({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', description: '', date: todayDateStr });
      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' });
      
      const [reportType, setReportType] = useState('transactions'); 
      const [reportFilter, setReportFilter] = useState({ startDate: '', endDate: '', custodyIds: [], buildingIds: [] });
      const [dashboardCustodyFilter, setDashboardCustodyFilter] = useState(() => { try { const s=localStorage.getItem('real_estate_last_custody'); return s?JSON.parse(s):[]; }catch(e){return [];} });
      const [quickAdd, setQuickAdd] = useState({ show: false, type: 'income', amount: '', description: '', categoryId: '', date: todayDateStr });

      const [selectedCustodies, setSelectedCustodies] = useState([]);
      const [custodyTabSub, setCustodyTabSub] = useState('income');
      const [custodySearch, setCustodySearch] = useState('');
      const [descFocus, setDescFocus] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_core_data', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('real_estate_last_custody', JSON.stringify(dashboardCustodyFilter)); }, [dashboardCustodyFilter]);

      // --- Exit App Interceptor ---
      useEffect(() => {
        window.history.pushState(null, '', window.location.href);
        const handlePopState = () => {
          setAppModal({ show: true, type: 'CONFIRM', props: {
            title: 'تأكيد الخروج', message: 'هل تريد الخروج من البرنامج؟',
            onConfirm: () => { window.history.back(); }
          }});
          window.history.pushState(null, '', window.location.href);
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const showMsg = (msg, isError = false) => {
        setToast({ show: true, msg, isError });
        setTimeout(() => setToast(p => ({ ...p, show: false })), 3500);
      };
      const closeModal = () => setAppModal({ show: false, type: '', props: {} });
      
      const requirePin = (onSuccess) => setAppModal({ show: true, type: 'PIN', props: { onSuccess } });
      const formatShortDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].substring(2)}` : d; };

      const allDescriptions = useMemo(() => {
        const descs = [];
        for (let i = (data.transactions || []).length - 1; i >= 0; i--) {
          const d = data.transactions[i].description;
          if (d && !descs.includes(d)) descs.push(d);
        }
        return descs;
      }, [data.transactions]);
      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(t => t.type === 'expense' && t.custodyId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
          const incomes = (data.transactions || []).filter(t => t.type === 'income' && t.custodyId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount) + incomes - expenses };
        });
      }, [data]);

      const dashboardNet = dashboardCustodyFilter.length === 0 ? 0 : custodyCalculations.filter(c => dashboardCustodyFilter.includes(c.id)).reduce((s, c) => s + c.remaining, 0);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(t => {
          if (selectedCustodies.length > 0 && !selectedCustodies.includes(t.custodyId)) return false;
          if (t.type !== custodyTabSub) return false;
          if (custodySearch && !t.description.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(b.date) - new Date(a.date)); // الأحدث فوق
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjs = reportFilter.custodyIds.length > 0 ? (data.custodies || []).filter(c => reportFilter.custodyIds.includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjs.forEach(c => {
           let bal = Number(c.totalAmount);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(t => t.custodyId === c.id && t.date < reportFilter.startDate);
              const bInc = beforeTrans.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
              const bExp = beforeTrans.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
              bal = bal + bInc - bExp;
           }
           openingBalance += bal;
        });

        const custodyName = reportFilter.custodyIds.length === 0 ? 'كل العهد / الخزينة العامة' : selectedCustodyObjs.map(c=>c.personName).join(' + ');

        const filtered = (data.transactions || []).filter(t => {
          if (reportFilter.startDate && t.date < reportFilter.startDate) return false;
          if (reportFilter.endDate && t.date > reportFilter.endDate) return false;
          if (reportFilter.custodyIds.length > 0 && !reportFilter.custodyIds.includes(t.custodyId)) return false;
          if (reportFilter.buildingIds.length > 0 && !reportFilter.buildingIds.includes(t.buildingId)) return false;
          return true;
        }).sort((a,b) => new Date(a.date) - new Date(b.date));

        const incomes = filtered.filter(t => t.type === 'income');
        const expenses = filtered.filter(t => t.type === 'expense');
        const totalIncomes = incomes.reduce((s,t) => s + Number(t.amount), 0);
        const totalExpenses = expenses.reduce((s,t) => s + Number(t.amount), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName };
      }, [data, reportFilter]);

      const handlePrint = () => {
        const originalTitle = document.title;
        const printName = reportType === 'transactions' ? reportData.custodyName : 'تقرير_الاقساط';
        document.title = `${printName.replace(/\s+/g, '_')}_${todayDateStr}.pdf`;
        setTimeout(() => { window.print(); document.title = originalTitle; }, 100);
      };

      const handleTxClick = (tx) => setAppModal({ show: true, type: 'TX_ACTION', props: { tx } });

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if(!newTransaction.amount) return showMsg('المبلغ مطلوب', true);
        if (editingTxId) {
          setData(prev => ({ ...prev, transactions: prev.transactions.map(t => t.id === editingTxId ? { ...t, ...newTransaction, amount: Number(newTransaction.amount) } : t) }));
          setEditingTxId(null);
          showMsg('تم تحديث الحركة بنجاح');
        } else {
          const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) };
          setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] }));
          showMsg('تم حفظ الحركة بنجاح');
        }
        setNewTransaction(prev => ({ ...prev, amount: '', description: '' })); 
      };

      const addBuilding = (e) => { e.preventDefault(); setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding}]})); setNewBuilding(''); showMsg('تمت الإضافة'); };
      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg('تمت الإضافة'); };
      
      const addContract = (e) => { 
        e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return showMsg('اختر الوحدة أولاً', true); 
        const contractId = 'cont_' + Date.now(); const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); 
        const contract = { id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active' }; 
        const newInsts = []; let curDate = new Date(newContract.firstInstallmentDate); const instAmount = count > 0 ? ((total - dp) / count) : 0; 
        for(let i=0; i<count; i++) { newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: instAmount, dueDate: curDate.toISOString().split('T')[0], status: 'pending' }); curDate.setMonth(curDate.getMonth() + 1); } 
        const trans = { id: 't_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, description: `مقدم تعاقد: ${newContract.clientName}`, date: todayDateStr }; 
        setData(prev => ({ ...prev, contracts: [...(prev.contracts || []), contract], installments: [...(prev.installments || []), ...newInsts], transactions: [...(prev.transactions || []), trans], units: (prev.units || []).map(u => u.id === unit.id ? { ...u, status: 'sold' } : u) })); 
        setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' }); showMsg('تم التسجيل بنجاح'); 
      };

      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));

      const tabs = [
        { id: 'dashboard', label: 'الرئيسية' }, { id: 'transactions', label: 'إيراد/مصروف' },
        { id: 'custody', label: 'العهد' }, { id: 'inventory', label: 'الوحدات' },
        { id: 'sales', label: 'المبيعات' }, { id: 'reports', label: 'التقارير' }
      ];

      const sortedCustodies = [...(data.custodies || [])].reverse();
      const sortedBuildings = [...(data.buildings || [])].reverse();
      const sortedCategories = [...(data.categories || [])].reverse();

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <header className="bg-slate-900 text-white p-4 shadow-lg print-hide flex justify-between items-center relative z-40">
            <h1 className="text-xl font-bold tracking-wide">🏢 إدارة الأملاك والعقارات</h1>
            <button onClick={() => setActiveTab('settings')} className="text-2xl hover:rotate-90 transition-transform">⚙️</button>
          </header>

          <nav className="bg-slate-800 text-slate-200 flex flex-wrap border-b border-slate-700 print-hide shadow">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => {setActiveTab(tab.id); setEditingTxId(null);}} className={`flex-1 min-w-[30%] p-3 text-sm font-bold text-center transition-colors ${activeTab === tab.id ? 'bg-slate-100 text-slate-900 border-b-4 border-blue-600' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Toast Notification */}
          {toast.show && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[200] animate-slide-up print-hide">
              <div className={`px-6 py-3 rounded-full shadow-2xl font-bold text-white flex items-center gap-3 ${toast.isError ? 'bg-red-600' : 'bg-emerald-600'}`}>
                <span className="text-xl">{toast.isError ? '⚠️' : '✅'}</span>
                <span>{toast.msg}</span>
              </div>
            </div>
          )}

          {/* Custom Modals Portal */}
          {appModal.show && (
            <div className="fixed inset-0 bg-slate-900 bg-opacity-70 backdrop-blur-sm flex items-center justify-center z-[100] animate-fade-in p-4 print-hide" onClick={closeModal}>
              
              {appModal.type === 'TX_ACTION' && (
                <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}>
                  <div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div>
                  <h3 className="font-bold text-lg mb-2 text-center text-slate-800 border-b pb-2">خيارات الحركة</h3>
                  <p className="text-center text-sm text-slate-500 mb-6 bg-slate-50 p-2 rounded">{appModal.props.tx.description} <br/> <span className="font-bold text-lg text-slate-800">{Number(appModal.props.tx.amount).toLocaleString()} ج.م</span></p>
                  <button onClick={() => {
                    closeModal(); setNewTransaction({...appModal.props.tx}); setEditingTxId(appModal.props.tx.id); setActiveTab('transactions');
                  }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ تعديل الحركة</button>
                  <button onClick={() => {
                    closeModal(); requirePin(() => {
                      setAppModal({ show: true, type: 'CONFIRM', props: {
                        title: 'تأكيد الحذف', message: 'هل أنت متأكد من حذف هذه الحركة نهائياً؟',
                        onConfirm: () => { setData(p => ({...p, transactions: p.transactions.filter(t => t.id !== appModal.props.tx.id)})); showMsg('تم الحذف بنجاح'); closeModal(); }
                      }});
                    });
                  }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ حذف الحركة</button>
                </div>
              )}

              {appModal.type === 'PIN' && (
                <div className="bg-white w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}>
                  <div className="bg-red-600 text-white p-4 text-center font-bold">🔒 إجراء محمي</div>
                  <div className="p-6">
                    <p className="text-center text-sm mb-4">أدخل رمز الحماية (PIN) للمتابعة</p>
                    <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4" autoFocus className="w-full border-b-2 border-red-400 p-2 text-center text-3xl tracking-[0.5em] font-bold outline-none focus:border-red-600 transition-colors bg-slate-50" 
                      onChange={e => { if(e.target.value === data.pinCode) { closeModal(); setTimeout(appModal.props.onSuccess, 50); } }} />
                  </div>
                  <button onClick={closeModal} className="w-full p-4 bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">إلغاء</button>
                </div>
              )}

              {appModal.type === 'CONFIRM' && (
                <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}>
                  <div className="bg-slate-900 text-white p-4 text-center font-bold text-lg">{appModal.props.title || 'تأكيد'}</div>
                  <div className="p-6 text-center text-slate-700 font-medium">{appModal.props.message}</div>
                  <div className="flex border-t">
                    <button onClick={()=>{appModal.props.onConfirm(); closeModal();}} className="flex-1 p-4 font-bold text-blue-700 hover:bg-blue-50 border-l">نعم، متأكد</button>
                    <button onClick={closeModal} className="flex-1 p-4 font-bold text-slate-500 hover:bg-slate-100">إلغاء</button>
                  </div>
                </div>
              )}

              {appModal.type === 'PROMPT_INST' && (
                <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}>
                  <div className="bg-blue-800 text-white p-4 text-center font-bold">{appModal.props.title}</div>
                  <form onSubmit={e => { e.preventDefault(); appModal.props.onConfirm(e.target.amount.value, e.target.date?.value); closeModal(); }} className="p-6 space-y-4">
                    {appModal.props.showDate && <div><label className="text-xs text-slate-500">التاريخ</label><input name="date" type="date" required defaultValue={appModal.props.defaultDate} className="w-full border p-3 rounded font-bold bg-slate-50"/></div>}
                    <div><label className="text-xs text-slate-500">المبلغ</label><NumberInput name="amount" required value={appModal.props.defaultAmount} onChange={(v)=>e.target.amount.value=v} className="w-full border-2 border-blue-400 p-3 rounded font-bold text-xl text-center outline-none focus:border-blue-600" /></div>
                    <div className="flex gap-2 pt-2"><button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow">حفظ</button><button type="button" onClick={closeModal} className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">إلغاء</button></div>
                  </form>
                </div>
              )}
            </div>
          )}

          <main className="flex-grow p-4 mx-auto w-full max-w-7xl">
            
            {/* Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 print-hide animate-fade-in">
                
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-lg font-bold text-slate-800">المركز المالي العام</h2>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-xl border border-blue-200 shadow-inner">
                      <p className="text-sm text-blue-800 mb-1 font-medium">مستحقات الشهر الحالي</p>
                      <p className="text-3xl font-black text-blue-900">{monthInstallments.reduce((sum, i) => sum + i.amount, 0).toLocaleString()}</p>
                    </div>
                    
                    <div className="bg-gradient-to-br from-amber-50 to-orange-100 p-4 rounded-xl border border-amber-200 shadow-inner relative">
                      <p className="text-sm text-amber-800 mb-2 font-medium">استعلام عن عهدة (أو أكثر)</p>
                      <MultiSelectDropdown options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} selected={dashboardCustodyFilter} onChange={setDashboardCustodyFilter} placeholder="-- الخزينة العامة --" />
                      <p className="text-2xl font-black text-amber-600 mt-3">الصافي: {dashboardNet.toLocaleString()} ج.م</p>
                      <div className="flex gap-2 mt-4 pt-3 border-t border-amber-200">
                        <button onClick={() => goToTransaction('income')} className="flex-1 bg-emerald-500 text-white py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-600 transition">➕ إيراد</button>
                        <button onClick={() => goToTransaction('expense')} className="flex-1 bg-red-500 text-white py-2 rounded-lg text-sm font-bold shadow hover:bg-red-600 transition">➖ مصروف</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">

                  ) : (
                    <>
                      <h4 className="text-2xl font-black border-b-2 border-black mt-4 mb-3 pb-1">تقرير الأقساط المستحقة</h4>
                      <table>
                        <thead className="bg-gray-100 text-lg"><tr><th>التاريخ</th><th>العميل</th><th>العمارة</th><th>الحالة</th><th>المبلغ</th></tr></thead>
                        <tbody>
                          {reportInstallments.map(i => {
                            const c = (data.contracts||[]).find(ct=>ct.id===i.contractId);
                            const b = (data.buildings||[]).find(bd=>bd.id===c?.buildingId);
                            return (
                              <tr key={i.id}><td dir="ltr" className="text-center">{formatShortDate(i.dueDate)}</td><td className="font-bold">{c?.clientName}</td><td className="text-center">{b?.name}</td><td className="text-center">{i.status==='paid'?'مدفوع':'مستحق'}</td><td className="text-center font-bold">{Number(i.amount).toLocaleString()}</td></tr>
                            )
                          })}
                          {reportInstallments.length === 0 && <tr><td colSpan="5" className="text-center py-2 text-gray-500">لا توجد أقساط</td></tr>}
                        </tbody>
                      </table>
                      <div className="text-left mt-3 mb-6 text-2xl font-black">إجمالي الأقساط: {reportInstallments.reduce((s,i)=>s+Number(i.amount),0).toLocaleString()}</div>
                    </>
                  )}
                </div>

                {/* --- SCREEN VIEW --- */}
                <div className="print-hide">
                  <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                    <button onClick={()=>setReportType('transactions')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${reportType==='transactions'?'bg-white text-blue-700 shadow-sm':'text-slate-500 hover:bg-slate-200'}`}>كشف حساب العهد</button>
                    <button onClick={()=>setReportType('installments')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${reportType==='installments'?'bg-white text-blue-700 shadow-sm':'text-slate-500 hover:bg-slate-200'}`}>تقرير الأقساط</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 bg-slate-50 p-5 rounded-xl border border-slate-200 shadow-inner">
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">من تاريخ</label><input type="date" className="w-full border-2 p-2.5 text-sm rounded-lg font-bold focus:border-blue-400 outline-none" value={reportFilter.startDate} onChange={e=>setReportFilter({...reportFilter, startDate: e.target.value})}/></div>
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">إلى تاريخ</label><input type="date" className="w-full border-2 p-2.5 text-sm rounded-lg font-bold focus:border-blue-400 outline-none" value={reportFilter.endDate} onChange={e=>setReportFilter({...reportFilter, endDate: e.target.value})}/></div>
                    
                    {reportType === 'transactions' && (
                      <div className="relative z-30">
                        <label className="text-xs font-bold text-slate-500 mb-1 block">العهدة (متعدد)</label>
                        <MultiSelectDropdown options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} selected={reportFilter.custodyIds} onChange={(newIds) => setReportFilter({...reportFilter, custodyIds: newIds})} placeholder="-- كل العهد --" />
                      </div>
                    )}
                    
                    <div className="relative z-20">
                      <label className="text-xs font-bold text-slate-500 mb-1 block">العمارة (متعدد)</label>
                      <MultiSelectDropdown options={sortedBuildings.map(b => ({ id: b.id, label: b.name }))} selected={reportFilter.buildingIds} onChange={(newIds) => setReportFilter({...reportFilter, buildingIds: newIds})} placeholder="-- كل العمارات --" />
                    </div>
                  </div>

                  <button onClick={handlePrint} className="w-full bg-slate-800 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-slate-900 transition-colors">🖨️ طباعة التقرير PDF</button>
                </div>
              </div>
            )}

            {/* Settings Tab */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 print-hide animate-fade-in">
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2">إضافة تصنيف مصروفات</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg('تمت الإضافة');}} className="flex gap-2 mb-4">
                    <input required type="text" placeholder="مثال: تشطيبات..." className="border-2 p-2.5 text-sm flex-grow rounded-xl font-bold focus:border-blue-400 outline-none" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/>
                    <button className="bg-slate-800 text-white px-5 rounded-xl text-sm font-bold shadow hover:bg-slate-900 transition">إضافة</button>
                  </form>
                  <div className="flex flex-wrap gap-2">{sortedCategories.map(c=><span key={c.id} className="bg-slate-100 border p-1.5 px-3 rounded-lg text-xs font-bold text-slate-600">{c.name}</span>)}</div>
                </div>
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2">تسليم عهدة لمسؤول جديد</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg('تم تسجيل العهدة');}} className="space-y-3">
                    <input required type="text" placeholder="اسم المسؤول" className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none" value={newCustody.personName} onChange={e=>setNewCustody({...newCustody, personName:e.target.value})}/>
                    <NumberInput required placeholder="المبلغ الأصلي للعهدة" className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none" value={newCustody.totalAmount} onChange={v=>setNewCustody({...newCustody, totalAmount:v})}/>
                    <button className="bg-slate-800 text-white p-3 rounded-xl w-full text-sm font-bold shadow hover:bg-slate-900 transition">حفظ العهدة</button>
                  </form>
                </div>

                <div className="bg-white p-6 shadow-sm rounded-2xl md:col-span-2 text-center border-2 border-dashed border-blue-300">
                  <h4 className="font-bold mb-2 text-blue-900 text-lg">النسخ الاحتياطي للأمان</h4>
                  <p className="text-xs mb-5 text-slate-500 font-medium">احفظ نسخة من بياناتك لتجنب فقدانها. يتم الحفظ باسم (نسخة_العقارات_التاريخ).</p>
                  <div className="flex flex-col sm:flex-row gap-3 justify-center">
                    <button onClick={()=>{const b=new Blob([JSON.stringify(data)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`نسخة_العقارات_${todayDateStr}.json`;l.click();}} className="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">⬇️ تصدير وحفظ نسخة</button>
                    <label className="bg-amber-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-amber-700 transition cursor-pointer">⬆️ استرجاع بيانات<input type="file" accept=".json" className="hidden" onChange={(e)=>{const r=new FileReader();r.onload=(ev)=>{try{setData(JSON.parse(ev.target.result));showMsg('تم الاسترجاع بنجاح');}catch{showMsg('ملف غير صالح',true);}};if(e.target.files[0])r.readAsText(e.target.files[0]);}}/></label>
                  </div>
                </div>

                <div className="bg-red-50 p-6 shadow-sm rounded-2xl md:col-span-2 border border-red-200 mt-2">
                  <h4 className="font-bold mb-2 text-red-700 text-center text-lg">منطقة الخطر (إعادة ضبط المصنع)</h4>
                  <button onClick={handleResetFactory} className="w-full bg-red-600 text-white py-3 rounded-xl text-md font-bold shadow-md hover:bg-red-700 transition">⚠️ مسح كافة البيانات وتصفير البرنامج</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    
    // Patch payInstallment signature for Modal callback
    // (Included directly inside the component in production logic above)

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
  </script>
</body>
</html>
