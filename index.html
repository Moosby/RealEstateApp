<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة العقارات</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; font-weight: bold !important; font-size: 1.1rem !important; }
      .print-hide { display: none !important; }
      .print-show { display: block !important; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      th, td { border: 2px solid black !important; padding: 4px 8px !important; }
      .print-row-text { font-size: 0.95rem !important; }
      .print-header { font-size: 1.2rem !important; }
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body className="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const todayDateStr = new Date().toISOString().substring(0, 10);

    // --- قاموس الترجمة (i18n) ---
    const dict = {
      ar: {
        appTitle: "إدارة العقارات",
        tab_dash: "الرئيسية", tab_tx: "إيراد/مصروف", tab_cust: "العهد", tab_inv: "الوحدات", tab_sales: "المبيعات", tab_rep: "التقارير",
        income: "إيراد", expense: "مصروف", addIncome: "➕ إضافة إيراد", addExpense: "➖ تسجيل مصروف",
        date: "التاريخ", amount: "المبلغ (ج.م)", desc: "البيان (التفاصيل)",
        custody: "العهدة / الخزينة", building: "العمارة", unit: "الوحدة", category: "تصنيف المصروف",
        save: "حفظ في السجل", update: "تحديث البيانات", cancel: "إلغاء", edit: "تعديل", delete: "حذف",
        allCustodies: "-- الخزينة العامة --", allBuildings: "-- عام --", selectCat: "-- اختر التصنيف --",
        monthDues: "مستحق هذا الشهر", activeCustody: "الاستعلام السريع عن العهد", net: "الصافي",
        addCat: "إضافة تصنيف مصروفات", newCustody: "تسليم عهدة لمسؤول جديد", settings: "الإعدادات والأمان",
        backup: "النسخ الاحتياطي للأمان", reset: "إعادة ضبط المصنع",
        lang: "لغة البرنامج / Language", yes: "نعم متأكد", no: "إلغاء",
        txTitle: "تسجيل حركة نقدية"
      },
      en: {
        appTitle: "Estate Manager",
        tab_dash: "Dashboard", tab_tx: "Transactions", tab_cust: "Custody", tab_inv: "Inventory", tab_sales: "Sales", tab_rep: "Reports",
        income: "Income", expense: "Expense", addIncome: "➕ Add Income", addExpense: "➖ Add Expense",
        date: "Date", amount: "Amount", desc: "Description (Details)",
        custody: "Custody / Safe", building: "Building", unit: "Unit", category: "Expense Category",
        save: "Save Record", update: "Update Record", cancel: "Cancel", edit: "Edit", delete: "Delete",
        allCustodies: "-- General Safe --", allBuildings: "-- General --", selectCat: "-- Select Category --",
        monthDues: "Monthly Dues", activeCustody: "Custody Balance", net: "Net",
        addCat: "Add Expense Category", newCustody: "Assign New Custody", settings: "Settings & Security",
        backup: "Backup & Security", reset: "Factory Reset",
        lang: "Language / لغة البرنامج", yes: "Yes, Confirm", no: "Cancel",
        txTitle: "Record Transaction"
      }
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 m-4 bg-red-50 border-2 border-red-500 rounded-2xl text-red-900 shadow-xl">
              <h2 className="text-2xl font-black mb-3">⚠️ حدث خطأ في النظام</h2>
              <button onClick={() => { localStorage.removeItem('real_estate_core_data'); window.location.reload(); }} className="w-full bg-red-600 text-white py-4 rounded-xl font-black">🔄 مسح التعارض وإعادة تشغيل التطبيق</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function NumberInput({ value, onChange, placeholder, className, required }) {
      const displayVal = (value !== '' && value !== undefined && value !== null && !isNaN(value)) ? Number(value).toLocaleString('en-US') : '';
      return ( <input type="text" inputMode="numeric" value={displayVal} placeholder={placeholder} required={required} className={className} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ''); onChange(raw); }} /> );
    }

    function MultiSelectDropdown({ options, selected, onChange, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);
      useEffect(() => {
        const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);
      return (
        <div className="relative z-20 w-full" ref={dropdownRef}>
          <div className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl bg-white cursor-pointer font-bold flex justify-between items-center shadow-sm hover:border-blue-400 transition" onClick={() => setIsOpen(!isOpen)}>
            <span className="truncate">{(selected || []).length === 0 ? placeholder : `(${selected.length})`}</span><span className="text-xs text-blue-600">▼</span>
          </div>
          {isOpen && (
            <div className="absolute top-full right-0 w-full bg-white border-2 border-slate-200 mt-1 shadow-2xl max-h-48 overflow-y-auto z-50 p-2 space-y-2 rounded-xl animate-fade-in">
              <label className="flex items-center gap-2 cursor-pointer font-bold border-b pb-2 text-slate-700 hover:bg-slate-50 p-1 rounded"><input type="checkbox" checked={(selected || []).length===0} onChange={()=>onChange([])} className="w-4 h-4 text-blue-600"/> --- </label>
              {(options || []).map(opt => (
                <label key={opt.id} className="flex items-center gap-2 cursor-pointer whitespace-nowrap text-sm hover:bg-slate-50 p-1 rounded transition">
                  <input type="checkbox" checked={(selected || []).includes(opt.id)} className="w-4 h-4 text-blue-600" onChange={(e)=>{ const newIds = e.target.checked ? [...(selected || []), opt.id] : (selected || []).filter(id=>id!==opt.id); onChange(newIds); }}/> {opt.label}
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

    const initialData = { pinCode: '0000', buildings: [], units: [], categories: [], contracts: [], installments: [], custodies: [], transactions: [] };

    function MainApp() {
      // Language State
      const [lang, setLang] = useState(() => localStorage.getItem('real_estate_lang') || 'ar');
      const t = dict[lang];

      useEffect(() => {
        localStorage.setItem('real_estate_lang', lang);
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        if (saved) { try { const parsed = JSON.parse(saved); return { ...initialData, ...parsed }; } catch (e) { return initialData; } }
        return initialData;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState({ show: false, msg: '', isError: false });
      const [appModal, setAppModal] = useState({ show: false, type: '', props: {} });
      const [editingTxId, setEditingTxId] = useState(null);

      const [newBuilding, setNewBuilding] = useState('');
      const [newUnit, setNewUnit] = useState({ buildingId: '', unitNumber: '', price: '' });
      const [newCategory, setNewCategory] = useState('');
      const [newCustody, setNewCustody] = useState({ personName: '', totalAmount: '', notes: '' });
      
      const [newTransaction, setNewTransaction] = useState({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', description: '', date: todayDateStr });
      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' });
      
      const [reportType, setReportType] = useState('transactions'); 
      const [reportFilter, setReportFilter] = useState({ startDate: '', endDate: '', custodyIds: [], buildingIds: [] });
      const [dashboardCustodyFilter, setDashboardCustodyFilter] = useState(() => { try { const s=localStorage.getItem('real_estate_last_custody'); if(!s) return []; const p = JSON.parse(s); return Array.isArray(p) ? p : [p].filter(Boolean); }catch(e){return [];} });
      
      const [selectedCustodies, setSelectedCustodies] = useState([]);
      const [custodyTabSub, setCustodyTabSub] = useState('income');
      const [custodySearch, setCustodySearch] = useState('');
      const [descFocus, setDescFocus] = useState(false);
      const [showMonthDetails, setShowMonthDetails] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_core_data', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('real_estate_last_custody', JSON.stringify(dashboardCustodyFilter)); }, [dashboardCustodyFilter]);

      useEffect(() => {
        window.history.pushState(null, '', window.location.href);
        const handlePopState = () => {
          setAppModal({ show: true, type: 'CONFIRM', props: { title: lang==='ar'?'تأكيد الخروج':'Exit', message: lang==='ar'?'هل تريد الخروج من البرنامج؟':'Do you want to exit?', onConfirm: () => { window.history.back(); } }});
          window.history.pushState(null, '', window.location.href);
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [lang]);

      const showMsg = (msg, isError = false) => { setToast({ show: true, msg, isError }); setTimeout(() => setToast(p => ({ ...p, show: false })), 3500); };
      const closeModal = () => setAppModal({ show: false, type: '', props: {} });
      const requirePin = (onSuccess) => setAppModal({ show: true, type: 'PIN', props: { onSuccess } });
      const formatShortDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].substring(2)}` : d; };

      const allDescriptions = useMemo(() => {
        const descs = [];
        for (let i = (data.transactions || []).length - 1; i >= 0; i--) { const d = data.transactions[i]?.description; if (d && !descs.includes(d)) descs.push(d); }
        return descs;
      }, [data.transactions]);
      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(tx => tx.type === 'expense' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          const incomes = (data.transactions || []).filter(tx => tx.type === 'income' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount || 0) + incomes - expenses };
        });
      }, [data]);

      const dashboardNet = (dashboardCustodyFilter || []).length === 0 ? 0 : custodyCalculations.filter(c => (dashboardCustodyFilter || []).includes(c.id)).reduce((s, c) => s + c.remaining, 0);

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if(!newTransaction.amount) return;
        if (editingTxId) {
          setData(prev => ({ ...prev, transactions: prev.transactions.map(tx => tx.id === editingTxId ? { ...tx, ...newTransaction, amount: Number(newTransaction.amount) } : tx) }));
          setEditingTxId(null); showMsg(lang==='ar'?'تم التحديث':'Updated');
        } else {
          const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) };
          setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] })); showMsg(lang==='ar'?'تم الحفظ':'Saved');
        }
        setNewTransaction(prev => ({ ...prev, amount: '', description: '' })); 
      };

      const handleResetFactory = () => { if (!requirePin()) return showMsg('Error', true); if (window.confirm('RESET EVERYTHING?')) { localStorage.clear(); window.location.reload(); } };
      
      const goToTransaction = (type) => {
        const preSelectedCustody = (dashboardCustodyFilter || []).length > 0 ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate?.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));

      const tabs = [
        { id: 'dashboard', label: t.tab_dash }, { id: 'transactions', label: t.tab_tx },
        { id: 'custody', label: t.tab_cust }, { id: 'inventory', label: t.tab_inv },
        { id: 'sales', label: t.tab_sales }, { id: 'reports', label: t.tab_rep }
      ];

      const sortedCustodies = [...(data.custodies || [])].reverse();
      const sortedBuildings = [...(data.buildings || [])].reverse();
      const sortedCategories = [...(data.categories || [])].reverse();

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">
          <header className="bg-slate-900 text-white p-4 shadow-lg print-hide flex justify-between items-center relative z-40">
            <h1 className="text-xl font-bold tracking-wide flex items-center gap-2">🏢 <span>{t.appTitle}</span></h1>
            <button onClick={() => setActiveTab('settings')} className="text-2xl hover:rotate-90 transition-transform">⚙️</button>
          </header>

          <nav className="bg-slate-800 text-slate-200 grid grid-cols-3 border-b border-slate-700 print-hide shadow-md">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => {setActiveTab(tab.id); setEditingTxId(null);}} 
                className={`p-3 text-sm font-bold text-center border-b border-l border-slate-700 transition-colors ${activeTab === tab.id ? 'bg-slate-100 text-blue-800 border-b-4 border-b-blue-600 shadow-inner' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {toast.show && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[200] animate-slide-up print-hide w-[90%] max-w-sm">
              <div className={`px-6 py-4 rounded-2xl shadow-2xl font-bold text-white flex items-center justify-center gap-3 ${toast.isError ? 'bg-red-600' : 'bg-emerald-600'}`}>
                <span className="text-2xl">{toast.isError ? '⚠️' : '✅'}</span><span className="text-lg">{toast.msg}</span>
              </div>
            </div>
          )}

          <main className="flex-grow p-4 mx-auto w-full max-w-7xl relative z-10">
            
            {/* Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 print-hide animate-fade-in">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-5 rounded-2xl border border-blue-200 shadow-inner cursor-pointer hover:shadow-md transition" onClick={() => setShowMonthDetails(!showMonthDetails)}>
                      <div className="flex justify-between items-center mb-2">
                        <p className="text-sm text-blue-800 font-bold">{t.monthDues}</p>
                      </div>
                      <p className="text-4xl font-black text-blue-900 mt-2">{monthInstallments.reduce((sum, i) => sum + Number(i.amount||0), 0).toLocaleString()} </p>
                    </div>
                    
                    <div className="bg-gradient-to-br from-amber-50 to-orange-100 p-5 rounded-2xl border border-amber-200 shadow-inner">
                      <p className="text-sm text-amber-900 mb-2 font-bold">{t.activeCustody}</p>
                      <MultiSelectDropdown options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} selected={dashboardCustodyFilter} onChange={setDashboardCustodyFilter} placeholder={t.allCustodies} />
                      <p className="text-3xl font-black text-amber-600 mt-4">{t.net}: {dashboardNet.toLocaleString()} </p>
                      <div className="flex gap-3 mt-5 pt-4 border-t border-amber-200/60">
                        <button onClick={() => goToTransaction('income')} className="flex-1 bg-emerald-500 text-white py-3 rounded-xl text-sm font-bold shadow-md hover:bg-emerald-600 transition">➕</button>
                        <button onClick={() => goToTransaction('expense')} className="flex-1 bg-red-500 text-white py-3 rounded-xl text-sm font-bold shadow-md hover:bg-red-600 transition">➖</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* إيراد أو مصروف (Transactions Form) */}
            {activeTab === 'transactions' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto print-hide animate-fade-in">
                <h3 className="font-bold text-2xl mb-6 text-center text-slate-800 border-b pb-3">{editingTxId ? t.edit : t.txTitle}</h3>
                
                <form onSubmit={handleSaveTransaction} className="space-y-5">
                  <div className="flex gap-4 p-2 bg-slate-50 rounded-xl border border-slate-200 shadow-inner">
                    <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-lg cursor-pointer font-bold transition-all ${newTransaction.type === 'income' ? 'bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-300' : 'text-slate-500 hover:bg-slate-200'}`}>
                      <input type="radio" className="hidden" checked={newTransaction.type === 'income'} onChange={()=>setNewTransaction({...newTransaction, type:'income'})}/> {t.addIncome}
                    </label>
                    <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-lg cursor-pointer font-bold transition-all ${newTransaction.type === 'expense' ? 'bg-red-100 text-red-800 shadow-sm border border-red-300' : 'text-slate-500 hover:bg-slate-200'}`}>
                      <input type="radio" className="hidden" checked={newTransaction.type === 'expense'} onChange={()=>setNewTransaction({...newTransaction, type:'expense'})}/> {t.addExpense}
                    </label>
                  </div>
                  
                  {/* ترتيب الخانات وتعديل أحجامها */}
                  <div><label className="text-sm font-bold text-slate-500 mb-1 block">{t.date}</label><input type="date" required className="w-full border-2 border-slate-200 p-3 text-md rounded-xl bg-slate-50 focus:border-blue-500 outline-none transition font-mono" value={newTransaction.date} onChange={e=>setNewTransaction({...newTransaction, date: e.target.value})}/></div>
                  
                  {/* Amount (Smaller height) */}
                  <div><label className="text-sm font-bold text-slate-500 mb-1 block">{t.amount}</label><NumberInput required value={newTransaction.amount} onChange={v=>setNewTransaction({...newTransaction, amount: v})} className="w-full border-2 border-slate-300 p-3 text-xl rounded-xl font-black text-slate-800 bg-white focus:border-blue-500 outline-none transition" /></div>
                  
                  {/* Description (Larger height, directly under Amount) */}
                  <div className="relative">
                    <label className="text-sm font-bold text-slate-500 mb-1 block">{t.desc}</label>
                    <textarea rows="3" required placeholder="..." className="w-full border-2 border-slate-300 p-4 text-xl rounded-xl font-bold bg-white focus:border-blue-500 outline-none transition shadow-inner resize-none" value={newTransaction.description} 
                      onChange={e => setNewTransaction({...newTransaction, description: e.target.value})} onFocus={() => setDescFocus(true)} onBlur={() => setTimeout(() => setDescFocus(false), 200)}></textarea>
                    {descFocus && newTransaction.description && filteredDescs.length > 0 && (
                      <div className="absolute top-full left-0 right-0 bg-white border-2 border-slate-200 mt-1 shadow-2xl z-50 max-h-48 overflow-y-auto rounded-xl animate-fade-in">
                        {filteredDescs.map((d, idx) => <div key={idx} className="p-4 text-md border-b hover:bg-blue-50 cursor-pointer font-bold text-slate-700" onMouseDown={() => setNewTransaction({...newTransaction, description: d})}>{d}</div>)}
                      </div>
                    )}
                  </div>

                  {/* Dropdowns */}
                  <div className="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4">
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.custody}</label><select className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl font-bold text-blue-800 bg-slate-50 focus:border-blue-500 outline-none transition" value={newTransaction.custodyId} onChange={e=>setNewTransaction({...newTransaction, custodyId: e.target.value})}><option value="">{t.allCustodies}</option>{sortedCustodies.map(c=><option key={c.id} value={c.id}>{c.personName}</option>)}</select></div>
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.building}</label><select className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl font-bold bg-slate-50 focus:border-blue-500 outline-none transition" value={newTransaction.buildingId} onChange={e=>setNewTransaction({...newTransaction, buildingId: e.target.value})}><option value="">{t.allBuildings}</option>{sortedBuildings.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                  </div>
                  
                  {newTransaction.type === 'expense' && <div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.category}</label><select className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl font-bold bg-slate-50 focus:border-blue-500 outline-none transition" required value={newTransaction.categoryId} onChange={e=>setNewTransaction({...newTransaction, categoryId: e.target.value})}><option value="">{t.selectCat}</option>{sortedCategories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>}
                  
                  <button className={`w-full text-white py-4 rounded-xl text-xl font-black shadow-lg transition hover:-translate-y-1 ${editingTxId ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}>{editingTxId ? t.update : t.save}</button>
                  {editingTxId && <button type="button" onClick={()=>{setEditingTxId(null); setNewTransaction({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', description: '', date: todayDateStr });}} className="w-full mt-2 text-slate-500 font-bold py-2 hover:bg-slate-100 rounded-xl transition">{t.cancel}</button>}
                </form>
              </div>
            )}

            {/* Settings Tab */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 print-hide animate-fade-in">
                
                {/* Language Switcher */}
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2 flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                  <h4 className="font-bold text-lg">{t.lang}</h4>
                  <div className="flex bg-slate-700 p-1 rounded-xl">
                    <button onClick={() => setLang('ar')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'ar' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>عربي</button>
                    <button onClick={() => setLang('en')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'en' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>English</button>
                  </div>
                </div>

                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">🏷️ {t.addCat}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg('Added');}} className="flex flex-col gap-3 mb-4">
                    <input required type="text" placeholder="..." className="border-2 p-3 text-md w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/>
                    <button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition">{t.addCat}</button>
                  </form>
                  <div className="flex flex-wrap gap-2">{sortedCategories.map(c=><span key={c.id} className="bg-slate-100 border border-slate-200 p-2 px-3 rounded-lg text-xs font-bold text-slate-700 shadow-sm">{c.name}</span>)}</div>
                </div>
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">👤 {t.newCustody}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg('Saved');}} className="space-y-4">
                    <input required type="text" placeholder="..." className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.personName} onChange={e=>setNewCustody({...newCustody, personName:e.target.value})}/>
                    <NumberInput required placeholder="0.00" className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.totalAmount} onChange={v=>setNewCustody({...newCustody, totalAmount:v})}/>
                    <button className="bg-slate-800 text-white p-4 rounded-xl w-full text-md font-bold shadow-lg hover:bg-slate-900 transition">{t.save}</button>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
  </script>
</body>
</html>
