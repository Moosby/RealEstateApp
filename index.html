<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة العقارات</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; font-weight: bold !important; font-size: 1.1rem !important; }
      .print-hide { display: none !important; }
      .print-show { display: block !important; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      th, td { border: 2px solid black !important; padding: 4px 8px !important; }
      .print-row-text { font-size: 0.95rem !important; }
      .print-header { font-size: 1.2rem !important; }
    }
  </style>
</head>
<body className="bg-slate-100 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const todayDateStr = new Date().toISOString().substring(0, 10);

    // مكون القائمة المنسدلة الذكية (تغلق بالضغط خارجها)
    function MultiSelectDropdown({ options, selected, onChange, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative z-20 w-full" ref={dropdownRef}>
          <div className="w-full border p-2 text-sm rounded bg-white cursor-pointer font-bold flex justify-between items-center" onClick={() => setIsOpen(!isOpen)}>
            <span className="truncate">{selected.length === 0 ? placeholder : `محدد (${selected.length})`}</span>
            <span className="text-xs">▼</span>
          </div>
          {isOpen && (
            <div className="absolute top-full right-0 w-full bg-white border mt-1 shadow-2xl max-h-48 overflow-y-auto z-50 p-2 space-y-2 rounded">
              <label className="flex items-center gap-2 cursor-pointer font-bold border-b pb-2">
                <input type="checkbox" checked={selected.length === 0} onChange={() => onChange([])} /> الكل / غير محدد
              </label>
              {options.map(opt => (
                <label key={opt.id} className="flex items-center gap-2 cursor-pointer whitespace-nowrap text-sm">
                  <input type="checkbox" checked={selected.includes(opt.id)} onChange={(e) => {
                    const newIds = e.target.checked ? [...selected, opt.id] : selected.filter(id => id !== opt.id);
                    onChange(newIds);
                  }} /> {opt.label}
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

    const initialData = { pinCode: '0000', buildings: [], units: [], categories: [], contracts: [], installments: [], custodies: [], transactions: [] };

    function MainApp() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        if (saved) { try { const parsed = JSON.parse(saved); return { ...initialData, ...parsed }; } catch (e) { return initialData; } }
        return initialData;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const [newBuilding, setNewBuilding] = useState('');
      const [newUnit, setNewUnit] = useState({ buildingId: '', unitNumber: '', price: '' });
      const [newCategory, setNewCategory] = useState('');
      const [newPin, setNewPin] = useState('');
      const [newCustody, setNewCustody] = useState({ personName: '', totalAmount: '', notes: '' });
      
      const [newTransaction, setNewTransaction] = useState({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', description: '', date: todayDateStr });
      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' });
      
      const [reportType, setReportType] = useState('transactions'); 
      const [reportFilter, setReportFilter] = useState({ startDate: '', endDate: '', custodyIds: [], buildingIds: [] });
      
      // حفظ العهدة المحددة في الرئيسية كمصفوفة لدعم التحديد المتعدد
      const [dashboardCustodyFilter, setDashboardCustodyFilter] = useState(() => {
         try {
           const saved = localStorage.getItem('real_estate_last_custody');
           if (!saved) return [];
           const parsed = JSON.parse(saved);
           return Array.isArray(parsed) ? parsed : [saved];
         } catch(e) { return []; }
      });

      const [showMonthDetails, setShowMonthDetails] = useState(false);
      const [selectedCustodies, setSelectedCustodies] = useState([]);
      const [custodyTabSub, setCustodyTabSub] = useState('income');
      const [custodySearch, setCustodySearch] = useState('');

      // Autocomplete state
      const [descFocus, setDescFocus] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_core_data', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('real_estate_last_custody', JSON.stringify(dashboardCustodyFilter)); }, [dashboardCustodyFilter]);

      const showMsg = (msg, isError = false) => { isError ? setErrorMsg(msg) : setSuccessMsg(msg); setTimeout(() => { setErrorMsg(''); setSuccessMsg(''); }, 3000); };
      const requirePin = () => { const pin = window.prompt('أدخل رمز الحماية (PIN) لإتمام هذه العملية:'); return pin === data.pinCode; };
      const formatShortDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].substring(2)}` : d; };

      // جلب ووصف الكلمات السابقة للبحث التلقائي (من الأحدث للأقدم)
      const allDescriptions = useMemo(() => {
        const descs = [];
        for (let i = (data.transactions || []).length - 1; i >= 0; i--) {
          const d = data.transactions[i].description;
          if (d && !descs.includes(d)) descs.push(d);
        }
        return descs;
      }, [data.transactions]);

      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(t => t.type === 'expense' && t.custodyId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
          const incomes = (data.transactions || []).filter(t => t.type === 'income' && t.custodyId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount) + incomes - expenses };
        });
      }, [data]);

      // صافي العهد المحددة في الرئيسية
      const dashboardNet = dashboardCustodyFilter.length === 0 ? 0 : custodyCalculations.filter(c => dashboardCustodyFilter.includes(c.id)).reduce((s, c) => s + c.remaining, 0);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(t => {
          if (selectedCustodies.length > 0 && !selectedCustodies.includes(t.custodyId)) return false;
          if (t.type !== custodyTabSub) return false;
          if (custodySearch && !t.description.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(a.date) - new Date(b.date));
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjs = reportFilter.custodyIds.length > 0 ? (data.custodies || []).filter(c => reportFilter.custodyIds.includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjs.forEach(c => {
           let bal = Number(c.totalAmount);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(t => t.custodyId === c.id && t.date < reportFilter.startDate);
              const bInc = beforeTrans.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
              const bExp = beforeTrans.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
              bal = bal + bInc - bExp;
           }
           openingBalance += bal;
        });

        const custodyName = reportFilter.custodyIds.length === 0 ? 'كل العهد / الخزينة العامة' : selectedCustodyObjs.map(c=>c.personName).join(' + ');

        const filtered = (data.transactions || []).filter(t => {
          if (reportFilter.startDate && t.date < reportFilter.startDate) return false;
          if (reportFilter.endDate && t.date > reportFilter.endDate) return false;
          if (reportFilter.custodyIds.length > 0 && !reportFilter.custodyIds.includes(t.custodyId)) return false;
          if (reportFilter.buildingIds.length > 0 && !reportFilter.buildingIds.includes(t.buildingId)) return false;
          return true;
        }).sort((a,b) => new Date(a.date) - new Date(b.date));

        const incomes = filtered.filter(t => t.type === 'income');
        const expenses = filtered.filter(t => t.type === 'expense');
        const totalIncomes = incomes.reduce((s,t) => s + Number(t.amount), 0);
        const totalExpenses = expenses.reduce((s,t) => s + Number(t.amount), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName };
      }, [data, reportFilter]);

      const handlePrint = () => {
        const originalTitle = document.title;
        const printName = reportType === 'transactions' ? reportData.custodyName : 'تقرير_الاقساط';
        document.title = `${printName.replace(/\s+/g, '_')}_${todayDateStr}.pdf`;
        setTimeout(() => { window.print(); document.title = originalTitle; }, 100);
      };

      const handleTransactionAction = (trans) => {
        const action = window.prompt("اختر الإجراء:\n1 - تعديل الحركة\n2 - حذف الحركة", "");
        if (action === '2') {
          if (!requirePin()) return showMsg('رمز الحماية غير صحيح!', true);
          setData(p => ({ ...p, transactions: p.transactions.filter(t => t.id !== trans.id) }));
          showMsg('تم الحذف');
        } else if (action === '1') {
          const nAmount = window.prompt("المبلغ:", trans.amount); if (nAmount === null) return;
          const nDate = window.prompt("التاريخ (YYYY-MM-DD):", trans.date);
          const nDesc = window.prompt("البيان:", trans.description);
          setData(p => ({ ...p, transactions: p.transactions.map(t => t.id === trans.id ? { ...t, amount: Number(nAmount)||t.amount, date: nDate||t.date, description: nDesc||t.description } : t) }));
          showMsg('تم التعديل');
        }
      };

      const handleResetFactory = () => { if (!requirePin()) return showMsg('الرمز خطأ', true); if (window.confirm('سيتم مسح كل شيء نهائياً. متأكد؟')) { localStorage.removeItem('real_estate_core_data'); window.location.reload(); } };
      const addBuilding = (e) => { e.preventDefault(); setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding}]})); setNewBuilding(''); showMsg('تمت إضافة العمارة'); };
      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg('تمت الإضافة'); };
      const addContract = (e) => { e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return showMsg('اختر الوحدة أولاً', true); const contractId = 'cont_' + Date.now(); const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); const contract = { id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active' }; const newInsts = []; let curDate = new Date(newContract.firstInstallmentDate); const instAmount = count > 0 ? ((total - dp) / count) : 0; for(let i=0; i<count; i++) { newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: instAmount, dueDate: curDate.toISOString().split('T')[0], status: 'pending' }); curDate.setMonth(curDate.getMonth() + 1); } const trans = { id: 't_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, description: `مقدم تعاقد: ${newContract.clientName}`, date: todayDateStr }; setData(prev => ({ ...prev, contracts: [...(prev.contracts || []), contract], installments: [...(prev.installments || []), ...newInsts], transactions: [...(prev.transactions || []), trans], units: (prev.units || []).map(u => u.id === unit.id ? { ...u, status: 'sold' } : u) })); setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '' }); showMsg('تم تسجيل العقد بنجاح'); };
      const payInstallment = (instId, fullAmount, clientName, buildingId) => { const paidStr = window.prompt(`المبلغ المستحق: ${fullAmount}\nأدخل المبلغ المدفوع:`, fullAmount); if (!paidStr) return; const paid = Number(paidStr); if (paid <= 0 || paid > fullAmount) return showMsg('مبلغ غير صحيح', true); setData(prev => { let updatedInsts = prev.installments || []; if (paid === fullAmount) { updatedInsts = updatedInsts.map(i => i.id === instId ? { ...i, status: 'paid' } : i); } else { updatedInsts = updatedInsts.map(i => i.id === instId ? { ...i, amount: i.amount - paid } : i); } const trans = { id: 't_' + Date.now(), type: 'income', amount: paid, buildingId, description: `تحصيل قسط ${paid < fullAmount ? '(جزئي)' : ''}: ${clientName}`, date: todayDateStr }; return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] }; }); showMsg('تم التحصيل'); };
      const editInstallment = (instId) => { const inst = (data.installments || []).find(i => i.id === instId); const newDate = window.prompt('تعديل تاريخ الاستحقاق:', inst.dueDate); if (newDate === null) return; const newAmount = window.prompt('تعديل المبلغ:', inst.amount); if (newAmount === null) return; setData(prev => ({ ...prev, installments: (prev.installments || []).map(i => i.id === instId ? { ...i, dueDate: newDate || inst.dueDate, amount: newAmount ? Number(newAmount) : inst.amount } : i) })); showMsg('تم التعديل'); };
      const addManualInstallment = (contractId) => { const amount = window.prompt('أدخل مبلغ القسط الجديد:'); if (!amount) return; const date = window.prompt('أدخل تاريخ الاستحقاق:', todayDateStr); if (!date) return; setData(prev => ({ ...prev, installments: [...(prev.installments || []), { id: 'inst_man_' + Date.now(), contractId, amount: Number(amount), dueDate: date, status: 'pending' }] })); showMsg('تمت الإضافة'); };
      const cancelContract = (contractId, unitId) => { if (!requirePin()) return showMsg('الرمز خطأ!', true); if (window.confirm('هل أنت متأكد من فسخ العقد؟')) { setData(prev => ({ ...prev, contracts: (prev.contracts || []).map(c => c.id === contractId ? { ...c, status: 'canceled' } : c), installments: (prev.installments || []).filter(i => !(i.contractId === contractId && i.status === 'pending')), units: (prev.units || []).map(u => u.id === unitId ? { ...u, status: 'available' } : u) })); showMsg('تم فسخ العقد'); } };
      
      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate.startsWith(thisMonth));

      const tabs = [
        { id: 'dashboard', label: 'الرئيسية' },
        { id: 'transactions', label: 'إيراد / مصروف' },
        { id: 'custody', label: 'العهدة' },
        { id: 'inventory', label: 'الوحدات' },
        { id: 'sales', label: 'المبيعات' },
        { id: 'reports', label: 'التقارير' }
      ];

      // دوال مساعدة لترتيب القوائم المنسدلة (الأحدث أولاً)
      const sortedCustodies = [...(data.custodies || [])].reverse();
      const sortedBuildings = [...(data.buildings || [])].reverse();
      const sortedCategories = [...(data.categories || [])].reverse();

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <header className="bg-slate-900 text-white p-4 shadow print-hide flex justify-between items-center">
            <h1 className="text-xl font-bold">🏢 إدارة الأملاك والعقارات</h1>
            <button onClick={() => setActiveTab('settings')} className="text-2xl hover:scale-110 transition-transform">⚙️</button>
          </header>

          <nav className="bg-slate-800 text-slate-200 flex flex-wrap border-b border-slate-700 print-hide">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 min-w-[30%] p-3 text-sm font-bold text-center ${activeTab === tab.id ? 'bg-slate-700 text-emerald-400 border-b-4 border-emerald-400' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {errorMsg && <div className="bg-red-500 text-white p-2 text-center text-sm font-bold animate-pulse print-hide">{errorMsg}</div>}
          {successMsg && <div className="bg-emerald-600 text-white p-2 text-center text-sm font-bold animate-pulse print-hide">{successMsg}</div>}

          <main className="flex-grow p-4 mx-auto w-full max-w-7xl">
            
            {/* Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 print-hide">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  
                  <div className="bg-white p-4 rounded-xl shadow border-r-4 border-blue-500 cursor-pointer hover:bg-blue-50 transition" onClick={() => setShowMonthDetails(!showMonthDetails)}>
                    <div className="flex justify-between items-center">
                      <p className="text-sm text-slate-500">مستحقات الشهر الحالي (اضغط للتفاصيل)</p>
                      <span className="text-blue-500">{showMonthDetails ? '▲' : '▼'}</span>
                    </div>
                    <p className="text-2xl font-bold mt-2">{monthInstallments.reduce((sum, i) => sum + i.amount, 0).toLocaleString()} ج.م</p>
                  </div>
                  
                  <div className="bg-white p-4 rounded-xl shadow border-r-4 border-amber-500">
                    <p className="text-sm text-slate-500 mb-2">العهدة النشطة</p>
                    <MultiSelectDropdown 
                      options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} 
                      selected={dashboardCustodyFilter} 
                      onChange={setDashboardCustodyFilter} 
                      placeholder="-- الخزينة العامة --" 
                    />
                    <p className="text-xl font-bold text-amber-600 mb-2 mt-2">الصافي: {dashboardNet.toLocaleString()} ج.م</p>

                    <div className="flex gap-2 mt-3 pt-3 border-t border-slate-200">
                      <button onClick={() => goToTransaction('income')} className="flex-1 bg-emerald-500 text-white py-2 rounded text-sm font-bold shadow hover:bg-emerald-600">➕ إضافة إيراد</button>
                      <button onClick={() => goToTransaction('expense')} className="flex-1 bg-red-500 text-white py-2 rounded text-sm font-bold shadow hover:bg-red-600">➖ إضافة مصروف</button>
                    </div>
                  </div>
                </div>

                {showMonthDetails && (
                  <div className="bg-white p-4 rounded-xl shadow animate-fade-in">
                    <h3 className="font-bold mb-3 border-b pb-2 text-blue-800">تفاصيل مستحقات الشهر الحالي</h3>
                    <table className="w-full text-right text-sm">
                      <thead className="bg-slate-100"><tr><th className="p-2">العميل</th><th className="p-2">الاستحقاق</th><th className="p-2">المبلغ</th></tr></thead>
                      <tbody>
                        {monthInstallments.map(inst => {
                          const c = (data.contracts || []).find(ct => ct.id === inst.contractId);
                          return <tr key={inst.id} className="border-b"><td className="p-2 font-bold">{c?.clientName}</td><td className="p-2" dir="ltr">{formatShortDate(inst.dueDate)}</td><td className="p-2 font-bold text-red-600">{inst.amount.toLocaleString()}</td></tr>
                        })}
                        {monthInstallments.length === 0 && <tr><td colSpan="3" className="text-center p-4 text-slate-400">لا توجد أقساط مستحقة هذا الشهر</td></tr>}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* إيراد أو مصروف */}
            {activeTab === 'transactions' && (
              <div className="bg-white p-6 rounded shadow max-w-lg mx-auto print-hide">
                <h3 className="font-bold mb-4 border-b pb-2">تسجيل حركة نقدية</h3>
                <form onSubmit={(e) => { 
                  e.preventDefault(); 
                  const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) }; 
                  setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] })); 
                  setNewTransaction(prev => ({ ...prev, amount: '', description: '' })); 
                  showMsg('تم الحفظ بنجاح'); 
                }} className="space-y-4">
                  <div className="flex gap-4 p-2 bg-slate-50 rounded border">
                    <label className="flex items-center gap-1 cursor-pointer font-bold text-emerald-600"><input type="radio" checked={newTransaction.type === 'income'} onChange={()=>setNewTransaction({...newTransaction, type:'income'})}/> إيراد</label>
                    <label className="flex items-center gap-1 cursor-pointer font-bold text-red-600"><input type="radio" checked={newTransaction.type === 'expense'} onChange={()=>setNewTransaction({...newTransaction, type:'expense'})}/> مصروف</label>
                  </div>
                  <div><label className="text-xs text-slate-500">التاريخ</label><input type="date" required className="w-full border p-2 text-sm rounded" value={newTransaction.date} onChange={e=>setNewTransaction({...newTransaction, date: e.target.value})}/></div>
                  <div><label className="text-xs text-slate-500">المبلغ</label><input type="number" required className="w-full border p-2 text-sm rounded" value={newTransaction.amount} onChange={e=>setNewTransaction({...newTransaction, amount: e.target.value})}/></div>
                  <div><label className="text-xs text-slate-500">العهدة / الخزينة</label><select className="w-full border p-2 text-sm rounded font-bold text-blue-800" value={newTransaction.custodyId} onChange={e=>setNewTransaction({...newTransaction, custodyId: e.target.value})}><option value="">-- الخزينة العامة --</option>{sortedCustodies.map(c=><option key={c.id} value={c.id}>{c.personName}</option>)}</select></div>
                  <div><label className="text-xs text-slate-500">العمارة (اختياري)</label><select className="w-full border p-2 text-sm rounded" value={newTransaction.buildingId} onChange={e=>setNewTransaction({...newTransaction, buildingId: e.target.value})}><option value="">-- عام --</option>{sortedBuildings.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                  {newTransaction.type === 'expense' && <div><label className="text-xs text-slate-500">تصنيف المصروف</label><select className="w-full border p-2 text-sm rounded" required value={newTransaction.categoryId} onChange={e=>setNewTransaction({...newTransaction, categoryId: e.target.value})}><option value="">-- اختر التصنيف --</option>{sortedCategories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>}
                  
                  {/* Autocomplete for Description */}
                  <div className="relative">
                    <label className="text-xs text-slate-500">البيان</label>
                    <input type="text" required className="w-full border p-2 text-sm rounded" value={newTransaction.description} 
                      onChange={e => setNewTransaction({...newTransaction, description: e.target.value})}
                      onFocus={() => setDescFocus(true)} onBlur={() => setTimeout(() => setDescFocus(false), 200)}
                    />
                    {descFocus && newTransaction.description && filteredDescs.length > 0 && (
                      <div className="absolute top-full left-0 right-0 bg-white border shadow-xl z-50 max-h-40 overflow-y-auto rounded-b">
                        {filteredDescs.map((d, idx) => (
                          <div key={idx} className="p-2 text-sm border-b hover:bg-slate-100 cursor-pointer" onMouseDown={() => setNewTransaction({...newTransaction, description: d})}>{d}</div>
                        ))}
                      </div>
                    )}
                  </div>

                  <button className="w-full bg-slate-800 text-white py-2 rounded font-bold shadow">حفظ الحركة</button>
                </form>
              </div>
            )}

            {/* العهدة */}
            {activeTab === 'custody' && (
              <div className="bg-white p-4 rounded-xl shadow print-hide">
                <div className="mb-4 bg-slate-50 p-3 rounded border relative">
                  <label className="font-bold block mb-2 text-slate-800">تحديد العُهد (متعدد):</label>
                  <MultiSelectDropdown 
                    options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} 
                    selected={selectedCustodies} 
                    onChange={setSelectedCustodies} 
                    placeholder="-- كل العهد والخزينة العامة --" 
                  />
                </div>

                <div className="mb-4"><input type="text" placeholder="بحث سريع في البيان..." className="w-full border-2 border-blue-400 p-2 rounded text-lg font-bold" value={custodySearch} onChange={e => setCustodySearch(e.target.value)} /></div>

                <div className="flex border-b mb-4">
                  <button onClick={() => setCustodyTabSub('income')} className={`flex-1 p-2 font-bold ${custodyTabSub === 'income' ? 'border-b-4 border-emerald-500 text-emerald-600' : 'text-slate-500'}`}>الإيرادات</button>
                  <button onClick={() => setCustodyTabSub('expense')} className={`flex-1 p-2 font-bold ${custodyTabSub === 'expense' ? 'border-b-4 border-red-500 text-red-600' : 'text-slate-500'}`}>المصروفات</button>
                </div>

                <div className="overflow-x-auto min-h-[300px]">
                  <table className="w-full text-sm text-right">
                    <thead className="bg-slate-100 text-slate-600"><tr><th className="p-2">التاريخ</th><th className="p-2">البيان</th><th className="p-2">المبلغ</th></tr></thead>
                    <tbody>
                      {filteredCustodyTrans.map(t => (
                        <tr key={t.id} className="border-b hover:bg-slate-100 cursor-pointer" onClick={() => handleTransactionAction(t)}>
                          <td className="p-2" dir="ltr">{formatShortDate(t.date)}</td><td className="p-2">{t.description}</td><td className="p-2 font-bold">{Number(t.amount).toLocaleString()}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className={`mt-4 p-3 rounded font-bold text-lg text-center text-white ${custodyTabSub === 'expense' ? 'bg-red-500' : 'bg-emerald-500'}`}>الإجمالي للمحدد: {filteredCustodyTrans.reduce((s,t)=>s+Number(t.amount),0).toLocaleString()} ج.م</div>
                </div>
              </div>
            )}

            {/* Units */}
            {activeTab === 'inventory' && (
              <div className="space-y-6 print-hide">
                <div className="bg-white p-6 rounded shadow max-w-md mx-auto mb-6">
                  <h3 className="font-bold mb-4 border-b pb-2 text-center text-lg text-emerald-700">إضافة عمارة/مشروع جديد</h3>
                  <form onSubmit={addBuilding} className="flex flex-col gap-3">
                    <input required type="text" placeholder="اسم العمارة..." className="border p-2 rounded text-sm w-full font-bold" value={newBuilding} onChange={e=>setNewBuilding(e.target.value)}/>
                    <button className="bg-emerald-700 text-white px-4 py-2 rounded text-md font-bold w-full shadow-lg">حفظ العمارة</button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded shadow max-w-md mx-auto">
                  <h3 className="font-bold mb-4 border-b pb-2 text-center text-lg text-blue-800">إضافة وحدة عقارية (شقة/محل)</h3>
                  <form onSubmit={addUnit} className="flex flex-col gap-3">
                    <div><label className="text-xs text-slate-500">اختر العمارة</label><select className="border p-2 rounded text-sm w-full font-bold" required value={newUnit.buildingId} onChange={e => setNewUnit({...newUnit, buildingId: e.target.value})}><option value="">-- العمارة --</option>{sortedBuildings.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                    <div><label className="text-xs text-slate-500">رقم أو اسم الوحدة</label><input type="text" placeholder="مثال: شقة 14" className="border p-2 rounded text-sm w-full font-bold" required value={newUnit.unitNumber} onChange={e => setNewUnit({...newUnit, unitNumber: e.target.value})} /></div>
                    <button className="bg-blue-800 text-white px-4 py-3 rounded text-md font-bold w-full shadow-lg">حفظ الوحدة</button>
                  </form>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {sortedBuildings.map(b => (
                    <div key={b.id} className="bg-white p-4 rounded shadow border-t-4 border-slate-800">
                      <h4 className="font-bold text-center mb-3 bg-slate-100 p-2 rounded">{b.name}</h4>
                      <div className="grid grid-cols-4 gap-2">
                        {(data.units || []).filter(u => u.buildingId === b.id).map(u => (
                          <div key={u.id} className={`p-2 text-center text-xs rounded font-bold text-white shadow-sm ${u.status === 'available' ? 'bg-emerald-500' : 'bg-red-500'}`}>{u.unitNumber}<br/>{u.status === 'available' ? 'متاح' : 'مباع'}</div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Sales */}
            {activeTab === 'sales' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 print-hide">
                <div className="bg-white p-4 rounded-xl shadow h-fit">
                  <h3 className="font-bold mb-4 border-b pb-2">إنشاء عقد جديد</h3>
                  <form onSubmit={addContract} className="space-y-3">
                    <input type="text" placeholder="اسم العميل" className="w-full border p-2 rounded text-sm" required value={newContract.clientName} onChange={e => setNewContract({...newContract, clientName: e.target.value})} />
                    <select className="w-full border p-2 rounded text-sm" required value={newContract.unitId} onChange={e => setNewContract({...newContract, unitId: e.target.value})}>
                      <option value="">-- اختر الوحدة المتاحة --</option>
                      {(data.units || []).filter(u => u.status === 'available').map(u => <option key={u.id} value={u.id}>{(data.buildings || []).find(b=>b.id===u.buildingId)?.name} - {u.unitNumber}</option>)}
                    </select>
                    <input type="number" placeholder="الإجمالي (ج.م)" className="w-full border p-2 rounded text-sm" required value={newContract.totalAmount} onChange={e => setNewContract({...newContract, totalAmount: e.target.value})} />
                    <input type="number" placeholder="المقدم المدفوع حالا" className="w-full border p-2 rounded text-sm" required value={newContract.downPayment} onChange={e => setNewContract({...newContract, downPayment: e.target.value})} />
                    <input type="number" placeholder="عدد الأقساط المبدئي" className="w-full border p-2 rounded text-sm" required value={newContract.installmentsCount} onChange={e => setNewContract({...newContract, installmentsCount: e.target.value})} />
                    <div><label className="text-xs text-slate-500">تاريخ أول قسط</label><input type="date" className="w-full border p-2 rounded text-sm" required value={newContract.firstInstallmentDate} onChange={e => setNewContract({...newContract, firstInstallmentDate: e.target.value})} /></div>
                    <button className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">تسجيل العقد وإنشاء الأقساط</button>
                  </form>
                </div>
                <div className="bg-white p-4 rounded-xl shadow lg:col-span-2">
                  <h3 className="font-bold mb-4 border-b pb-2">إدارة العقود والأقساط</h3>
                  <div className="space-y-4">
                    {(data.contracts || []).filter(c => c.status === 'active').map(c => {
                      const u = (data.units || []).find(un => un.id === c.unitId);
                      const b = (data.buildings || []).find(bd => bd.id === c.buildingId);
                      return (
                        <div key={c.id} className="border p-4 rounded-lg bg-slate-50 shadow-sm">
                          <div className="flex justify-between items-start mb-3 border-b pb-2">
                            <div><p className="font-bold text-blue-800 text-lg">{c.clientName}</p><p className="text-sm font-semibold">{b?.name} - شقة {u?.unitNumber}</p></div>
                            <button onClick={() => cancelContract(c.id, c.unitId)} className="text-xs text-red-600 border border-red-600 bg-white px-2 py-1 rounded hover:bg-red-100">فسخ العقد</button>
                          </div>
                          <div className="overflow-x-auto mb-3">
                            <table className="w-full text-sm text-right">
                              <thead><tr className="text-slate-500 border-b"><th className="p-2">التاريخ</th><th className="p-2">المبلغ</th><th className="p-2">الحالة</th><th className="p-2">إجراء</th></tr></thead>
                              <tbody>
                                {(data.installments || []).filter(i => i.contractId === c.id).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).map(inst => (
                                  <tr key={inst.id} className="border-b">
                                    <td className="p-2 font-mono" dir="ltr">{formatShortDate(inst.dueDate)}</td><td className="p-2 font-bold">{inst.amount.toLocaleString()}</td>
                                    <td className="p-2">{inst.status === 'paid' ? <span className="text-emerald-600 font-bold">مدفوع</span> : 'مستحق'}</td>
                                    <td className="p-2 flex gap-1">
                                      {inst.status === 'pending' && <button onClick={() => payInstallment(inst.id, inst.amount, c.clientName, c.buildingId)} className="bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold shadow">تحصيل</button>}
                                      {inst.status === 'pending' && <button onClick={() => editInstallment(inst.id)} className="bg-slate-600 text-white px-3 py-1 rounded text-xs font-bold shadow">تعديل</button>}
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                          <div className="text-left"><button onClick={() => addManualInstallment(c.id)} className="bg-blue-100 text-blue-800 border border-blue-300 px-3 py-1 rounded text-xs font-bold shadow-sm hover:bg-blue-200">➕ إضافة قسط يدوي</button></div>
                        </div>
                      )
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Reports */}
            {activeTab === 'reports' && (
              <div className="bg-white p-4 rounded shadow">
                
                {/* --- PDF PRINT VIEW --- */}
                <div className="hidden print-show text-black">
                  <h2 className="text-3xl text-center mb-2">تقرير كشف حساب</h2>
                  <h3 className="text-2xl text-center mb-2">{reportData.custodyName}</h3>
                  <h4 className="text-xl text-center mb-6">من تاريخ: {reportFilter.startDate || 'البداية'} إلى تاريخ: {reportFilter.endDate || 'الآن'}</h4>

                  {reportType === 'transactions' ? (
                    <>
                      {reportFilter.custodyIds.length > 0 && (
                        <table className="mb-4">
                          <thead>
                            <tr className="bg-slate-200">
                              <th className="w-[80%] text-right print-header border-black">رصيد بداية المدة</th>
                              <th className="w-[20%] border-black text-xl text-center">{reportData.openingBalance.toLocaleString()}</th>
                            </tr>
                          </thead>
                        </table>
                      )}
                      
                      <h4 className="text-xl font-bold border-b-2 border-black mt-4 mb-2">الإيرادات</h4>
                      <table>
                        <thead><tr><th className="w-[15%] text-center">التاريخ</th><th className="w-[65%] text-right">البيان</th><th className="w-[20%] text-center">المبلغ</th></tr></thead>
                        <tbody>
                          {reportData.incomes.map(t => (
                            <tr key={t.id} className="print-row-text">
                              <td dir="ltr" className="text-center">{formatShortDate(t.date)}</td><td>{t.description}</td><td className="text-center font-bold">{Number(t.amount).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="text-left mt-2 mb-6 text-xl font-bold">إجمالي الإيراد: {(reportData.totalIncomes + reportData.openingBalance).toLocaleString()}</div>

                      <h4 className="text-xl font-bold border-b-2 border-black mt-4 mb-2">المصروفات</h4>
                      <table>
                        <thead><tr><th className="w-[15%] text-center">التاريخ</th><th className="w-[65%] text-right">البيان</th><th className="w-[20%] text-center">المبلغ</th></tr></thead>
                        <tbody>
                          {reportData.expenses.map(t => (
                            <tr key={t.id} className="print-row-text">
                              <td dir="ltr" className="text-center">{formatShortDate(t.date)}</td><td>{t.description}</td><td className="text-center font-bold">{Number(t.amount).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="text-left mt-2 mb-6 text-xl font-bold">إجمالي المصروفات: {reportData.totalExpenses.toLocaleString()}</div>

                      <div className="p-3 text-center text-2xl border-4 border-black mt-8 bg-slate-200 font-bold">
                        صافي العهدة حتى التاريخ المحدد: {reportData.finalBalance.toLocaleString()}
                      </div>
                    </>
                  ) : (
                    <div>... تقرير الأقساط ...</div>
                  )}
                </div>

                {/* --- SCREEN VIEW --- */}
                <div className="print-hide">
                  <div className="flex gap-2 mb-4 border-b pb-4">
                    <button onClick={()=>setReportType('transactions')} className={`flex-1 p-2 font-bold rounded ${reportType==='transactions'?'bg-blue-600 text-white':'bg-slate-200'}`}>تقرير الحركات والعهد</button>
                    <button onClick={()=>setReportType('installments')} className={`flex-1 p-2 font-bold rounded ${reportType==='installments'?'bg-blue-600 text-white':'bg-slate-200'}`}>تقرير الأقساط</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4 bg-slate-50 p-4 rounded border">
                    <div><label className="text-xs font-bold block mb-1">من تاريخ</label><input type="date" className="w-full border p-2 text-sm rounded" value={reportFilter.startDate} onChange={e=>setReportFilter({...reportFilter, startDate: e.target.value})}/></div>
                    <div><label className="text-xs font-bold block mb-1">إلى تاريخ</label><input type="date" className="w-full border p-2 text-sm rounded" value={reportFilter.endDate} onChange={e=>setReportFilter({...reportFilter, endDate: e.target.value})}/></div>
                    
                    {reportType === 'transactions' && (
                      <div>
                        <label className="text-xs font-bold block mb-1">العهدة (متعدد)</label>
                        <MultiSelectDropdown 
                          options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))}
                          selected={reportFilter.custodyIds}
                          onChange={(newIds) => setReportFilter({...reportFilter, custodyIds: newIds})}
                          placeholder="-- كل العهد --"
                        />
                      </div>
                    )}
                    
                    <div>
                      <label className="text-xs font-bold block mb-1">العمارة (متعدد)</label>
                      <MultiSelectDropdown 
                        options={sortedBuildings.map(b => ({ id: b.id, label: b.name }))}
                        selected={reportFilter.buildingIds}
                        onChange={(newIds) => setReportFilter({...reportFilter, buildingIds: newIds})}
                        placeholder="-- كل العمارات --"
                      />
                    </div>
                  </div>

                  <button onClick={handlePrint} className="w-full bg-slate-800 text-white py-3 rounded font-bold mb-4 shadow-lg text-lg">🖨️ طباعة التقرير PDF</button>
                </div>
              </div>
            )}

            {/* Settings Tab */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 print-hide">
                <div className="bg-white p-4 shadow rounded border-t-4 border-slate-800">
                  <h4 className="font-bold mb-3">إضافة تصنيف مصروفات</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg('تمت الإضافة');}} className="flex gap-2 mb-3">
                    <input required type="text" placeholder="مثال: تشطيبات..." className="border p-2 text-sm flex-grow rounded" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/>
                    <button className="bg-slate-800 text-white px-4 rounded text-sm shadow">إضافة</button>
                  </form>
                  <div className="flex flex-wrap gap-2">{sortedCategories.map(c=><span key={c.id} className="bg-slate-100 border p-1 px-2 rounded text-xs">{c.name}</span>)}</div>
                </div>
                
                <div className="bg-white p-4 shadow rounded border-t-4 border-slate-800">
                  <h4 className="font-bold mb-3">تسليم عهدة لمسؤول جديد</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg('تم تسجيل العهدة');}} className="space-y-2">
                    <input required type="text" placeholder="اسم المسؤول" className="border p-2 text-sm w-full rounded" value={newCustody.personName} onChange={e=>setNewCustody({...newCustody, personName:e.target.value})}/>
                    <input required type="number" placeholder="المبلغ الأصلي" className="border p-2 text-sm w-full rounded" value={newCustody.totalAmount} onChange={e=>setNewCustody({...newCustody, totalAmount:e.target.value})}/>
                    <button className="bg-slate-800 text-white p-2 rounded w-full text-sm font-bold shadow">حفظ العهدة</button>
                  </form>
                </div>

                <div className="bg-white p-6 shadow rounded md:col-span-2 text-center border-2 border-dashed border-blue-400">
                  <h4 className="font-bold mb-2 text-blue-800 text-lg">النسخ الاحتياطي للأمان</h4>
                  <p className="text-xs mb-4 text-slate-500">للحفظ في مجلد محدد، تأكد من تفعيل "السؤال عن مكان الحفظ" في إعدادات متصفح كروم.</p>
                  <div className="flex gap-4 justify-center">
                    <button onClick={()=>{const b=new Blob([JSON.stringify(data)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`نسخة_العقارات_${todayDateStr}.json`;l.click();}} className="bg-blue-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-blue-700">تصدير وحفظ نسخة</button>
                    <label className="bg-amber-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-amber-700 cursor-pointer">استرجاع بيانات<input type="file" accept=".json" className="hidden" onChange={(e)=>{const r=new FileReader();r.onload=(ev)=>{try{setData(JSON.parse(ev.target.result));showMsg('تم الاسترجاع بنجاح');}catch{showMsg('ملف غير صالح',true);}};if(e.target.files[0])r.readAsText(e.target.files[0]);}}/></label>
                  </div>
                </div>

                <div className="bg-white p-4 shadow rounded md:col-span-2 border-2 border-red-600 bg-red-50 mt-4">
                  <h4 className="font-bold mb-2 text-red-700 text-center text-xl border-b border-red-200 pb-2">منطقة الخطر (إعادة ضبط المصنع)</h4>
                  <button onClick={handleResetFactory} className="w-full bg-red-600 text-white py-3 rounded text-lg font-bold shadow hover:bg-red-700 mt-2">مسح كافة البيانات (Reset App)</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
  </script>
</body>
</html>
