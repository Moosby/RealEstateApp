          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount || 0) + incomes - expenses };

         const exp = (data.transactions||[]).filter(tx=>tx.type==='expense').reduce((s,tx)=>s+Number(tx.amount||0),0);
         const initCust = (data.custodies||[]).reduce((s,c)=>s+Number(c.totalAmount||0),0);
         dashboardNet = initCust + inc - exp;
      } else {
         let net = 0;
         if (dashboardCustodyFilter.includes('GENERAL_SAFE')) {
            const inc = (data.transactions||[]).filter(tx => (tx.type==='income' && !tx.custodyId) || (tx.type==='transfer' && !tx.toCustodyId)).reduce((s,tx)=>s+Number(tx.amount||0),0);
            const exp = (data.transactions||[]).filter(tx => (tx.type==='expense' && !tx.custodyId) || (tx.type==='transfer' && !tx.custodyId)).reduce((s,tx)=>s+Number(tx.amount||0),0);
            net += (inc - exp);
         }
         const specIds = dashboardCustodyFilter.filter(id => id !== 'ALL' && id !== 'GENERAL_SAFE');
         if (specIds.length > 0) { net += custodyCalculations.filter(c => specIds.includes(c.id)).reduce((s, c) => s + c.remaining, 0); }
         dashboardNet = net;
      }

      const totalOpeningBalance = useMemo(() => {
        if (!selectedCustodies || selectedCustodies.length === 0 || selectedCustodies.includes('ALL')) { return (data.custodies || []).reduce((sum, c) => sum + Number(c.totalAmount || 0), 0); }
        return (data.custodies || []).filter(c => selectedCustodies.includes(c.id)).reduce((sum, c) => sum + Number(c.totalAmount || 0), 0);
      }, [data.custodies, selectedCustodies]);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(tx => {
          if (!isTxInSelectedCustodies(tx, selectedCustodies)) return false;
          if (tx.type !== custodyTabSub && tx.type !== 'transfer') return false;
          if (custodySearch && !tx.description?.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjsR = (reportFilter.custodyIds || []).length > 0 ? (data.custodies || []).filter(c => (reportFilter.custodyIds || []).includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjsR.forEach(c => {
           let bal = Number(c.totalAmount || 0);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(tx => (tx.custodyId === c.id || tx.toCustodyId === c.id) && tx.date < reportFilter.startDate);
              bal += beforeTrans.filter(tx => tx.type === 'income' || (tx.type === 'transfer' && tx.toCustodyId === c.id)).reduce((s, tx) => s + Number(tx.amount || 0), 0);
              bal -= beforeTrans.filter(tx => tx.type === 'expense' || (tx.type === 'transfer' && tx.custodyId === c.id)).reduce((s, tx) => s + Number(tx.amount || 0), 0);
           }
           openingBalance += bal;

        const custodyName = (reportFilter.custodyIds || []).length === 0 ? t.allCustodies : selectedCustodyObjsR.map(c=>c.personName).join(' + ');

        const filtered = (data.transactions || []).filter(tx => {

        const incomes = filtered.filter(tx => tx.type === 'income' || tx.type === 'transfer');

        const totalExpenses = expenses.reduce((s,tx) => s + Number(tx.amount || 0), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName, buildingName };

        const pPercent = newBuildingPartner ? Number(newBuildingPartnerPercent) : 0;
        const pName = newBuildingPartnerName || ('شريك ' + newBuilding); 
        setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding, hasPartner: newBuildingPartner, partnerPercent: pPercent, partnerName: pName}]})); 
        setNewBuilding(''); setNewBuildingPartner(false); setNewBuildingPartnerPercent(''); setNewBuildingPartnerName(''); showMsg(t.success); 
      };

      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg(t.success); };
      
      const addContract = (e) => { 
         e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return; 
         const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); const interval = Number(newContract.interval);

         setData(prev => {
            let updatedContracts = [...(prev.contracts || [])];
            let updatedInstallments = [...(prev.installments || [])];
            let updatedTransactions = [...(prev.transactions || [])];
            let contractId;

            if (editingContractId) {
               contractId = editingContractId;
               const oldContract = updatedContracts.find(c => c.id === contractId);
               const oldInsts = updatedInstallments.filter(i => i.contractId === contractId);
               const totalOldPaid = oldInsts.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0);
               updatedInstallments = updatedInstallments.filter(i => i.contractId !== contractId);
               if (totalOldPaid > 0) {
                  updatedTransactions.push({ id: 't_rev_' + Date.now(), type: 'expense', amount: totalOldPaid, buildingId: oldContract.buildingId, custodyId: '', description: `تسوية لإلغاء مدفوعات سابقة بسبب تعديل عقد: ${newContract.clientName}`, date: todayDateStr });
               }
               const contractIndex = updatedContracts.findIndex(c => c.id === contractId);
               updatedContracts[contractIndex] = { ...oldContract, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, installmentsCount: count, interval: interval, suspendedAmount: 0 };
            } else {
               contractId = 'cont_' + Date.now(); 
               updatedContracts.push({ id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active', installmentsCount: count, interval: interval, attachments: [], suspendedAmount: 0 });
            }

            const newInsts = []; 
            if (dp > 0) { newInsts.push({ id: 'inst_dp_' + Date.now(), contractId, amount: dp, dueDate: todayDateStr, status: 'paid', partnerPaid: false, partnerPaidAmount: 0, isDownPayment: true }); }
            let curDate = new Date(newContract.firstInstallmentDate); 
            const baseInstAmount = count > 0 ? Math.floor((total - dp) / count) : 0; 
            let remainder = (total - dp) - (baseInstAmount * count);
            for(let i=0; i<count; i++) { 
               let currentAmt = baseInstAmount;
               if (i === count - 1) currentAmt += remainder; 
               newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: currentAmt, dueDate: curDate.toISOString().split('T')[0], status: 'pending', partnerPaid: false, partnerPaidAmount: 0 }); 
               curDate.setMonth(curDate.getMonth() + interval); 
            } 
            updatedInstallments.push(...newInsts);

            if (dp > 0) { updatedTransactions.push({ id: 't_dp_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, custodyId: newContract.custodyId || '', description: `مقدم تعاقد ${editingContractId ? '(معدل)' : ''}: ${newContract.clientName}`, date: todayDateStr }); }

            const updatedUnits = (prev.units || []).map(u => {
               if(u.id === unit.id) return { ...u, status: 'sold' };
               if(editingContractId) { const oldC = prev.contracts.find(c => c.id === editingContractId); if (oldC && oldC.unitId === u.id && oldC.unitId !== unit.id) return { ...u, status: 'available' }; }
               return u;
            });
            return { ...prev, contracts: updatedContracts, installments: updatedInstallments, transactions: updatedTransactions, units: updatedUnits };
         });
         setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', custodyId: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' }); 
         setEditingContractId(null);
         showMsg(t.success); 
      };

      const editInstallment = (instId, newAmountNum, newDueDate) => {
        const newAmt = Number(newAmountNum);
        setData(prev => {
          const instIndex = (prev.installments || []).findIndex(i => i.id === instId);
          if (instIndex === -1) return prev;
          const oldInst = prev.installments[instIndex];
          const oldAmt = Number(oldInst.amount || 0);
          const diff = oldAmt - newAmt;
          let updatedInsts = [...prev.installments];
          let updatedContracts = [...prev.contracts];
          const contractIndex = updatedContracts.findIndex(c => c.id === oldInst.contractId);
          let currentSuspended = (contractIndex > -1 ? Number(updatedContracts[contractIndex].suspendedAmount || 0) : 0);

          if (newAmt <= 0) {
            updatedInsts = updatedInsts.filter(i => i.id !== instId);
            currentSuspended += oldAmt;
          } else {
            updatedInsts[instIndex] = { ...oldInst, amount: newAmt, dueDate: newDueDate || oldInst.dueDate, status: 'pending' };
            if (diff > 0) { currentSuspended += diff; } else if (diff < 0) { const increase = Math.abs(diff); currentSuspended = Math.max(0, currentSuspended - increase); }
          }
          if (contractIndex > -1) { updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: currentSuspended }; }
          return { ...prev, installments: updatedInsts, contracts: updatedContracts };
        });
        showMsg(t.success);
      };

      const addManualInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum);
        if(!amt || amt <= 0) return;
        setData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId);
          let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) {
            const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0);
            const newSuspended = Math.max(0, currentSuspended - amt);
            updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended };
          }
          const newInst = { id: 'inst_man_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        });
        showMsg(t.success);
      };

      const convertSuspendedToInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum);
        if (!amt || amt <= 0) return;
        setData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId);
          let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) {
            const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0);
            const deductAmt = Math.min(amt, currentSuspended);
            const newSuspended = Math.max(0, currentSuspended - deductAmt);
            updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended };
          }
          const newInst = { id: 'inst_conv_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        });
        showMsg(t.success);
      };

      const payInstallment = (instId, clientName, buildingId, paidAmount, date, custodyId) => {
        const paid = Number(paidAmount);
        setData(prev => {
          let updatedInsts = [...(prev.installments || [])];
          const instIndex = updatedInsts.findIndex(i => i.id === instId);
          if(instIndex > -1) {
              const instToUpdate = updatedInsts[instIndex];
              const fullAmount = Number(instToUpdate.amount);
              if (paid <= 0) { updatedInsts[instIndex] = { ...instToUpdate, amount: 0, status: 'suspended' }; } 
              else if (paid >= fullAmount) { updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid }; } 
              else {
                const remaining = fullAmount - paid;
                updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid };
                updatedInsts.push({ id: 'inst_rem_' + Date.now(), contractId: instToUpdate.contractId, amount: remaining, dueDate: instToUpdate.dueDate, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 });
              }
              let updatedTrans = [...(prev.transactions || [])];
              if (paid > 0) { updatedTrans.push({ id: 't_' + Date.now(), type: 'income', amount: paid, buildingId, custodyId: custodyId || '', description: (lang==='ar'?`تحصيل قسط ${paid < fullAmount ? '(جزئي)' : ''}: ${clientName}`:`Installment Collection ${paid < fullAmount ? '(Partial)' : ''}: ${clientName}`), date: date || todayDateStr }); }
              return { ...prev, installments: updatedInsts, transactions: updatedTrans };
          }
          return prev;
        });
        showMsg(t.success);
      };

      const payPartnerShare = (instId, actualPaidAmt, clientName, buildingName, custodyId, date) => {
        const paidAmtNum = Number(actualPaidAmt);
        if(!paidAmtNum || paidAmtNum <= 0) return;
        setData(prev => {
          const updatedInsts = prev.installments.map(i => {
            if (i.id === instId) {
              const b = (prev.buildings||[]).find(bd => bd.id === (prev.contracts||[]).find(c=>c.id===i.contractId)?.buildingId);
              const totalPartnerShare = Math.round(Number(i.amount) * (Number(b?.partnerPercent || 0)/100));
              const currentPaid = i.partnerPaidAmount !== undefined ? Number(i.partnerPaidAmount) : (i.partnerPaid ? totalPartnerShare : 0);
              const newPaid = currentPaid + paidAmtNum;
              const isFullyPaid = newPaid >= totalPartnerShare;
              return { ...i, partnerPaidAmount: newPaid, partnerPaid: isFullyPaid };
            }
            return i;
          });
          const trans = { id: 't_' + Date.now(), type: 'expense', amount: paidAmtNum, buildingId: '', custodyId: custodyId || '', description: (lang==='ar'?`توريد نصيب الشريك (${paidAmtNum.toLocaleString()} ج.م) - ${clientName} - ${buildingName}`:`Pay Partner Share (${paidAmtNum.toLocaleString()}) - ${clientName} - ${buildingName}`), date: date || getTodayStr() };
          return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
        });
        showMsg(t.success);
      };

      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 && dashboardCustodyFilter[0] !== 'ALL' ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody, date: getTodayStr() }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && Number(i.amount) > 0 && i.dueDate?.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
      const overdueInstallments = (data.installments || []).filter(i => i.status === 'pending' && Number(i.amount) > 0 && i.dueDate < todayDateStr).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));

      const tabs = [
        { id: 'dashboard', label: t.tab_dash }, { id: 'transactions', label: t.tab_tx },
        { id: 'custody', label: t.tab_cust }, { id: 'inventory', label: t.tab_inv },
        { id: 'sales', label: t.tab_sales }, { id: 'reports', label: t.tab_rep },
        { id: 'settings', label: t.tab_settings }
      ];

      const lastCustodyNet = sortedCustodies.length > 0 ? (custodyCalculations.find(c => c.id === sortedCustodies[0].id)?.remaining || 0) : 0;
      const filteredContracts = (data.contracts || []).filter(c => c.status === 'active' && (!globalSearch || c.clientName.includes(globalSearch)));
      const isContractsListOpen = showContractsList || globalSearch.trim().length > 0;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">
          <header className="bg-slate-900 text-white p-4 shadow-lg print-hide flex justify-between items-center relative z-40">
            <h1 className="text-xl font-bold tracking-wide flex items-center gap-2">🏢 <span className="hidden sm:inline">{t.appTitle}</span></h1>
            
            <div className="flex items-center gap-4">
               <span className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 font-mono hidden md:inline-block border border-slate-700">
                  {user?.email}
               </span>
               <button onClick={() => auth.signOut()} className="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg font-bold shadow transition flex items-center gap-1">
                  خروج 🚪
               </button>
            </div>
          </header>

          <nav className="bg-slate-800 text-slate-200 grid grid-cols-3 md:grid-cols-7 border-b border-slate-700 print-hide shadow-md">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => {setActiveTab(tab.id); setEditingTxId(null); setGlobalSearch(''); setEditingContractId(null);}} 
                className={`p-3 text-sm font-bold text-center border-b border-l border-slate-700 transition-colors ${activeTab === tab.id ? 'bg-slate-100 text-blue-800 border-b-4 border-b-blue-600 shadow-inner' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {toast.show && ( <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[200] animate-slide-up print-hide w-[90%] max-w-sm"><div className={`px-6 py-4 rounded-2xl shadow-2xl font-bold text-white flex items-center justify-center gap-3 ${toast.isError ? 'bg-red-600' : 'bg-emerald-600'}`}><span className="text-2xl">{toast.isError ? '⚠️' : '✅'}</span><span className="text-lg">{toast.msg}</span></div></div> )}

          {appModal.show && (
            <div className={`fixed inset-0 bg-slate-900 bg-opacity-70 backdrop-blur-sm flex items-center justify-center z-[100] animate-fade-in p-4 ${appModal.type !== 'RECEIPT' ? 'print-hide' : 'print-receipt-wrapper'}`} onClick={closeModal}>
              {appModal.type === 'TX_ACTION' && appModal.props.tx && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-2 text-center text-slate-800 border-b pb-2">{t.action}</h3><p className="text-center text-sm text-slate-500 mb-6 bg-slate-50 p-2 rounded">{appModal.props.tx?.description} <br/> <span className="font-bold text-lg text-slate-800">{Number(appModal.props.tx?.amount || 0).toLocaleString()}</span></p><button onClick={() => { closeModal(); setNewTransaction({...appModal.props.tx}); setEditingTxId(appModal.props.tx?.id); setActiveTab('transactions'); }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { closeModal(); requirePin(() => { setAppModal({ show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelTx, onConfirm: () => { setData(p => ({...p, transactions: (p.transactions||[]).filter(tx => tx.id !== appModal.props.tx?.id)})); showMsg(t.success); closeModal(); } }}); }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'CAT_ACTION' && appModal.props.cat && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="catEditInput" defaultValue={appModal.props.cat.name} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('catEditInput').value; if(val) { setData(p => ({...p, categories: p.categories.map(c => c.id === appModal.props.cat.id ? {...c, name: val} : c)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setData(p => ({...p, categories: p.categories.filter(c => c.id !== appModal.props.cat.id)})); closeModal(); showMsg(t.success); }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'BUILDING_ACTION' && appModal.props.b && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="buildEditInput" defaultValue={appModal.props.b.name} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('buildEditInput').value; if(val) { setData(p => ({...p, buildings: p.buildings.map(b => b.id === appModal.props.b.id ? {...b, name: val} : b)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setAppModal({show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelBuild, onConfirm: () => { setData(p => ({...p, buildings: p.buildings.filter(b => b.id !== appModal.props.b.id)})); closeModal(); showMsg(t.success); } }}) }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'UNIT_ACTION' && appModal.props.u && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="unitEditInput" defaultValue={appModal.props.u.unitNumber} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('unitEditInput').value; if(val) { setData(p => ({...p, units: p.units.map(u => u.id === appModal.props.u.id ? {...u, unitNumber: val} : u)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setAppModal({show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelUnit, onConfirm: () => { setData(p => ({...p, units: p.units.filter(u => u.id !== appModal.props.u.id)})); closeModal(); showMsg(t.success); } }}) }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'IMAGE_VIEW' && ( <div className="bg-black p-2 rounded-2xl w-full max-w-2xl relative shadow-2xl animate-fade-in flex flex-col items-center justify-center" onClick={e=>e.stopPropagation()}><button onClick={closeModal} className="absolute top-4 right-4 bg-red-600 text-white w-10 h-10 rounded-full font-black text-xl hover:bg-red-700 shadow z-50">X</button><img src={appModal.props.src} className="w-full h-auto rounded-xl max-h-[85vh] object-contain border border-slate-800" /></div> )}
              {appModal.type === 'PIN' && ( <div className="bg-white w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}><div className="bg-red-600 text-white p-4 text-center font-bold">🔒</div><div className="p-6"><p className="text-center text-sm mb-4">أدخل الرمز السري لتأكيد الإجراء</p><input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4" autoFocus className="w-full border-b-2 border-red-400 p-2 text-center text-3xl tracking-[0.5em] font-bold outline-none focus:border-red-600 transition-colors bg-slate-50" onChange={e => { const val = e.target.value; if(val.length === 4) { const currentPin = data.pinCode || '0000'; if (val === currentPin) { const successCallback = appModal.props.onSuccess; closeModal(); setTimeout(() => { if(successCallback) successCallback(); }, 100); } else { showMsg(lang === 'ar' ? 'الرمز غير صحيح' : 'Incorrect PIN', true); e.target.value = ''; } } }} /></div><button onClick={closeModal} className="w-full p-4 bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">{t.no}</button></div> )}
              {appModal.type === 'RECEIPT' && ( <div className="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl animate-slide-up print-show" onClick={e=>e.stopPropagation()}><div id="receipt-area" className="p-6 bg-white text-black text-center receipt-print-area"><p className="text-base font-black mb-4 text-slate-800 border-b-2 border-slate-800 pb-2">إيصال استلام نقدية</p><div className="text-right space-y-2.5 mb-5 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200" dir="rtl"><div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">تاريخ الاستلام:</span><span className="font-mono font-bold text-slate-900">{appModal.props.date || formatShortDate(todayDateStr)}</span></div>{appModal.props.dueDate && ( <div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">تاريخ استحقاق القسط:</span><span className="font-mono font-bold text-blue-800">{appModal.props.dueDate}</span></div> )}<div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">العميل:</span><span className="font-bold text-slate-900">{appModal.props.clientName}</span></div><div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">البيان / الوحدة:</span><span className="font-bold text-slate-900">{appModal.props.buildingName}</span></div><div className="flex justify-between pt-1 text-base text-emerald-700"><span className="font-black">المبلغ المستلم:</span><span className="font-black">{Number(appModal.props.amount).toLocaleString()} ج.م</span></div></div>{appModal.props.unitPrice !== undefined && ( <div className="bg-blue-50/60 p-3.5 rounded-xl border border-blue-200 text-right text-xs mb-4" dir="rtl"><p className="font-black text-blue-900 text-sm mb-2 border-b border-blue-200 pb-1 text-center">📊 إجمالي موقف الوحدة</p><div className="grid grid-cols-3 gap-2 text-center font-bold"><div className="bg-white p-2 rounded-lg border border-blue-100">                 {/* 2. قسم إدارة المستخدمين (جديد) */}
                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                   <h3 className="font-black text-2xl text-slate-800 mb-6 border-b-2 border-slate-100 pb-4">👥 إدارة المستخدمين وصلاحيات الموظفين</h3>
                   <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      {/* نموذج الإضافة */}
                      <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-inner h-fit">
                         <h4 className="font-bold text-slate-700 mb-4">إنشاء حساب موظف جديد</h4>
                         <form onSubmit={handleCreateUser} className="space-y-4">
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">الاسم</label><input type="text" required className="w-full border-2 p-3 rounded-xl font-bold outline-none focus:border-blue-500" value={newUser.name} onChange={e=>setNewUser({...newUser, name: e.target.value})} /></div>
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">البريد (للدخول)</label><input type="email" required className="w-full border-2 p-3 rounded-xl font-bold outline-none focus:border-blue-500 text-left" dir="ltr" placeholder="eng@realstate.com" value={newUser.email} onChange={e=>setNewUser({...newUser, email: e.target.value})} /></div>
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">كلمة المرور (6 حروف)</label><input type="text" required minLength="6" className="w-full border-2 p-3 rounded-xl font-black tracking-widest outline-none focus:border-blue-500 text-left" dir="ltr" value={newUser.password} onChange={e=>setNewUser({...newUser, password: e.target.value})} /></div>
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">الصلاحية</label><select className="w-full border-2 p-3 rounded-xl font-bold outline-none focus:border-blue-500 bg-white" value={newUser.role} onChange={e=>setNewUser({...newUser, role: e.target.value})}><option value="admin">مدير نظام</option><option value="custody">أمين عهدة</option><option value="partner">شريك / مستثمر</option></select></div>
                            <button disabled={isCreatingUser} className={`w-full text-white py-4 rounded-xl font-bold shadow transition ${isCreatingUser ? 'bg-slate-400' : 'bg-slate-800 hover:bg-slate-900'}`}>{isCreatingUser ? 'جاري الإنشاء...' : '➕ إضافة الموظف'}</button>
                         </form>
                      </div>
                      {/* قائمة المستخدمين */}
                      <div className="md:col-span-2">
                         <h4 className="font-bold text-slate-700 mb-4">قائمة الموظفين الحاليين ({dbUsers.length})</h4>
                         <div className="space-y-3">
                            {dbUsers.map(u => (
                               <div key={u.uid} className="bg-white p-4 rounded-2xl border-2 border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4 hover:border-blue-200 transition">
                                  <div className="flex items-center gap-4"><div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-inner ${u.role === 'admin' ? 'bg-blue-100' : u.role === 'partner' ? 'bg-purple-100' : 'bg-emerald-100'}`}>{u.role === 'admin' ? '👑' : u.role === 'partner' ? '💼' : '👷'}</div><div><p className="font-black text-slate-800">{u.name}</p><p className="text-xs text-slate-500 font-mono mt-1">{u.email}</p></div></div>
                                  <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end"><span className={`px-3 py-1 rounded-lg text-xs font-bold border ${u.role === 'admin' ? 'bg-blue-50 text-blue-700 border-blue-200' : u.role === 'partner' ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>{u.role === 'admin' ? 'مدير نظام' : u.role === 'partner' ? 'شريك' : 'أمين عهدة'}</span><button onClick={()=>handleDeleteUser(u.uid)} className="bg-red-50 text-red-600 w-8 h-8 rounded-lg font-bold hover:bg-red-100 transition shadow-sm border border-red-100">🗑️</button></div>
                               </div>
                            ))}
                            {dbUsers.length === 0 && <div className="text-center p-8 bg-slate-50 rounded-2xl border border-slate-200 text-slate-500 font-bold">لا يوجد موظفين مسجلين.</div>}
                         </div>
                      </div>
                   </div>
                </div>

                {/* باقي إعداداتك الأصلية زي ما هي */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mt-6">
                  <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2 flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white"><h4 className="font-bold text-lg">{t.langTitle}</h4><div className="flex bg-slate-700 p-1 rounded-xl"><button onClick={() => setLang('ar')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'ar' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>عربي</button><button onClick={() => setLang('en')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'en' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>English</button></div></div>
                  <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200"><h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">{t.addCatTitle}</h4><form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg(t.success);}} className="flex flex-col gap-3 mb-4"><input required type="text" placeholder={t.catName} className="border-2 p-3 text-md w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/><button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition">{t.addCatBtn}</button></form><div className="flex flex-wrap gap-2">{sortedCategories.map(c => ( <span key={c.id} onClick={() => setAppModal({ show: true, type: 'CAT_ACTION', props: { cat: c } })} className="bg-slate-100 border border-slate-200 p-2 px-3 rounded-lg text-xs font-bold text-slate-700 shadow-sm cursor-pointer hover:bg-blue-50 transition">{c.name}</span> ))}</div></div>
                  <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200"><h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">{t.newCustodyTitle}</h4><form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg(t.success);}} className="space-y-4 relative"><div className="relative"><input required type="text" placeholder={t.respName} className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.personName} onChange={e=>setNewCustody({...newCustody, personName:e.target.value})} onFocus={() => setCustodyNameFocus(true)} onBlur={() => setTimeout(() => setCustodyNameFocus(false), 200)}/>{custodyNameFocus && filteredCustodyNames.length > 0 && ( <div className="absolute top-full left-0 right-0 bg-white border-2 border-slate-200 mt-1 shadow-2xl z-50 max-h-48 overflow-y-auto rounded-xl animate-fade-in">{filteredCustodyNames.map((n, idx) => <div key={idx} className="p-3 text-sm border-b hover:bg-blue-50 cursor-pointer font-bold text-slate-700" onMouseDown={() => setNewCustody({...newCustody, personName: n})}>{n}</div>)}</div> )}</div><div><NumberInput required placeholder={t.initAmount} className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.totalAmount} onChange={v=>setNewCustody({...newCustody, totalAmount:v})}/>{lastCustodyNet > 0 && <span onClick={() => setNewCustody({...newCustody, totalAmount: lastCustodyNet.toString()})} className="block text-xs font-bold text-blue-600 mt-2 cursor-pointer hover:underline bg-blue-50 p-2 rounded-lg text-center border border-blue-100 shadow-sm transition hover:bg-blue-100">💡 {t.suggestedNet} ({lastCustodyNet.toLocaleString()})</span>}</div><button className="bg-slate-800 text-white p-4 rounded-xl w-full text-md font-bold shadow-lg hover:bg-slate-900 transition">{t.saveCustody}</button></form></div>
                  <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2"><h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">تغيير رمز PIN للحماية</h4><form onSubmit={(e)=>{ e.preventDefault(); const formTarget = e.target; const oldPinVal = formTarget.oldPin.value; const newPinVal = formTarget.newPin.value; if (oldPinVal !== (data.pinCode || '0000')) { showMsg(lang === 'ar' ? 'الرمز الحالي غير صحيح' : 'Incorrect current PIN', true); return; } setData(p => { const newData = {...p, pinCode: newPinVal}; localStorage.setItem('real_estate_core_data', JSON.stringify(newData)); return newData; }); showMsg(lang === 'ar' ? 'تم تغيير الرمز بنجاح' : 'PIN changed successfully'); formTarget.reset(); }} className="flex flex-col gap-4"><div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-lg mx-auto w-full"><div><label className="text-xs font-bold text-slate-500 mb-1 block">الرمز الحالي (المستخدم الآن):</label><input name="oldPin" type="password" inputMode="numeric" maxLength="4" pattern="[0-9]{4}" placeholder="****" className="border-2 p-3 text-center tracking-[1em] text-2xl w-full rounded-xl font-bold focus:border-red-500 outline-none bg-slate-50" required /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">الرمز الجديد:</label><input name="newPin" type="password" inputMode="numeric" maxLength="4" pattern="[0-9]{4}" placeholder="****" className="border-2 p-3 text-center tracking-[1em] text-2xl w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" required /></div></div><button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition mt-2 max-w-lg mx-auto w-full">تحديث الرمز السري</button></form></div>
                  <div className="bg-white p-8 shadow-sm rounded-2xl md:col-span-2 text-center border-2 border-dashed border-blue-400 relative overflow-hidden"><div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div><h4 className="font-black mb-3 text-blue-900 text-2xl">{t.backupTitle}</h4><p className="text-sm mb-6 text-slate-600 font-bold bg-blue-50 inline-block p-2 rounded-lg">{t.backupDesc}</p><div className="flex flex-col sm:flex-row gap-4 justify-center mt-6"><button onClick={()=>{const b=new Blob([JSON.stringify(data)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`backup_${todayDateStr}.json`;l.click(); showMsg(t.success);}} className="bg-blue-600 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-blue-700 transition hover:-translate-y-1">{t.exportBtn}</button><label className="bg-amber-500 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-amber-600 transition cursor-pointer hover:-translate-y-1">{t.importBtn}<input type="file" accept=".json" className="hidden" onChange={(e)=>{ const r = new FileReader(); r.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); setData(p => { const newData = { ...imported, pinCode: p.pinCode || '0000' }; localStorage.setItem('real_estate_core_data', JSON.stringify(newData)); return newData; }); showMsg(t.success); } catch { showMsg('Invalid File', true); } }; if(e.target.files[0]) r.readAsText(e.target.files[0]); }}/></label></div></div>
                  <div className="bg-red-50 p-8 shadow-sm rounded-2xl md:col-span-2 border-2 border-red-300 mt-2 relative overflow-hidden"><div className="absolute top-0 left-0 w-full h-2 bg-red-600"></div><h4 className="font-black mb-3 text-red-800 text-center text-2xl">{t.dangerZone}</h4><p className="text-sm text-center text-red-600 mb-6 font-bold">{t.resetDesc}</p><button onClick={handleResetFactory} className="w-full bg-red-600 text-white py-4 rounded-xl text-xl font-black shadow-lg hover:bg-red-700 transition hover:-translate-y-1">{t.resetBtn}</button></div>
                </div>

              </div>
            )}
          </main>
        </div>
      );
    }

    function AppWrapper() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => { setUser(currentUser); setLoading(false); });
        return () => unsubscribe();
      }, []);

      if (loading) return ( <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white flex-col gap-4"><div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div><p className="font-bold text-lg tracking-widest">جاري التحميل...</p></div> );
      if (!user) return <LoginScreen />;
      return <MainApp user={user} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render( <ErrorBoundary><AppWrapper /></ErrorBoundary> );
  </script>
</body>
</html>
