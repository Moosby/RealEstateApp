    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; 
          let width = img.width;
          let height = img.height;
          
          if (width > MAX_WIDTH) {
            height = height * (MAX_WIDTH / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6); 
          callback(compressedBase64);
        }
      }
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 m-4 bg-red-50 border-2 border-red-500 rounded-2xl text-red-900 shadow-xl">
              <h2 className="text-2xl font-black mb-3">⚠️ حدث خطأ في النظام</h2>
              <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full bg-red-600 text-white py-4 rounded-xl font-black">🔄 مسح التعارض وإعادة تشغيل التطبيق</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function NumberInput({ name, value, onChange, placeholder, className, required, id }) {
      const displayVal = (value !== '' && value !== undefined && value !== null && !isNaN(value)) ? Number(value).toLocaleString('en-US') : '';
      return ( <input type="text" id={id} name={name} inputMode="numeric" value={displayVal} placeholder={placeholder} required={required} className={className} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ''); onChange(raw); }} /> );
    }

    function MultiSelectDropdown({ options, selected, onChange, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);
      useEffect(() => {
        const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);
      
      const selectedLabels = (selected || []).map(id => options.find(o => o.id === id)?.label).filter(Boolean);
      const displayTxt = selectedLabels.length === 0 ? placeholder : (selectedLabels.length <= 2 ? selectedLabels.join(' + ') : `(${selectedLabels.length})`);

      return (
        <div className="relative z-20 w-full" ref={dropdownRef}>
          <div className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl bg-white cursor-pointer font-bold flex justify-between items-center shadow-sm hover:border-blue-400 transition" onClick={() => setIsOpen(!isOpen)}>
            <span className="truncate">{displayTxt}</span><span className="text-xs text-blue-600">▼</span>
          </div>
          {isOpen && (
            <div className="absolute top-full right-0 w-full bg-white border-2 border-slate-200 mt-1 shadow-2xl max-h-48 overflow-y-auto z-50 p-2 space-y-2 rounded-xl animate-fade-in">
              <label className="flex items-center gap-2 cursor-pointer font-bold border-b pb-2 text-slate-700 hover:bg-slate-50 p-1 rounded"><input type="checkbox" checked={(selected || []).length===0} onChange={()=>onChange([])} className="w-4 h-4 text-blue-600"/> --- </label>
              {(options || []).map(opt => (
                <label key={opt.id} className="flex items-center gap-2 cursor-pointer whitespace-nowrap text-sm hover:bg-slate-50 p-1 rounded transition">
                  <input type="checkbox" checked={(selected || []).includes(opt.id)} className="w-4 h-4 text-blue-600" onChange={(e)=>{ const newIds = e.target.checked ? [...(selected || []), opt.id] : (selected || []).filter(id=>id!==opt.id); onChange(newIds); }}/> {opt.label}
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

                    updatedInsts.push({
                        id: 'inst_dp_mig_' + c.id,
                        contractId: c.id,
                        amount: Number(c.downPayment),
                        dueDate: c.date || todayDateStr,
                        status: 'paid',
                        partnerPaid: false,
                        isDownPayment: true
                    });
                    needsUpdate = true;
                }
            }
        });

      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];

      const uniqueCustodyNames = useMemo(() => [...new Set((data.custodies||[]).map(c=>c.personName))], [data.custodies]);
      const filteredCustodyNames = newCustody.personName ? uniqueCustodyNames.filter(n => n.includes(newCustody.personName) && n !== newCustody.personName) : [];

      const uniquePartnersList = useMemo(() => {
        const names = [];
        (data.buildings||[]).forEach(b => {
            if (b.hasPartner && b.partnerPercent > 0 && b.partnerName) {
                const tName = b.partnerName.trim();
                if (!names.includes(tName)) names.push(tName);
            }
        });
        return names;
      }, [data.buildings]);

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(tx => tx.type === 'expense' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          const incomes = (data.transactions || []).filter(tx => tx.type === 'income' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount || 0) + incomes - expenses };
        });
      }, [data]);

      let dashboardNet = 0;
      if (dashboardCustodyFilter.length === 0) {
         const inc = (data.transactions||[]).filter(tx=>tx.type==='income' && !tx.custodyId).reduce((s,tx)=>s+Number(tx.amount||0),0);
         const exp = (data.transactions||[]).filter(tx=>tx.type==='expense' && !tx.custodyId).reduce((s,tx)=>s+Number(tx.amount||0),0);
         dashboardNet = inc - exp;
      } else if (dashboardCustodyFilter.includes('ALL')) {
         const inc = (data.transactions||[]).filter(tx=>tx.type==='income').reduce((s,tx)=>s+Number(tx.amount||0),0);
         const exp = (data.transactions||[]).filter(tx=>tx.type==='expense').reduce((s,tx)=>s+Number(tx.amount||0),0);
         const initCust = (data.custodies||[]).reduce((s,c)=>s+Number(c.totalAmount||0),0);
         dashboardNet = initCust + inc - exp;
      } else {
         dashboardNet = custodyCalculations.filter(c => dashboardCustodyFilter.includes(c.id)).reduce((s, c) => s + c.remaining, 0);
      }

      const selectedCustodiesObjs = selectedCustodies.length > 0 ? (data.custodies || []).filter(c => selectedCustodies.includes(c.id)) : (data.custodies || []);
      const totalOpeningBalance = selectedCustodiesObjs.reduce((sum, c) => sum + Number(c.totalAmount || 0), 0);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(tx => {
          if ((selectedCustodies || []).length > 0 && !(selectedCustodies || []).includes(tx.custodyId)) return false;
          if (tx.type !== custodyTabSub) return false;
          if (custodySearch && !tx.description?.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjsR = (reportFilter.custodyIds || []).length > 0 ? (data.custodies || []).filter(c => (reportFilter.custodyIds || []).includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjsR.forEach(c => {
           let bal = Number(c.totalAmount || 0);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(tx => tx.custodyId === c.id && tx.date < reportFilter.startDate);
              bal += beforeTrans.filter(tx => tx.type === 'income').reduce((s, tx) => s + Number(tx.amount || 0), 0);
              bal -= beforeTrans.filter(tx => tx.type === 'expense').reduce((s, tx) => s + Number(tx.amount || 0), 0);
           }
           openingBalance += bal;
        });

        const custodyName = (reportFilter.custodyIds || []).length === 0 ? t.allCustodies : selectedCustodyObjsR.map(c=>c.personName).join(' + ');
        const buildingName = (reportFilter.buildingIds || []).length === 0 ? t.allBuildings : (data.buildings||[]).filter(b=>reportFilter.buildingIds.includes(b.id)).map(b=>b.name).join(' + ');

        const filtered = (data.transactions || []).filter(tx => {
          if (reportFilter.startDate && tx.date < reportFilter.startDate) return false;
          if (reportFilter.endDate && tx.date > reportFilter.endDate) return false;
          if ((reportFilter.custodyIds || []).length > 0 && !(reportFilter.custodyIds || []).includes(tx.custodyId)) return false;
          if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(tx.buildingId)) return false;
          return true;
        }).sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));

        const incomes = filtered.filter(tx => tx.type === 'income');
        const expenses = filtered.filter(tx => tx.type === 'expense');
        const totalIncomes = incomes.reduce((s,tx) => s + Number(tx.amount || 0), 0);
        const totalExpenses = expenses.reduce((s,tx) => s + Number(tx.amount || 0), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName, buildingName };
      }, [data, reportFilter, t]);

      const reportInstallments = useMemo(() => {
        let insts = (data.installments || []).filter(i => {
           if (reportFilter.startDate && i.dueDate < reportFilter.startDate) return false;
           if (reportFilter.endDate && i.dueDate > reportFilter.endDate) return false;
           const contract = (data.contracts || []).find(c => c.id === i.contractId);
           if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(contract?.buildingId)) return false;
           return true;
        });
        insts.sort((a,b) => new Date(a.dueDate || 0) - new Date(b.dueDate || 0));
        return insts;
      }, [data, reportFilter, reportSort]);

      const reportContractsList = useMemo(() => {
        if (reportType !== 'contracts') return [];
        return (data.contracts || []).filter(c => {
           if (c.status !== 'active') return false;
           if (reportFilter.buildingIds.length > 0 && !reportFilter.buildingIds.includes(c.buildingId)) return false;
           return true;
        }).map(c => {
           const b = (data.buildings||[]).find(bd=>bd.id===c.buildingId);
           const u = (data.units||[]).find(un=>un.id===c.unitId);
           const insts = (data.installments||[]).filter(i=>i.contractId===c.id);
           const totalPaid = insts.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.amount), 0);
           const remaining = Number(c.totalAmount) - totalPaid;
           const pendingInsts = insts.filter(i=>i.status==='pending').sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
           const nextDate = pendingInsts.length > 0 ? pendingInsts[0].dueDate : '--';
           return { id: c.id, clientName: c.clientName, buildingName: b?.name, unitNumber: u?.unitNumber, totalAmount: Number(c.totalAmount), paidAmount: totalPaid, remainingAmount: remaining, nextDate };
        });
      }, [data, reportFilter, reportType]);

      const partnerReportData = useMemo(() => {
          if (reportType !== 'partners' || !selectedPartnerR) return null;
          let expected = 0; let paid = 0; let unpaid = 0; let pending = 0;
          
          const targetPartner = selectedPartnerR.trim();
          const bds = (data.buildings||[]).filter(b => b.hasPartner && (b.partnerName||'').trim() === targetPartner);
          const bdsIds = bds.map(b => b.id);
          const activeContracts = (data.contracts||[]).filter(c => c.status === 'active' && bdsIds.includes(c.buildingId));
          const activeContractIds = activeContracts.map(c => c.id);

          const instsDetails = [];

          (data.installments||[]).forEach(inst => {
             if (activeContractIds.includes(inst.contractId)) {
                 const c = activeContracts.find(ct => ct.id === inst.contractId);
                 const b = bds.find(bd => bd.id === c.buildingId);
                 const pShare = Math.round(Number(inst.amount) * (Number(b.partnerPercent)/100));

                 expected += pShare;
                 if (inst.status === 'paid') {
                     if (inst.partnerPaid) {
                         paid += pShare;
                     } else {
                         unpaid += pShare;
                         const clientName = inst.isDownPayment ? `${c.clientName} (مقدم)` : c.clientName;
                         instsDetails.push({ client: clientName, building: b.name, share: pShare, date: inst.dueDate });
                     }
                 } else {
                     pending += pShare;
                 }
             }
          });
          return { expected, paid, unpaid, pending, instsDetails };
      }, [data, reportType, selectedPartnerR]);

      const handlePrint = () => {
        const originalTitle = document.title;
        let printName = t.repCustodyTitle;
        if (reportType === 'installments') printName = t.repSalesTitle;
        if (reportType === 'contracts') printName = t.repContractsTitle;
        if (reportType === 'partners') printName = t.partnerReportTitle;
        document.title = `${printName.replace(/\s+/g, '_')}_${todayDateStr}.pdf`;
        setTimeout(() => { window.print(); document.title = originalTitle; }, 100);
      };

      const handleExportExcel = () => {
        let exportData = [];
        let fileName = 'Report';
        
        if (reportType === 'transactions') {
           fileName = `Statement_${todayDateStr}`;
           exportData.push({ [t.date]: '--', [t.desc]: t.opBalance, [t.amount]: reportData.openingBalance });
           reportData.incomes.forEach(tx => exportData.push({ [t.date]: formatShortDate(tx.date), [t.desc]: tx.description, [t.amount]: tx.amount }));
           reportData.expenses.forEach(tx => exportData.push({ [t.date]: formatShortDate(tx.date), [t.desc]: tx.description, [t.amount]: -Math.abs(tx.amount) }));
           exportData.push({});
           exportData.push({ [t.date]: '', [t.desc]: t.totalIncomes, [t.amount]: reportData.totalIncomes + reportData.openingBalance });
           exportData.push({ [t.date]: '', [t.desc]: t.totalExpenses, [t.amount]: reportData.totalExpenses });
           exportData.push({ [t.date]: '', [t.desc]: t.currentNet, [t.amount]: reportData.finalBalance });
        } else if (reportType === 'installments') {
           fileName = `Installments_${todayDateStr}`;
           reportInstallments.forEach(i => {
              const c = (data.contracts||[]).find(ct=>ct.id===i.contractId);
              const b = (data.buildings||[]).find(bd=>bd.id===c?.buildingId);
              const totalAmt = Math.round(Number(i.amount));
              const hasPartner = b?.hasPartner && b.partnerPercent > 0;
              const partnerShare = hasPartner ? Math.round(totalAmt * (b.partnerPercent/100)) : 0;
              const myShare = totalAmt - partnerShare;
              const partnerDue = (hasPartner && !i.partnerPaid) ? partnerShare : 0;
              const partnerPaidStat = (hasPartner && i.partnerPaid) ? partnerShare : 0;
              
              exportData.push({ [t.dueDate]: formatShortDate(i.dueDate), [t.client]: c?.clientName, [t.building]: `${b?.name} - ${c?.unitId}`, [t.amount]: totalAmt, [t.myShare]: myShare, [t.partnerDue]: partnerDue, [t.partnerPaidStatus]: partnerPaidStat, [t.status]: i.status==='paid'?t.paid:t.pending });
           });
        } else if (reportType === 'contracts') {
           fileName = `ClientsStatus_${todayDateStr}`;
           reportContractsList.forEach(c => {
              exportData.push({ [t.client]: c.clientName, [t.building]: `${c.buildingName} - ${c.unitNumber}`, [t.totalUnit]: c.totalAmount, [t.paidAmt]: c.paidAmount, [t.remAmt]: c.remainingAmount, [t.nextDue]: c.nextDate==='--'?'--':formatShortDate(c.nextDate) });
           });
           exportData.push({});
           exportData.push({ [t.client]: '', [t.building]: t.total, [t.totalUnit]: reportContractsList.reduce((s,c)=>s+c.totalAmount,0), [t.paidAmt]: reportContractsList.reduce((s,c)=>s+c.paidAmount,0), [t.remAmt]: reportContractsList.reduce((s,c)=>s+c.remainingAmount,0), [t.nextDue]: '' });
        } else if (reportType === 'partners' && partnerReportData) {
           fileName = `Partner_${selectedPartnerR}_${todayDateStr}`;
           partnerReportData.instsDetails.forEach(d => {
              exportData.push({ [t.client]: d.client, [t.building]: d.building, [t.amount]: d.share, [t.dueDate]: formatShortDate(d.date) });
           });
        }
        
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `${fileName}.xlsx`);
        showMsg(t.success);
      };

      const handleTxClick = (tx) => { if(tx) setAppModal({ show: true, type: 'TX_ACTION', props: { tx } }); };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if(!newTransaction.amount) return;
        if (editingTxId) {
          setData(prev => ({ ...prev, transactions: prev.transactions.map(tx => tx.id === editingTxId ? { ...tx, ...newTransaction, amount: Number(newTransaction.amount) } : tx) }));
          setEditingTxId(null); showMsg(t.success);
        } else {
          const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) };
          setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] })); showMsg(t.success);
        }
        setNewTransaction(prev => ({ ...prev, amount: '', description: '', date: getTodayStr() })); 
      };

      const handleResetFactory = () => { 
        requirePin(() => {
          setAppModal({show: true, type: 'CONFIRM', props: {
            title: t.dangerZone,
            message: t.resetDesc,
            onConfirm: () => { 
              const currentPin = data.pinCode || '0000';
              localStorage.clear(); 
              localStorage.setItem('real_estate_core_data', JSON.stringify({ ...initialData, pinCode: currentPin }));
              window.location.reload(); 
            }
          }});
        });
      };
      
      const addBuilding = (e) => { 
        e.preventDefault(); 
        const pPercent = newBuildingPartner ? Number(newBuildingPartnerPercent) : 0;
        const pName = newBuildingPartnerName || ('شريك ' + newBuilding); 
        setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding, hasPartner: newBuildingPartner, partnerPercent: pPercent, partnerName: pName}]})); 
        setNewBuilding(''); setNewBuildingPartner(false); setNewBuildingPartnerPercent(''); setNewBuildingPartnerName(''); showMsg(t.success); 
      };

      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg(t.success); };
      
      const addContract = (e) => { 
         e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return; 
         const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); const interval = Number(newContract.interval);

         setData(prev => {
            let updatedContracts = [...(prev.contracts || [])];
            let updatedInstallments = [...(prev.installments || [])];
            let updatedTransactions = [...(prev.transactions || [])];
            let contractId;

            if (editingContractId) {
               contractId = editingContractId;
               const oldContract = updatedContracts.find(c => c.id === contractId);
               
               const oldInsts = updatedInstallments.filter(i => i.contractId === contractId);
               const totalOldPaid = oldInsts.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0);

               updatedInstallments = updatedInstallments.filter(i => i.contractId !== contractId);

               if (totalOldPaid > 0) {
                  updatedTransactions.push({
                     id: 't_rev_' + Date.now(), type: 'expense', amount: totalOldPaid, buildingId: oldContract.buildingId, custodyId: '', 
                     description: `تسوية لإلغاء مدفوعات سابقة بسبب تعديل عقد: ${newContract.clientName}`, date: todayDateStr
                  });
               }

               const contractIndex = updatedContracts.findIndex(c => c.id === contractId);
               updatedContracts[contractIndex] = {
                  ...oldContract, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, 
                  totalAmount: total, downPayment: dp, installmentsCount: count, interval: interval
               };

            } else {
               contractId = 'cont_' + Date.now(); 
               updatedContracts.push({
                  id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, 
                  totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active',
                  installmentsCount: count, interval: interval, attachments: []
               });
            }

            const newInsts = []; 
            if (dp > 0) {
               newInsts.push({ id: 'inst_dp_' + Date.now(), contractId, amount: dp, dueDate: todayDateStr, status: 'paid', partnerPaid: false, isDownPayment: true });
            }

            let curDate = new Date(newContract.firstInstallmentDate); 
            const baseInstAmount = count > 0 ? Math.floor((total - dp) / count) : 0; 
            let remainder = (total - dp) - (baseInstAmount * count);
            for(let i=0; i<count; i++) { 
               let currentAmt = baseInstAmount;
               if (i === count - 1) currentAmt += remainder; 
               newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: currentAmt, dueDate: curDate.toISOString().split('T')[0], status: 'pending', partnerPaid: false }); 
               curDate.setMonth(curDate.getMonth() + interval); 
            } 
            updatedInstallments.push(...newInsts);

            if (dp > 0) {
               updatedTransactions.push({ 
                  id: 't_dp_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, custodyId: '',
                  description: `مقدم تعاقد ${editingContractId ? '(معدل)' : ''}: ${newContract.clientName}`, date: todayDateStr 
               });
            }

            const updatedUnits = (prev.units || []).map(u => {
               if(u.id === unit.id) return { ...u, status: 'sold' };
               if(editingContractId) {
                  const oldC = prev.contracts.find(c => c.id === editingContractId);
                  if (oldC && oldC.unitId === u.id && oldC.unitId !== unit.id) return { ...u, status: 'available' };
               }
               return u;
            });

            return { ...prev, contracts: updatedContracts, installments: updatedInstallments, transactions: updatedTransactions, units: updatedUnits };
         });

         setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' }); 
         setEditingContractId(null);
         showMsg(t.success); 
      };

      const payInstallment = (instId, clientName, buildingId, paidAmount, date, custodyId) => {
        const paid = Number(paidAmount);
        setData(prev => {
          let updatedInsts = [...(prev.installments || [])];
          const instIndex = updatedInsts.findIndex(i => i.id === instId);
          if(instIndex > -1) {
              const instToUpdate = updatedInsts[instIndex];
              const fullAmount = Number(instToUpdate.amount);
              if (paid >= fullAmount) {
                updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid };
              } else {
                const remaining = fullAmount - paid;
                updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid };
                updatedInsts.push({ id: 'inst_rem_' + Date.now(), contractId: instToUpdate.contractId, amount: remaining, dueDate: instToUpdate.dueDate, status: 'pending', partnerPaid: false });
              }
              const trans = { id: 't_' + Date.now(), type: 'income', amount: paid, buildingId, custodyId: custodyId || '', description: (lang==='ar'?`تحصيل قسط ${paid < fullAmount ? '(جزئي)' : ''}: ${clientName}`:`Installment Collection ${paid < fullAmount ? '(Partial)' : ''}: ${clientName}`), date: date || todayDateStr };
              return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
          }
          return prev;
        });
        showMsg(t.success);
      };

      const payPartnerShare = (instId, partnerAmt, clientName, buildingName, custodyId, date) => {
        if (!custodyId) return showMsg(lang==='ar'?'مطلوب اختيار عهدة':'Safe is required', true);
        setData(prev => {
          const updatedInsts = prev.installments.map(i => i.id === instId ? { ...i, partnerPaid: true } : i);
          const trans = {
            id: 't_' + Date.now(), type: 'expense', amount: partnerAmt, buildingId: '', custodyId: custodyId, 
            description: (lang==='ar'?`توريد نصيب الشريك - ${clientName} - ${buildingName}`:`Pay Partner Share - ${clientName} - ${buildingName}`), 
            date: date || getTodayStr()
          };
          return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
        });
        showMsg(t.success);
      };

      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 && dashboardCustodyFilter[0] !== 'ALL' ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody, date: getTodayStr() }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate?.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
      const overdueInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate < todayDateStr).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));

      const tabs = [
        { id: 'dashboard', label: t.tab_dash }, { id: 'transactions', label: t.tab_tx },
        { id: 'custody', label: t.tab_cust }, { id: 'inventory', label: t.tab_inv },
        { id: 'sales', label: t.tab_sales }, { id: 'reports', label: t.tab_rep }
      ];

      const sortedCustodies = [...(data.custodies || [])].reverse();
      const sortedBuildings = [...(data.buildings || [])].reverse();
      const sortedCategories = [...(data.categories || [])].reverse();
      const lastCustodyNet = sortedCustodies.length > 0 ? (custodyCalculations.find(c => c.id === sortedCustodies[0].id)?.remaining || 0) : 0;

      const filteredContracts = (data.contracts || []).filter(c => c.status === 'active' && (!globalSearch || c.clientName.includes(globalSearch)));

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">
          <header className="bg-slate-900 text-white p-4 shadow-lg print-hide flex justify-between items-center relative z-40">
            <h1 className="text-xl font-bold tracking-wide flex items-center gap-2">🏢 <span className="hidden sm:inline">{t.appTitle}</span></h1>
            <button onClick={() => setActiveTab('settings')} className="text-2xl hover:rotate-90 transition-transform">⚙️</button>
          </header>

          <nav className="bg-slate-800 text-slate-200 grid grid-cols-3 md:grid-cols-6 border-b border-slate-700 print-hide shadow-md">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => {setActiveTab(tab.id); setEditingTxId(null); setGlobalSearch(''); setEditingContractId(null);}} 
                className={`p-3 text-sm font-bold text-center border-b border-l border-slate-700 transition-colors ${activeTab === tab.id ? 'bg-slate-100 text-blue-800 border-b-4 border-b-blue-600 shadow-inner' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {toast.show && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[200] animate-slide-up print-hide w-[90%] max-w-sm">
              <div className={`px-6 py-4 rounded-2xl shadow-2xl font-bold text-white flex items-center justify-center gap-3 ${toast.isError ? 'bg-red-600' : 'bg-emerald-600'}`}>
                <span className="text-2xl">{toast.isError ? '⚠️' : '✅'}</span><span className="text-lg">{toast.msg}</span>
              </div>
            </div>
          )}

          {appModal.show && (
            <div className={`fixed inset-0 bg-slate-900 bg-opacity-70 backdrop-blur-sm flex items-center justify-center z-[100] animate-fade-in p-4 ${appModal.type !== 'RECEIPT' ? 'print-hide' : 'print-receipt-wrapper'}`} onClick={closeModal}>
              
              {appModal.type === 'TX_ACTION' && appModal.props.tx && (

                      <div className="relative z-20">
                        <label className="text-xs font-bold text-slate-500 mb-1 block">{t.building}</label>
                        <MultiSelectDropdown options={sortedBuildings.map(b => ({ id: b.id, label: b.name }))} selected={reportFilter.buildingIds} onChange={(newIds) => setReportFilter({...reportFilter, buildingIds: newIds})} placeholder={t.allBuildings} />
                      </div>
                    </div>
                  )}

                  <div className="flex gap-4 flex-col md:flex-row">
                    <button onClick={handlePrint} className="flex-1 bg-slate-800 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-slate-900 transition-transform hover:-translate-y-1">{t.printPdf}</button>
                    <button onClick={handleExportExcel} className="flex-1 bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-green-700 transition-transform hover:-translate-y-1">{t.exportExcel}</button>
                  </div>
                </div>
              </div>
            )}

            {/* Settings Tab */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 print-hide animate-fade-in">
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2 flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                  <h4 className="font-bold text-lg">{t.langTitle}</h4>
                  <div className="flex bg-slate-700 p-1 rounded-xl">
                    <button onClick={() => setLang('ar')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'ar' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>عربي</button>
                    <button onClick={() => setLang('en')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'en' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>English</button>
                  </div>
                </div>

                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">{t.addCatTitle}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg(t.success);}} className="flex flex-col gap-3 mb-4">
                    <input required type="text" placeholder={t.catName} className="border-2 p-3 text-md w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/>
                    <button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition">{t.addCatBtn}</button>
                  </form>
                  <div className="flex flex-wrap gap-2">
                    {sortedCategories.map(c => (
                      <span key={c.id} onClick={() => setAppModal({ show: true, type: 'CAT_ACTION', props: { cat: c } })} className="bg-slate-100 border border-slate-200 p-2 px-3 rounded-lg text-xs font-bold text-slate-700 shadow-sm cursor-pointer hover:bg-blue-50 transition">{c.name}</span>
                    ))}
                  </div>
                </div>
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">{t.newCustodyTitle}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg(t.success);}} className="space-y-4 relative">
                    <div className="relative">
                      <input required type="text" placeholder={t.respName} className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.personName} 
                        onChange={e=>setNewCustody({...newCustody, personName:e.target.value})} onFocus={() => setCustodyNameFocus(true)} onBlur={() => setTimeout(() => setCustodyNameFocus(false), 200)}/>
                      {custodyNameFocus && filteredCustodyNames.length > 0 && (
                        <div className="absolute top-full left-0 right-0 bg-white border-2 border-slate-200 mt-1 shadow-2xl z-50 max-h-48 overflow-y-auto rounded-xl animate-fade-in">
                          {filteredCustodyNames.map((n, idx) => <div key={idx} className="p-3 text-sm border-b hover:bg-blue-50 cursor-pointer font-bold text-slate-700" onMouseDown={() => setNewCustody({...newCustody, personName: n})}>{n}</div>)}
                        </div>
                      )}
                    </div>
                    <div>
                      <NumberInput required placeholder={t.initAmount} className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.totalAmount} onChange={v=>setNewCustody({...newCustody, totalAmount:v})}/>
                      {lastCustodyNet > 0 && <span onClick={() => setNewCustody({...newCustody, totalAmount: lastCustodyNet.toString()})} className="block text-xs font-bold text-blue-600 mt-2 cursor-pointer hover:underline bg-blue-50 p-2 rounded-lg text-center border border-blue-100 shadow-sm transition hover:bg-blue-100">💡 {t.suggestedNet} ({lastCustodyNet.toLocaleString()})</span>}
                    </div>
                    <button className="bg-slate-800 text-white p-4 rounded-xl w-full text-md font-bold shadow-lg hover:bg-slate-900 transition">{t.saveCustody}</button>
                  </form>
                </div>
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">تغيير رمز PIN للحماية</h4>
                  <form onSubmit={(e)=>{
                    e.preventDefault();
                    const formTarget = e.target;
                    const oldPinVal = formTarget.oldPin.value;
                    const newPinVal = formTarget.newPin.value;
                    
                    if (oldPinVal !== (data.pinCode || '0000')) {
                        showMsg(lang === 'ar' ? 'الرمز الحالي غير صحيح' : 'Incorrect current PIN', true);
                        return;
                    }
                    
                    setData(p => {
                       const newData = {...p, pinCode: newPinVal};
                       localStorage.setItem('real_estate_core_data', JSON.stringify(newData));
                       return newData;
                    });
                    showMsg(lang === 'ar' ? 'تم تغيير الرمز بنجاح' : 'PIN changed successfully');
                    formTarget.reset();
                  }} className="flex flex-col gap-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-lg mx-auto w-full">
                       <div>
                         <label className="text-xs font-bold text-slate-500 mb-1 block">الرمز الحالي (المستخدم الآن):</label>
                         <input name="oldPin" type="password" inputMode="numeric" maxLength="4" pattern="[0-9]{4}" placeholder="****" className="border-2 p-3 text-center tracking-[1em] text-2xl w-full rounded-xl font-bold focus:border-red-500 outline-none bg-slate-50" required />
                       </div>
                       <div>
                         <label className="text-xs font-bold text-slate-500 mb-1 block">الرمز الجديد:</label>
                         <input name="newPin" type="password" inputMode="numeric" maxLength="4" pattern="[0-9]{4}" placeholder="****" className="border-2 p-3 text-center tracking-[1em] text-2xl w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" required />
                       </div>
                    </div>
                    <button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition mt-2 max-w-lg mx-auto w-full">تحديث الرمز السري</button>
                  </form>
                </div>

                <div className="bg-white p-8 shadow-sm rounded-2xl md:col-span-2 text-center border-2 border-dashed border-blue-400 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                  <h4 className="font-black mb-3 text-blue-900 text-2xl">{t.backupTitle}</h4>
                  <p className="text-sm mb-6 text-slate-600 font-bold bg-blue-50 inline-block p-2 rounded-lg">{t.backupDesc}</p>
                  <div className="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                    <button onClick={()=>{const b=new Blob([JSON.stringify(data)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`backup_${todayDateStr}.json`;l.click(); showMsg(t.success);}} className="bg-blue-600 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-blue-700 transition hover:-translate-y-1">{t.exportBtn}</button>
                    
                    <label className="bg-amber-500 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-amber-600 transition cursor-pointer hover:-translate-y-1">
                      {t.importBtn}
                      <input type="file" accept=".json" className="hidden" onChange={(e)=>{
                        const r = new FileReader();
                        r.onload = (ev) => {
                          try {
                            const imported = JSON.parse(ev.target.result);
                            setData(p => {
                                const newData = { ...imported, pinCode: p.pinCode || '0000' }; 
                                localStorage.setItem('real_estate_core_data', JSON.stringify(newData));
                                return newData;
                            });
                            showMsg(t.success);
                          } catch {
                            showMsg('Invalid File', true);
                          }
                        };
                        if(e.target.files[0]) r.readAsText(e.target.files[0]);
                      }}/>
                    </label>
                  </div>
                </div>

                <div className="bg-red-50 p-8 shadow-sm rounded-2xl md:col-span-2 border-2 border-red-300 mt-2 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-red-600"></div>
                  <h4 className="font-black mb-3 text-red-800 text-center text-2xl">{t.dangerZone}</h4>
                  <p className="text-sm text-center text-red-600 mb-6 font-bold">{t.resetDesc}</p>
                  <button onClick={handleResetFactory} className="w-full bg-red-600 text-white py-4 rounded-xl text-xl font-black shadow-lg hover:bg-red-700 transition hover:-translate-y-1">{t.resetBtn}</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
</body>
</html>
