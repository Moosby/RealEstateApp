      reader.onerror = () => alert('حدث خطأ في قراءة الملف');

        const img = new Image(); 
        img.onerror = () => alert('ملف الصورة غير مدعوم أو تالف'); 
        img.onload = () => { 
          try { 
            const canvas = document.createElement('canvas'); 
            const MAX_WIDTH = 800; 
            let width = img.width; 
            let height = img.height; 
            if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; } 
            canvas.width = width; canvas.height = height; 
            const ctx = canvas.getContext('2d'); 
            ctx.drawImage(img, 0, 0, width, height); 
            callback(canvas.toDataURL('image/jpeg', 0.5)); 
          } catch(err) { alert('خطأ في معالجة الصورة'); } 
        }; 
        img.src = event.target.result; 
      }

    function AuthScreen() {
      const [lang, setLang] = useState(() => localStorage.getItem('real_estate_lang') || 'ar');
      const t = dict[lang] || dict['ar'];
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState(''); const [password, setPassword] = useState(''); 
      const [confirmPassword, setConfirmPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [compName, setCompName] = useState(''); const [compOwner, setCompOwner] = useState('');
      const [compPhone, setCompPhone] = useState(''); const [compAddress, setCompAddress] = useState('');
      const [error, setError] = useState(''); const [loading, setLoading] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_lang', lang); document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang; }, [lang]);
            
      const handleAuth = async (e) => { 
          e.preventDefault(); 
          setLoading(true); 
          setError(''); 
          
          if (!isLogin && password !== confirmPassword) {
              setError(lang === 'ar' ? 'كلمات المرور غير متطابقة ⚠️' : 'Passwords do not match ⚠️');
              setLoading(false);
              return;
          }

          try {
              if (!rememberMe) { await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } 
              else { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
              
              if (isLogin) { await auth.signInWithEmailAndPassword(email, password); } 
              else {
                  const res = await auth.createUserWithEmailAndPassword(email, password);
                  const newCompId = 'COMP_' + Date.now();
                  await db.ref(`systemUsers/${res.user.uid}`).set({ name: compOwner, email: email, role: 'admin', companyId: newCompId, createdAt: new Date().toISOString() });
                  await db.ref(`companies/${newCompId}/info`).set({ companyName: compName, ownerName: compOwner, phone: compPhone, address: compAddress, createdAt: new Date().toISOString() });
              }
          } catch (err) {
              console.error("Auth Error:", err);
              let errorMsg = lang === 'ar' ? 'حدث خطأ أثناء الاتصال ❌' : 'Connection error ❌';

                   localStorage.setItem(`real_estate_data_${currentUserData.companyId}`, JSON.stringify({ ...initialData, ...cloudData }));

          let updatedInsts = [...prev.installments]; let updatedContracts = [...prev.contracts]; const contractIndex = updatedContracts.findIndex(c => c.id === oldInst.contractId);
          let currentSuspended = (contractIndex > -1 ? Number(updatedContracts[contractIndex].suspendedAmount || 0) : 0);
          if (newAmt <= 0) { updatedInsts = updatedInsts.filter(i => i.id !== instId); currentSuspended += oldAmt; } else { updatedInsts[instIndex] = { ...oldInst, amount: newAmt, dueDate: newDueDate || oldInst.dueDate, status: 'pending' }; if (diff > 0) { currentSuspended += diff; } else if (diff < 0) { const increase = Math.abs(diff); currentSuspended = Math.max(0, currentSuspended - increase); } }
          if (contractIndex > -1) { updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: currentSuspended }; }
          return { ...prev, installments: updatedInsts, contracts: updatedContracts };
        }, { action: 'تعديل قسط', details: `تعديل قيمة/تاريخ القسط ID: ${instId} إلى ${newAmt} ج.م` }); showMsg(t.success);
      };

      const addManualInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum); if(!amt || amt <= 0) return;
        updateData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId); let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) { const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0); const newSuspended = Math.max(0, currentSuspended - amt); updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended }; }
          const newInst = { id: 'inst_man_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        }, { action: 'إضافة قسط يدوي', details: `إضافة قسط يدوي بقيمة ${amt} ج.م` }); showMsg(t.success);

      const convertSuspendedToInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum); if (!amt || amt <= 0) return;
        updateData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId); let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) { const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0); const deductAmt = Math.min(amt, currentSuspended); const newSuspended = Math.max(0, currentSuspended - deductAmt); updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended }; }
          const newInst = { id: 'inst_conv_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        }); showMsg(t.success);
      };

      const payInstallment = (instId, clientName, buildingId, paidAmount, date, custodyId, penaltyAmt = 0, discountAmt = 0) => {
        const paid = Number(paidAmount);

        const discount = Number(discountAmt) || 0;
        const netCollected = paid + penalty - discount;

        updateData(prev => {
          let updatedInsts = [...(prev.installments || [])]; const instIndex = updatedInsts.findIndex(i => i.id === instId);
          if(instIndex > -1) {
              const instToUpdate = updatedInsts[instIndex]; const fullAmount = Number(instToUpdate.amount);
              if (paid <= 0) { updatedInsts[instIndex] = { ...instToUpdate, amount: 0, status: 'suspended' }; } 
              else if (paid >= fullAmount) { updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid }; } 
              else { const remaining = fullAmount - paid; updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid }; updatedInsts.push({ id: 'inst_rem_' + Date.now(), contractId: instToUpdate.contractId, amount: remaining, dueDate: instToUpdate.dueDate, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 }); }
              
              let updatedTrans = [...(prev.transactions || [])];

          } return prev;
        }, { action: 'تحصيل قسط', details: `تحصيل قسط للعميل ${clientName} بمبلغ ${netCollected} ج.م` }); showMsg(t.success);

          return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
        }, { action: 'توريد لشريك', details: `توريد مبلغ ${paidAmtNum} ج.م للشريك عن العميل ${clientName}` }); showMsg(t.success);

                )}

                {/* زر الخروج من النظام */}
                <button onClick={() => setAppModal({ show: true, type: 'LOGOUT' })} className="w-full bg-red-50 text-red-600 border border-red-200 py-4 rounded-xl font-black text-lg shadow-sm hover:bg-red-100 transition mt-6 flex justify-center items-center gap-2">
                   {lang === 'ar' ? 'تسجيل الخروج' : 'Logout'} 🚪
                </button>

              </div>
            )}
          </main>
        </div>
      );
    }

    function AppWrapper() {
      const [user, setUser] = useState(null);
      const [userData, setUserData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isFetchingUser, setIsFetchingUser] = useState(false);
      const [globalError, setGlobalError] = useState(''); 

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => { 
            if (currentUser) {
                setUser(currentUser);
                setIsFetchingUser(true);
                db.ref(`systemUsers/${currentUser.uid}`).once('value').then(snap => {
                    const data = snap.val();
                    if (data && data.companyId && data.status !== 'disabled') {
                        setUserData(data);
                        setGlobalError('');
                    } else {
                        auth.signOut().then(() => {
                            if (data && data.status === 'disabled') {
                                setGlobalError('تم حظر هذا الحساب من قبل إدارة الشركة، تواصل مع المدير.');
                            } else {
                                setGlobalError('هذا الحساب غير مكتمل أو قديم. يرجى التوجه لـ "تسجيل شركة جديدة".');
                            }
                            setUserData(null);
                        });
                    }
                    setIsFetchingUser(false);
                    setLoading(false);
                }).catch((err) => {
                    auth.signOut().then(() => {
                        setGlobalError('حدث خطأ في قراءة البيانات من السيرفر. حاول مجدداً.');
                        setUserData(null);
                    });
                    setIsFetchingUser(false);
                    setLoading(false);
                });
            } else { 
                setUser(null); 
                setUserData(null); 
                setIsFetchingUser(false);
                setLoading(false); 
            }
        });
        return () => unsubscribe();
      }, []);

      if (loading || isFetchingUser) return ( 
          <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white flex-col gap-4">
             <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
             <p className="font-bold text-lg tracking-widest">جاري التحميل...</p>
          </div> 
      );
      
      if (globalError) return (
         <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
             <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center animate-slide-up">
                <div className="text-5xl mb-4">⚠️</div>
                <h2 className="text-lg font-black text-slate-800 mb-6 leading-relaxed">{globalError}</h2>
                <button onClick={() => { setGlobalError(''); window.location.reload(); }} className="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg hover:bg-blue-700 transition-transform hover:-translate-y-1">العودة للرئيسية</button>
             </div>
         </div>
      );

      if (!user || !userData) return <AuthScreen />;
      return <MainApp user={user} currentUserData={userData} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render( <ErrorBoundary><AppWrapper /></ErrorBoundary> );
  </script>
</body>
</html>
