    // -------------------------------------------------------------
    function MainApp({ user }) {
      const [lang, setLang] = useState(() => localStorage.getItem('real_estate_lang') || 'ar');
      const t = dict[lang] || dict['ar'];

      useEffect(() => {
        localStorage.setItem('real_estate_lang', lang);
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      // في الخطوة دي لسه بنقرأ من اللوكال ستوريدج، الخطوة الجاية هنربطها بالسيرفر
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        if (saved) { try { const parsed = JSON.parse(saved); return { ...initialData, ...parsed }; } catch (e) { return initialData; } }
        return initialData;
      });

      useEffect(() => {
        let needsUpdate = false;
        let updatedInsts = [...(data.installments || [])];
        (data.contracts || []).forEach(c => {
            if (Number(c.downPayment) > 0) {
                const hasDpInst = updatedInsts.some(i => i.contractId === c.id && i.isDownPayment);
                if (!hasDpInst) {
                    updatedInsts.push({ id: 'inst_dp_mig_' + c.id, contractId: c.id, amount: Number(c.downPayment), dueDate: c.date || todayDateStr, status: 'paid', partnerPaid: false, partnerPaidAmount: 0, isDownPayment: true });
                    needsUpdate = true;
                }
            }
        });
        if (needsUpdate) setData(prev => ({ ...prev, installments: updatedInsts }));
      }, []);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState({ show: false, msg: '', isError: false });
      const [appModal, setAppModal] = useState({ show: false, type: '', props: {} });
      const [editingTxId, setEditingTxId] = useState(null);
      const [editingContractId, setEditingContractId] = useState(null);
      const [globalSearch, setGlobalSearch] = useState('');
      const [showContractsList, setShowContractsList] = useState(false);
      const [newBuilding, setNewBuilding] = useState('');
      const [newBuildingPartner, setNewBuildingPartner] = useState(false);
      const [newBuildingPartnerPercent, setNewBuildingPartnerPercent] = useState('');
      const [newBuildingPartnerName, setNewBuildingPartnerName] = useState('');
      const [newUnit, setNewUnit] = useState({ buildingId: '', unitNumber: '', price: '' });
      const [newCategory, setNewCategory] = useState('');
      const [newCustody, setNewCustody] = useState({ personName: '', totalAmount: '', notes: '' });
      const [newTransaction, setNewTransaction] = useState({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', toCustodyId: '', description: '', date: todayDateStr });
      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', custodyId: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' });
      const [reportType, setReportType] = useState('transactions'); 
      const [reportFilter, setReportFilter] = useState({ startDate: '', endDate: '', custodyIds: [], buildingIds: [] });
      const [reportSort, setReportSort] = useState('date');
      const [selectedPartnerR, setSelectedPartnerR] = useState(''); 
      const [showPartnerDetails, setShowPartnerDetails] = useState(false);
      const [dashboardCustodyFilter, setDashboardCustodyFilter] = useState(() => { try { const s=localStorage.getItem('real_estate_last_custody'); if(!s) return []; const p = JSON.parse(s); return Array.isArray(p) ? p : [p].filter(Boolean); }catch(e){return [];} });
      const [selectedCustodies, setSelectedCustodies] = useState([]);
      const [custodyTabSub, setCustodyTabSub] = useState('income');
      const [custodySearch, setCustodySearch] = useState('');
      const [descFocus, setDescFocus] = useState(false);
      const [showMonthDetails, setShowMonthDetails] = useState(false);
      const [expandedBuildings, setExpandedBuildings] = useState({});
      const [custodyNameFocus, setCustodyNameFocus] = useState(false);
      const [showOverdue, setShowOverdue] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_core_data', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('real_estate_last_custody', JSON.stringify(dashboardCustodyFilter)); }, [dashboardCustodyFilter]);

      const showMsg = (msg, isError = false) => { setToast({ show: true, msg, isError }); setTimeout(() => setToast(p => ({ ...p, show: false })), 3500); };
      const closeModal = () => setAppModal({ show: false, type: '', props: {} });
      const requirePin = (onSuccess) => setAppModal({ show: true, type: 'PIN', props: { onSuccess } });
      const formatShortDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].substring(2)}` : d; };

      const allDescriptions = useMemo(() => { const descs = []; for (let i = (data.transactions || []).length - 1; i >= 0; i--) { const d = data.transactions[i]?.description; if (d && !descs.includes(d)) descs.push(d); } return descs; }, [data.transactions]);
      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];
      const uniqueCustodyNames = useMemo(() => [...new Set((data.custodies||[]).map(c=>c.personName))], [data.custodies]);
      const filteredCustodyNames = newCustody.personName ? uniqueCustodyNames.filter(n => n.includes(newCustody.personName) && n !== newCustody.personName) : [];
      const uniquePartnersList = useMemo(() => { const names = []; (data.buildings||[]).forEach(b => { if (b.hasPartner && b.partnerPercent > 0 && b.partnerName) { const tName = b.partnerName.trim(); if (!names.includes(tName)) names.push(tName); } }); return names; }, [data.buildings]);

      const sortedCustodies = useMemo(() => [...(data.custodies || [])].reverse(), [data.custodies]);
      const sortedBuildings = useMemo(() => [...(data.buildings || [])].reverse(), [data.buildings]);
      const sortedCategories = useMemo(() => [...(data.categories || [])].reverse(), [data.categories]);

      const custodyOptions = useMemo(() => [ { value: '', label: t.generalSafe }, ...sortedCustodies.map(c => ({ value: c.id, label: c.personName })) ], [sortedCustodies, t.generalSafe]);
      const custodyMultiOptions = useMemo(() => [ { id: 'ALL', label: '🌐 جميع العهد والخزينة' }, { id: 'GENERAL_SAFE', label: '🏛️ الخزينة العامة' }, ...sortedCustodies.map(c => ({ id: c.id, label: c.personName })) ], [sortedCustodies]);
      const buildingOptions = useMemo(() => [ { value: '', label: t.allBuildings }, ...sortedBuildings.map(b => ({ value: b.id, label: b.name })) ], [sortedBuildings, t.allBuildings]);
      const categoryOptions = useMemo(() => [ { value: '', label: t.selectCat }, ...sortedCategories.map(c => ({ value: c.id, label: c.name })) ], [sortedCategories, t.selectCat]);

      const isTxInSelectedCustodies = (tx, selectedIds) => {
        if (!selectedIds || selectedIds.length === 0 || selectedIds.includes('ALL')) return true;
        const hasGeneralSafe = selectedIds.includes('GENERAL_SAFE');
        const specificIds = selectedIds.filter(id => id !== 'ALL' && id !== 'GENERAL_SAFE');
        if (hasGeneralSafe) { if (!tx.custodyId && !tx.toCustodyId) return true; if (tx.type === 'transfer' && (!tx.custodyId || !tx.toCustodyId)) return true; }
        if (specificIds.length > 0) { if (tx.custodyId && specificIds.includes(tx.custodyId)) return true; if (tx.toCustodyId && specificIds.includes(tx.toCustodyId)) return true; }
        return false;
      };

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(tx => (tx.type === 'expense' && tx.custodyId === c.id) || (tx.type === 'transfer' && tx.custodyId === c.id)).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          const incomes = (data.transactions || []).filter(tx => (tx.type === 'income' && tx.custodyId === c.id) || (tx.type === 'transfer' && tx.toCustodyId === c.id)).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount || 0) + incomes - expenses };
        });
      }, [data]);

      let dashboardNet = 0;
      if (!dashboardCustodyFilter || dashboardCustodyFilter.length === 0 || dashboardCustodyFilter.includes('ALL')) {
         const inc = (data.transactions||[]).filter(tx=>tx.type==='income').reduce((s,tx)=>s+Number(tx.amount||0),0);
         const exp = (data.transactions||[]).filter(tx=>tx.type==='expense').reduce((s,tx)=>s+Number(tx.amount||0),0);
         const initCust = (data.custodies||[]).reduce((s,c)=>s+Number(c.totalAmount||0),0);
         dashboardNet = initCust + inc - exp;
      } else {
         let net = 0;
         if (dashboardCustodyFilter.includes('GENERAL_SAFE')) {
            const inc = (data.transactions||[]).filter(tx => (tx.type==='income' && !tx.custodyId) || (tx.type==='transfer' && !tx.toCustodyId)).reduce((s,tx)=>s+Number(tx.amount||0),0);
            const exp = (data.transactions||[]).filter(tx => (tx.type==='expense' && !tx.custodyId) || (tx.type==='transfer' && !tx.custodyId)).reduce((s,tx)=>s+Number(tx.amount||0),0);
            net += (inc - exp);
         }
         const specIds = dashboardCustodyFilter.filter(id => id !== 'ALL' && id !== 'GENERAL_SAFE');
         if (specIds.length > 0) { net += custodyCalculations.filter(c => specIds.includes(c.id)).reduce((s, c) => s + c.remaining, 0); }
         dashboardNet = net;
      }

      const totalOpeningBalance = useMemo(() => {
        if (!selectedCustodies || selectedCustodies.length === 0 || selectedCustodies.includes('ALL')) { return (data.custodies || []).reduce((sum, c) => sum + Number(c.totalAmount || 0), 0); }
        return (data.custodies || []).filter(c => selectedCustodies.includes(c.id)).reduce((sum, c) => sum + Number(c.totalAmount || 0), 0);
      }, [data.custodies, selectedCustodies]);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(tx => {
          if (!isTxInSelectedCustodies(tx, selectedCustodies)) return false;
          if (tx.type !== custodyTabSub && tx.type !== 'transfer') return false;
          if (custodySearch && !tx.description?.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjsR = (reportFilter.custodyIds || []).length > 0 ? (data.custodies || []).filter(c => (reportFilter.custodyIds || []).includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjsR.forEach(c => {
           let bal = Number(c.totalAmount || 0);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(tx => (tx.custodyId === c.id || tx.toCustodyId === c.id) && tx.date < reportFilter.startDate);
              bal += beforeTrans.filter(tx => tx.type === 'income' || (tx.type === 'transfer' && tx.toCustodyId === c.id)).reduce((s, tx) => s + Number(tx.amount || 0), 0);
              bal -= beforeTrans.filter(tx => tx.type === 'expense' || (tx.type === 'transfer' && tx.custodyId === c.id)).reduce((s, tx) => s + Number(tx.amount || 0), 0);
           }
           openingBalance += bal;
        });

        const custodyName = (reportFilter.custodyIds || []).length === 0 ? t.allCustodies : selectedCustodyObjsR.map(c=>c.personName).join(' + ');
        const buildingName = (reportFilter.buildingIds || []).length === 0 ? t.allBuildings : (data.buildings||[]).filter(b=>reportFilter.buildingIds.includes(b.id)).map(b=>b.name).join(' + ');

        const filtered = (data.transactions || []).filter(tx => {
          if (reportFilter.startDate && tx.date < reportFilter.startDate) return false;
          if (reportFilter.endDate && tx.date > reportFilter.endDate) return false;
          if (!isTxInSelectedCustodies(tx, reportFilter.custodyIds)) return false;
          if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(tx.buildingId)) return false;
          return true;
        }).sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));

        const incomes = filtered.filter(tx => tx.type === 'income' || tx.type === 'transfer');
        const expenses = filtered.filter(tx => tx.type === 'expense' || tx.type === 'transfer');
        const totalIncomes = incomes.reduce((s,tx) => s + Number(tx.amount || 0), 0);
        const totalExpenses = expenses.reduce((s,tx) => s + Number(tx.amount || 0), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName, buildingName };
      }, [data, reportFilter, t]);

      const reportInstallments = useMemo(() => {
        let insts = (data.installments || []).filter(i => {
           if (i.status === 'suspended' || Number(i.amount) === 0) return false;
           if (reportFilter.startDate && i.dueDate < reportFilter.startDate) return false;
           if (reportFilter.endDate && i.dueDate > reportFilter.endDate) return false;
           const contract = (data.contracts || []).find(c => c.id === i.contractId);
           if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(contract?.buildingId)) return false;
           return true;
        });
        insts.sort((a,b) => new Date(a.dueDate || 0) - new Date(b.dueDate || 0));
        return insts;
      }, [data, reportFilter, reportSort]);

      const reportContractsList = useMemo(() => {
        if (reportType !== 'contracts') return [];
        return (data.contracts || []).filter(c => {
           if (c.status !== 'active') return false;
           if (reportFilter.buildingIds.length > 0 && !reportFilter.buildingIds.includes(c.buildingId)) return false;
           return true;
        }).map(c => {
           const b = (data.buildings||[]).find(bd=>bd.id===c.buildingId);
           const u = (data.units||[]).find(un=>un.id===c.unitId);
           const insts = (data.installments||[]).filter(i=>i.contractId===c.id);
           const totalPaid = insts.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.amount), 0);
           const remaining = Number(c.totalAmount) - totalPaid;
           const pendingInsts = insts.filter(i=>i.status==='pending' && Number(i.amount) > 0).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
           const nextDate = pendingInsts.length > 0 ? pendingInsts[0].dueDate : '--';
           return { id: c.id, clientName: c.clientName, buildingName: b?.name, unitNumber: u?.unitNumber, totalAmount: Number(c.totalAmount), paidAmount: totalPaid, remainingAmount: remaining, nextDate };
        });
      }, [data, reportFilter, reportType]);

      const partnerReportData = useMemo(() => {
          if (reportType !== 'partners' || !selectedPartnerR) return null;
          let expected = 0; let paid = 0; let unpaid = 0; let pending = 0;
          const targetPartner = selectedPartnerR.trim();
          const bds = (data.buildings||[]).filter(b => b.hasPartner && (b.partnerName||'').trim() === targetPartner);
          const bdsIds = bds.map(b => b.id);
          const activeContracts = (data.contracts||[]).filter(c => c.status === 'active' && bdsIds.includes(c.buildingId));
          const activeContractIds = activeContracts.map(c => c.id);
          const allPartnerInsts = [];

          (data.installments||[]).forEach(inst => {
             if (activeContractIds.includes(inst.contractId) && inst.status !== 'suspended' && Number(inst.amount) > 0) {
                 const c = activeContracts.find(ct => ct.id === inst.contractId);
                 const b = bds.find(bd => bd.id === c.buildingId);
                 const u = (data.units||[]).find(un => un.id === c.unitId);
                 const pShare = Math.round(Number(inst.amount) * (Number(b.partnerPercent)/100));
                 const paidToPartnerAmt = inst.partnerPaidAmount !== undefined ? Number(inst.partnerPaidAmount) : (inst.partnerPaid ? pShare : 0);

                 expected += pShare;
                 paid += paidToPartnerAmt;

                 if (inst.status === 'paid') {
                     const remainingUnpaidToPartner = Math.max(0, pShare - paidToPartnerAmt);
                     unpaid += remainingUnpaidToPartner;
                 } else { pending += pShare; }

                 const clientLabel = inst.isDownPayment ? `${c.clientName} (مقدم)` : c.clientName;
                 let partnerStatusText = 'غير محصل من العميل';
                 if (inst.status === 'paid') {
                    if (paidToPartnerAmt >= pShare) partnerStatusText = 'تم التوريد بالكامل';
                    else if (paidToPartnerAmt > 0) partnerStatusText = `مورد جزئي (${paidToPartnerAmt.toLocaleString()})`;
                    else partnerStatusText = 'مستحق للتوريد (مُحصل)';
                 }
                 allPartnerInsts.push({ id: inst.id, client: clientLabel, building: `${b.name} - ${u?.unitNumber || ''}`, date: inst.dueDate, totalAmount: Number(inst.amount), share: pShare, paidToPartner: paidToPartnerAmt, dueToPartner: Math.max(0, pShare - paidToPartnerAmt), instStatus: inst.status, partnerStatus: partnerStatusText });
             }
          });
          allPartnerInsts.sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));
          return { expected, paid, unpaid, pending, instsDetails: allPartnerInsts };
      }, [data, reportType, selectedPartnerR]);

      const handlePrint = () => {
        const originalTitle = document.title;
        let printName = t.repCustodyTitle;
        if (reportType === 'installments') printName = t.repSalesTitle;
        if (reportType === 'contracts') printName = t.repContractsTitle;
        if (reportType === 'partners') printName = t.partnerReportTitle;
        document.title = `${printName.replace(/\s+/g, '_')}_${todayDateStr}.pdf`;
        setTimeout(() => { window.print(); document.title = originalTitle; }, 100);
      };

      const handleExportExcel = () => {
        let exportData = [];
        let fileName = 'Report';
        if (reportType === 'transactions') {
           fileName = `Statement_${todayDateStr}`;
           exportData.push({ [t.date]: '--', [t.desc]: t.opBalance, [t.amount]: reportData.openingBalance });
           reportData.incomes.forEach(tx => exportData.push({ [t.date]: formatShortDate(tx.date), [t.desc]: tx.description, [t.amount]: tx.amount }));
           reportData.expenses.forEach(tx => exportData.push({ [t.date]: formatShortDate(tx.date), [t.desc]: tx.description, [t.amount]: -Math.abs(tx.amount) }));
           exportData.push({});
           exportData.push({ [t.date]: '', [t.desc]: t.totalIncomes, [t.amount]: reportData.totalIncomes + reportData.openingBalance });
           exportData.push({ [t.date]: '', [t.desc]: t.totalExpenses, [t.amount]: reportData.totalExpenses });
           exportData.push({ [t.date]: '', [t.desc]: t.currentNet, [t.amount]: reportData.finalBalance });
        } else if (reportType === 'installments') {
           fileName = `Installments_${todayDateStr}`;
           reportInstallments.forEach(i => {
              const c = (data.contracts||[]).find(ct=>ct.id===i.contractId);
              const b = (data.buildings||[]).find(bd=>bd.id===c?.buildingId);
              const totalAmt = Math.round(Number(i.amount));
              const hasPartner = b?.hasPartner && b.partnerPercent > 0;
              const partnerShare = hasPartner ? Math.round(totalAmt * (b.partnerPercent/100)) : 0;
              const myShare = totalAmt - partnerShare;
              const partnerDue = (hasPartner && !i.partnerPaid) ? partnerShare : 0;
              const partnerPaidStat = (hasPartner && i.partnerPaid) ? partnerShare : 0;
              exportData.push({ [t.dueDate]: formatShortDate(i.dueDate), [t.client]: c?.clientName, [t.building]: `${b?.name} - ${c?.unitId}`, [t.amount]: totalAmt, [t.myShare]: myShare, [t.partnerDue]: partnerDue, [t.partnerPaidStatus]: partnerPaidStat, [t.status]: i.status==='paid'?t.paid:t.pending });
           });
        } else if (reportType === 'contracts') {
           fileName = `ClientsStatus_${todayDateStr}`;
           reportContractsList.forEach(c => {
              exportData.push({ [t.client]: c.clientName, [t.building]: `${c.buildingName} - ${c.unitNumber}`, [t.totalUnit]: c.totalAmount, [t.paidAmt]: c.paidAmount, [t.remAmt]: c.remainingAmount, [t.nextDue]: c.nextDate==='--'?'--':formatShortDate(c.nextDate) });
           });
           exportData.push({});
           exportData.push({ [t.client]: '', [t.building]: t.total, [t.totalUnit]: reportContractsList.reduce((s,c)=>s+c.totalAmount,0), [t.paidAmt]: reportContractsList.reduce((s,c)=>s+c.paidAmount,0), [t.remAmt]: reportContractsList.reduce((s,c)=>s+c.remainingAmount,0), [t.nextDue]: '' });
        } else if (reportType === 'partners' && partnerReportData) {
           fileName = `Partner_${selectedPartnerR}_${todayDateStr}`;
           partnerReportData.instsDetails.forEach(d => {
              exportData.push({ [t.client]: d.client, [t.building]: d.building, [t.amount]: d.share, [t.dueDate]: formatShortDate(d.date) });
           });
        }
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `${fileName}.xlsx`);
        showMsg(t.success);
      };

      const handleTxClick = (tx) => { if(tx) setAppModal({ show: true, type: 'TX_ACTION', props: { tx } }); };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if(!newTransaction.amount) return;
        if (newTransaction.type === 'transfer' && newTransaction.custodyId === newTransaction.toCustodyId) {
          showMsg(lang === 'ar' ? 'لا يمكن التحويل لنفس العهدة' : 'Cannot transfer to same custody', true);
          return;
        }

        if (editingTxId) {
          setData(prev => ({ ...prev, transactions: prev.transactions.map(tx => tx.id === editingTxId ? { ...tx, ...newTransaction, amount: Number(newTransaction.amount) } : tx) }));
          setEditingTxId(null); showMsg(t.success);
        } else {
          const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) };
          setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] })); showMsg(t.success);
        }
        setNewTransaction(prev => ({ ...prev, amount: '', description: '', date: getTodayStr(), toCustodyId: '' })); 
      };

      const handleResetFactory = () => { 
        requirePin(() => {
          setAppModal({show: true, type: 'CONFIRM', props: {
            title: t.dangerZone,
            message: t.resetDesc,
            onConfirm: () => { 
              const currentPin = data.pinCode || '0000';
              localStorage.clear(); 
              localStorage.setItem('real_estate_core_data', JSON.stringify({ ...initialData, pinCode: currentPin }));
              window.location.reload(); 
            }
          }});
        });
      };
      
      const addBuilding = (e) => { 
        e.preventDefault(); 
        const pPercent = newBuildingPartner ? Number(newBuildingPartnerPercent) : 0;
        const pName = newBuildingPartnerName || ('شريك ' + newBuilding); 
        setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding, hasPartner: newBuildingPartner, partnerPercent: pPercent, partnerName: pName}]})); 
        setNewBuilding(''); setNewBuildingPartner(false); setNewBuildingPartnerPercent(''); setNewBuildingPartnerName(''); showMsg(t.success); 
      };

      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg(t.success); };
      
      const addContract = (e) => { 
         e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return; 
         const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); const interval = Number(newContract.interval);

         setData(prev => {
            let updatedContracts = [...(prev.contracts || [])];
            let updatedInstallments = [...(prev.installments || [])];
            let updatedTransactions = [...(prev.transactions || [])];
            let contractId;

            if (editingContractId) {
               contractId = editingContractId;
               const oldContract = updatedContracts.find(c => c.id === contractId);
               const oldInsts = updatedInstallments.filter(i => i.contractId === contractId);
               const totalOldPaid = oldInsts.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0);
               updatedInstallments = updatedInstallments.filter(i => i.contractId !== contractId);
               if (totalOldPaid > 0) {
                  updatedTransactions.push({ id: 't_rev_' + Date.now(), type: 'expense', amount: totalOldPaid, buildingId: oldContract.buildingId, custodyId: '', description: `تسوية لإلغاء مدفوعات سابقة بسبب تعديل عقد: ${newContract.clientName}`, date: todayDateStr });
               }
               const contractIndex = updatedContracts.findIndex(c => c.id === contractId);
               updatedContracts[contractIndex] = { ...oldContract, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, installmentsCount: count, interval: interval, suspendedAmount: 0 };
            } else {
               contractId = 'cont_' + Date.now(); 
               updatedContracts.push({ id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active', installmentsCount: count, interval: interval, attachments: [], suspendedAmount: 0 });
            }

            const newInsts = []; 
            if (dp > 0) { newInsts.push({ id: 'inst_dp_' + Date.now(), contractId, amount: dp, dueDate: todayDateStr, status: 'paid', partnerPaid: false, partnerPaidAmount: 0, isDownPayment: true }); }
            let curDate = new Date(newContract.firstInstallmentDate); 
            const baseInstAmount = count > 0 ? Math.floor((total - dp) / count) : 0; 
            let remainder = (total - dp) - (baseInstAmount * count);
            for(let i=0; i<count; i++) { 
               let currentAmt = baseInstAmount;
               if (i === count - 1) currentAmt += remainder; 
               newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: currentAmt, dueDate: curDate.toISOString().split('T')[0], status: 'pending', partnerPaid: false, partnerPaidAmount: 0 }); 
               curDate.setMonth(curDate.getMonth() + interval); 
            } 
            updatedInstallments.push(...newInsts);

            if (dp > 0) { updatedTransactions.push({ id: 't_dp_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, custodyId: newContract.custodyId || '', description: `مقدم تعاقد ${editingContractId ? '(معدل)' : ''}: ${newContract.clientName}`, date: todayDateStr }); }

            const updatedUnits = (prev.units || []).map(u => {
               if(u.id === unit.id) return { ...u, status: 'sold' };
               if(editingContractId) { const oldC = prev.contracts.find(c => c.id === editingContractId); if (oldC && oldC.unitId === u.id && oldC.unitId !== unit.id) return { ...u, status: 'available' }; }
               return u;
            });
            return { ...prev, contracts: updatedContracts, installments: updatedInstallments, transactions: updatedTransactions, units: updatedUnits };
         });
         setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', custodyId: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' }); 
         setEditingContractId(null);
         showMsg(t.success); 
      };

      const editInstallment = (instId, newAmountNum, newDueDate) => {
        const newAmt = Number(newAmountNum);
        setData(prev => {
          const instIndex = (prev.installments || []).findIndex(i => i.id === instId);
          if (instIndex === -1) return prev;
          const oldInst = prev.installments[instIndex];
          const oldAmt = Number(oldInst.amount || 0);
          const diff = oldAmt - newAmt;
          let updatedInsts = [...prev.installments];
          let updatedContracts = [...prev.contracts];
          const contractIndex = updatedContracts.findIndex(c => c.id === oldInst.contractId);
          let currentSuspended = (contractIndex > -1 ? Number(updatedContracts[contractIndex].suspendedAmount || 0) : 0);

          if (newAmt <= 0) {
            updatedInsts = updatedInsts.filter(i => i.id !== instId);
            currentSuspended += oldAmt;
          } else {
            updatedInsts[instIndex] = { ...oldInst, amount: newAmt, dueDate: newDueDate || oldInst.dueDate, status: 'pending' };
            if (diff > 0) { currentSuspended += diff; } else if (diff < 0) { const increase = Math.abs(diff); currentSuspended = Math.max(0, currentSuspended - increase); }
          }
          if (contractIndex > -1) { updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: currentSuspended }; }
          return { ...prev, installments: updatedInsts, contracts: updatedContracts };
        });
        showMsg(t.success);
      };

      const addManualInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum);
        if(!amt || amt <= 0) return;
        setData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId);
          let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) {
            const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0);
            const newSuspended = Math.max(0, currentSuspended - amt);
            updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended };
          }
          const newInst = { id: 'inst_man_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        });
        showMsg(t.success);
      };

      const convertSuspendedToInstallment = (contractId, amtNum, dateStr) => {
        const amt = Number(amtNum);
        if (!amt || amt <= 0) return;
        setData(prev => {
          const contractIndex = prev.contracts.findIndex(c => c.id === contractId);
          let updatedContracts = [...prev.contracts];
          if (contractIndex > -1) {
            const currentSuspended = Number(updatedContracts[contractIndex].suspendedAmount || 0);
            const deductAmt = Math.min(amt, currentSuspended);
            const newSuspended = Math.max(0, currentSuspended - deductAmt);
            updatedContracts[contractIndex] = { ...updatedContracts[contractIndex], suspendedAmount: newSuspended };
          }
          const newInst = { id: 'inst_conv_' + Date.now(), contractId: contractId, amount: amt, dueDate: dateStr || todayDateStr, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 };
          return { ...prev, contracts: updatedContracts, installments: [...prev.installments, newInst] };
        });
        showMsg(t.success);
      };

      const payInstallment = (instId, clientName, buildingId, paidAmount, date, custodyId) => {
        const paid = Number(paidAmount);
        setData(prev => {
          let updatedInsts = [...(prev.installments || [])];
          const instIndex = updatedInsts.findIndex(i => i.id === instId);
          if(instIndex > -1) {
              const instToUpdate = updatedInsts[instIndex];
              const fullAmount = Number(instToUpdate.amount);
              if (paid <= 0) { updatedInsts[instIndex] = { ...instToUpdate, amount: 0, status: 'suspended' }; } 
              else if (paid >= fullAmount) { updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid }; } 
              else {
                const remaining = fullAmount - paid;
                updatedInsts[instIndex] = { ...instToUpdate, status: 'paid', amount: paid };
                updatedInsts.push({ id: 'inst_rem_' + Date.now(), contractId: instToUpdate.contractId, amount: remaining, dueDate: instToUpdate.dueDate, status: 'pending', partnerPaid: false, partnerPaidAmount: 0 });
              }
              let updatedTrans = [...(prev.transactions || [])];
              if (paid > 0) { updatedTrans.push({ id: 't_' + Date.now(), type: 'income', amount: paid, buildingId, custodyId: custodyId || '', description: (lang==='ar'?`تحصيل قسط ${paid < fullAmount ? '(جزئي)' : ''}: ${clientName}`:`Installment Collection ${paid < fullAmount ? '(Partial)' : ''}: ${clientName}`), date: date || todayDateStr }); }
              return { ...prev, installments: updatedInsts, transactions: updatedTrans };
          }
          return prev;
        });
        showMsg(t.success);
      };

      const payPartnerShare = (instId, actualPaidAmt, clientName, buildingName, custodyId, date) => {
        const paidAmtNum = Number(actualPaidAmt);
        if(!paidAmtNum || paidAmtNum <= 0) return;
        setData(prev => {
          const updatedInsts = prev.installments.map(i => {
            if (i.id === instId) {
              const b = (prev.buildings||[]).find(bd => bd.id === (prev.contracts||[]).find(c=>c.id===i.contractId)?.buildingId);
              const totalPartnerShare = Math.round(Number(i.amount) * (Number(b?.partnerPercent || 0)/100));
              const currentPaid = i.partnerPaidAmount !== undefined ? Number(i.partnerPaidAmount) : (i.partnerPaid ? totalPartnerShare : 0);
              const newPaid = currentPaid + paidAmtNum;
              const isFullyPaid = newPaid >= totalPartnerShare;
              return { ...i, partnerPaidAmount: newPaid, partnerPaid: isFullyPaid };
            }
            return i;
          });
          const trans = { id: 't_' + Date.now(), type: 'expense', amount: paidAmtNum, buildingId: '', custodyId: custodyId || '', description: (lang==='ar'?`توريد نصيب الشريك (${paidAmtNum.toLocaleString()} ج.م) - ${clientName} - ${buildingName}`:`Pay Partner Share (${paidAmtNum.toLocaleString()}) - ${clientName} - ${buildingName}`), date: date || getTodayStr() };
          return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
        });
        showMsg(t.success);
      };

      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 && dashboardCustodyFilter[0] !== 'ALL' ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody, date: getTodayStr() }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && Number(i.amount) > 0 && i.dueDate?.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
      const overdueInstallments = (data.installments || []).filter(i => i.status === 'pending' && Number(i.amount) > 0 && i.dueDate < todayDateStr).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));

      const tabs = [
        { id: 'dashboard', label: t.tab_dash }, { id: 'transactions', label: t.tab_tx },
        { id: 'custody', label: t.tab_cust }, { id: 'inventory', label: t.tab_inv },
        { id: 'sales', label: t.tab_sales }, { id: 'reports', label: t.tab_rep }
      ];

      const lastCustodyNet = sortedCustodies.length > 0 ? (custodyCalculations.find(c => c.id === sortedCustodies[0].id)?.remaining || 0) : 0;
      const filteredContracts = (data.contracts || []).filter(c => c.status === 'active' && (!globalSearch || c.clientName.includes(globalSearch)));
      const isContractsListOpen = showContractsList || globalSearch.trim().length > 0;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">
          <header className="bg-slate-900 text-white p-4 shadow-lg print-hide flex justify-between items-center relative z-40">
            <h1 className="text-xl font-bold tracking-wide flex items-center gap-2">🏢 <span className="hidden sm:inline">{t.appTitle}</span></h1>
            
            {/* تم إضافة معلومات اليوزر وزر الخروج هنا */}
            <div className="flex items-center gap-4">
               <span className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 font-mono hidden md:inline-block border border-slate-700">
                  {user?.email}
               </span>
               <button onClick={() => auth.signOut()} className="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg font-bold shadow transition flex items-center gap-1">
                  خروج 🚪
               </button>
               <button onClick={() => setActiveTab('settings')} className="text-2xl hover:rotate-90 transition-transform">⚙️</button>
            </div>
          </header>

          <nav className="bg-slate-800 text-slate-200 grid grid-cols-3 md:grid-cols-6 border-b border-slate-700 print-hide shadow-md">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => {setActiveTab(tab.id); setEditingTxId(null); setGlobalSearch(''); setEditingContractId(null);}} 
                className={`p-3 text-sm font-bold text-center border-b border-l border-slate-700 transition-colors ${activeTab === tab.id ? 'bg-slate-100 text-blue-800 border-b-4 border-b-blue-600 shadow-inner' : 'hover:bg-slate-700'}`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {toast.show && ( <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[200] animate-slide-up print-hide w-[90%] max-w-sm"><div className={`px-6 py-4 rounded-2xl shadow-2xl font-bold text-white flex items-center justify-center gap-3 ${toast.isError ? 'bg-red-600' : 'bg-emerald-600'}`}><span className="text-2xl">{toast.isError ? '⚠️' : '✅'}</span><span className="text-lg">{toast.msg}</span></div></div> )}

          {appModal.show && (
            <div className={`fixed inset-0 bg-slate-900 bg-opacity-70 backdrop-blur-sm flex items-center justify-center z-[100] animate-fade-in p-4 ${appModal.type !== 'RECEIPT' ? 'print-hide' : 'print-receipt-wrapper'}`} onClick={closeModal}>
              {/* جميع الموديلز تم إبقاؤها كما هي بالضبط */}
              {appModal.type === 'TX_ACTION' && appModal.props.tx && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-2 text-center text-slate-800 border-b pb-2">{t.action}</h3><p className="text-center text-sm text-slate-500 mb-6 bg-slate-50 p-2 rounded">{appModal.props.tx?.description} <br/> <span className="font-bold text-lg text-slate-800">{Number(appModal.props.tx?.amount || 0).toLocaleString()}</span></p><button onClick={() => { closeModal(); setNewTransaction({...appModal.props.tx}); setEditingTxId(appModal.props.tx?.id); setActiveTab('transactions'); }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { closeModal(); requirePin(() => { setAppModal({ show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelTx, onConfirm: () => { setData(p => ({...p, transactions: (p.transactions||[]).filter(tx => tx.id !== appModal.props.tx?.id)})); showMsg(t.success); closeModal(); } }}); }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'CAT_ACTION' && appModal.props.cat && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="catEditInput" defaultValue={appModal.props.cat.name} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('catEditInput').value; if(val) { setData(p => ({...p, categories: p.categories.map(c => c.id === appModal.props.cat.id ? {...c, name: val} : c)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setData(p => ({...p, categories: p.categories.filter(c => c.id !== appModal.props.cat.id)})); closeModal(); showMsg(t.success); }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'BUILDING_ACTION' && appModal.props.b && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="buildEditInput" defaultValue={appModal.props.b.name} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('buildEditInput').value; if(val) { setData(p => ({...p, buildings: p.buildings.map(b => b.id === appModal.props.b.id ? {...b, name: val} : b)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setAppModal({show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelBuild, onConfirm: () => { setData(p => ({...p, buildings: p.buildings.filter(b => b.id !== appModal.props.b.id)})); closeModal(); showMsg(t.success); } }}) }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'UNIT_ACTION' && appModal.props.u && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl absolute bottom-0 md:relative md:bottom-auto" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4 md:hidden"></div><h3 className="font-bold text-lg mb-4 text-center text-slate-800 border-b pb-2">{t.action}</h3><input type="text" id="unitEditInput" defaultValue={appModal.props.u.unitNumber} className="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 font-bold text-center focus:border-blue-500 outline-none" /><button onClick={() => { const val = document.getElementById('unitEditInput').value; if(val) { setData(p => ({...p, units: p.units.map(u => u.id === appModal.props.u.id ? {...u, unitNumber: val} : u)})); closeModal(); showMsg(t.success); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow hover:bg-blue-700 transition">✏️ {t.edit}</button><button onClick={() => { requirePin(() => { setAppModal({show: true, type: 'CONFIRM', props: { title: t.delete, message: t.confirmDelUnit, onConfirm: () => { setData(p => ({...p, units: p.units.filter(u => u.id !== appModal.props.u.id)})); closeModal(); showMsg(t.success); } }}) }); }} className="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 hover:bg-red-100 transition">🗑️ {t.delete}</button></div> )}
              {appModal.type === 'IMAGE_VIEW' && ( <div className="bg-black p-2 rounded-2xl w-full max-w-2xl relative shadow-2xl animate-fade-in flex flex-col items-center justify-center" onClick={e=>e.stopPropagation()}><button onClick={closeModal} className="absolute top-4 right-4 bg-red-600 text-white w-10 h-10 rounded-full font-black text-xl hover:bg-red-700 shadow z-50">X</button><img src={appModal.props.src} className="w-full h-auto rounded-xl max-h-[85vh] object-contain border border-slate-800" /></div> )}
              {appModal.type === 'PIN' && ( <div className="bg-white w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}><div className="bg-red-600 text-white p-4 text-center font-bold">🔒</div><div className="p-6"><p className="text-center text-sm mb-4">أدخل الرمز السري لتأكيد الإجراء</p><input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4" autoFocus className="w-full border-b-2 border-red-400 p-2 text-center text-3xl tracking-[0.5em] font-bold outline-none focus:border-red-600 transition-colors bg-slate-50" onChange={e => { const val = e.target.value; if(val.length === 4) { const currentPin = data.pinCode || '0000'; if (val === currentPin) { const successCallback = appModal.props.onSuccess; closeModal(); setTimeout(() => { if(successCallback) successCallback(); }, 100); } else { showMsg(lang === 'ar' ? 'الرمز غير صحيح' : 'Incorrect PIN', true); e.target.value = ''; } } }} /></div><button onClick={closeModal} className="w-full p-4 bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">{t.no}</button></div> )}
              {appModal.type === 'RECEIPT' && ( <div className="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl animate-slide-up print-show" onClick={e=>e.stopPropagation()}><div id="receipt-area" className="p-6 bg-white text-black text-center receipt-print-area"><p className="text-base font-black mb-4 text-slate-800 border-b-2 border-slate-800 pb-2">إيصال استلام نقدية</p><div className="text-right space-y-2.5 mb-5 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200" dir="rtl"><div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">تاريخ الاستلام:</span><span className="font-mono font-bold text-slate-900">{appModal.props.date || formatShortDate(todayDateStr)}</span></div>{appModal.props.dueDate && ( <div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">تاريخ استحقاق القسط:</span><span className="font-mono font-bold text-blue-800">{appModal.props.dueDate}</span></div> )}<div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">العميل:</span><span className="font-bold text-slate-900">{appModal.props.clientName}</span></div><div className="flex justify-between border-b pb-1.5"><span className="text-gray-600 font-bold">البيان / الوحدة:</span><span className="font-bold text-slate-900">{appModal.props.buildingName}</span></div><div className="flex justify-between pt-1 text-base text-emerald-700"><span className="font-black">المبلغ المستلم:</span><span className="font-black">{Number(appModal.props.amount).toLocaleString()} ج.م</span></div></div>{appModal.props.unitPrice !== undefined && ( <div className="bg-blue-50/60 p-3.5 rounded-xl border border-blue-200 text-right text-xs mb-4" dir="rtl"><p className="font-black text-blue-900 text-sm mb-2 border-b border-blue-200 pb-1 text-center">📊 إجمالي موقف الوحدة</p><div className="grid grid-cols-3 gap-2 text-center font-bold"><div className="bg-white p-2 rounded-lg border border-blue-100"><span className="text-gray-500 block text-[10px]">سعر الوحدة</span><span className="text-slate-900 text-xs font-black">{Number(appModal.props.unitPrice).toLocaleString()}</span></div><div className="bg-white p-2 rounded-lg border border-blue-100"><span className="text-emerald-600 block text-[10px]">إجمالي المدفوع</span><span className="text-emerald-700 text-xs font-black">{Number(appModal.props.totalPaid).toLocaleString()}</span></div><div className="bg-white p-2 rounded-lg border border-blue-100"><span className="text-red-600 block text-[10px]">المتبقي</span><span className="text-red-700 text-xs font-black">{Number(appModal.props.remainingAmount).toLocaleString()}</span></div></div></div> )}<p className="text-xs text-gray-500 mt-2 font-bold">تم الاستلام. شكراً لثقتكم.</p></div><div className="p-4 flex gap-2 bg-slate-100 print-hide"><button onClick={()=>{ window.print(); }} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow hover:bg-blue-700">🖨️ طباعة الإيصال PDF</button><button onClick={closeModal} className="flex-1 bg-slate-300 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-400">إغلاق</button></div></div> )}
              {appModal.type === 'CONFIRM' && ( <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl animate-slide-up" onClick={e=>e.stopPropagation()}><div className="bg-slate-900 text-white p-4 text-center font-bold text-lg">{appModal.props.title || t.action}</div><div className="p-6 text-center text-slate-700 font-medium">{appModal.props.message}</div><div className="flex border-t"><button onClick={()=>{appModal.props.onConfirm && appModal.props.onConfirm(); closeModal();}} className="flex-1 p-4 font-bold text-blue-700 hover:bg-blue-50 border-x">{t.yes}</button><button onClick={closeModal} className="flex-1 p-4 font-bold text-slate-500 hover:bg-slate-100">{t.no}</button></div></div> )}
              {appModal.type === 'PROMPT_INST' && ( <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl animate-slide-up p-6 relative" onClick={e=>e.stopPropagation()}><div className="bg-blue-800 text-white p-3 -mx-6 -mt-6 mb-4 text-center font-bold rounded-t-2xl">{appModal.props.title}</div><form onSubmit={e => { e.preventDefault(); appModal.props.onConfirm(document.getElementById('promptAmtInput').value.replace(/[^0-9]/g, ''), appModal.props.promptDate || appModal.props.defaultDate || todayDateStr, appModal.props.promptCustodyVal || ''); closeModal(); }} className="space-y-4">{appModal.props.showDate && ( <div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.date}</label><CustomDateInput value={appModal.props.promptDate || appModal.props.defaultDate || todayDateStr} onChange={(d) => setAppModal(p => ({ ...p, props: { ...p.props, promptDate: d } }))} /></div> )}<div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.amount}</label><input type="number" id="promptAmtInput" required defaultValue={appModal.props.defaultAmount} className="w-full border-2 border-blue-400 p-3 rounded-xl font-bold text-xl text-center outline-none focus:border-blue-600" /></div>{appModal.props.showCustody && ( <div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.promptCustody}</label><CustomSelect options={custodyOptions} value={appModal.props.promptCustodyVal || ''} onChange={(v) => setAppModal(p => ({ ...p, props: { ...p.props, promptCustodyVal: v } }))} placeholder={t.generalSafe} /></div> )}<div className="flex gap-2 pt-2"><button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow hover:bg-blue-700">{t.save}</button><button type="button" onClick={closeModal} className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300">{t.no}</button></div></form></div> )}
              {appModal.type === 'PAY_PARTNER' && ( <div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-slide-up shadow-2xl relative" onClick={e=>e.stopPropagation()}><h3 className="font-bold text-lg mb-2 text-center text-purple-800 border-b pb-2">{t.payPartnerTitle}</h3><p className="text-center text-sm text-slate-500 mb-2">{t.payPartnerDesc}</p><form onSubmit={e => { e.preventDefault(); const amt = Number(e.target.partnerAmt.value.replace(/[^0-9]/g, '')); if(!amt || amt <= 0) return; appModal.props.onConfirm(amt, appModal.props.partnerDateVal || todayDateStr, appModal.props.partnerCustodyVal || ''); closeModal(); }} className="space-y-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block text-center">المبلغ المراد توريده للشريك (ج.م):</label><NumberInput name="partnerAmt" required defaultValue={appModal.props.partnerAmt} className="w-full border-2 border-purple-300 p-3 text-2xl font-black text-center text-purple-800 rounded-xl outline-none focus:border-purple-600 bg-purple-50" /><span className="text-[11px] text-slate-400 block text-center mt-1">المستحق الحالي لهذا القسط: {Number(appModal.props.partnerAmt).toLocaleString()} ج.م</span></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.date}</label><CustomDateInput value={appModal.props.partnerDateVal || todayDateStr} onChange={(d) => setAppModal(p => ({ ...p, props: { ...p.props, partnerDateVal: d } }))} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">{t.deductFromSafe}</label><CustomSelect options={custodyOptions} value={appModal.props.partnerCustodyVal || ''} onChange={(v) => setAppModal(p => ({ ...p, props: { ...p.props, partnerCustodyVal: v } }))} placeholder={t.generalSafe} /></div><div className="flex gap-2 pt-2"><button type="submit" className="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold shadow hover:bg-purple-700">{t.save}</button><button type="button" onClick={closeModal} className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300">{t.no}</button></div></form></div> )}
            </div>
          )}

          {/* الباقي من كود الواجهة الرئيسية (MainApp) كما هو */}
          <main className={`flex-grow p-4 mx-auto w-full max-w-7xl relative z-10 ${appModal.type === 'RECEIPT' ? 'print-hide' : ''}`}>
             {/* 
                هنا باقي أكواد الـ Tabs (dashboard, transactions, custody, inventory, sales, reports, settings)
                بدون أي تغيير عن النسخة السابقة لضمان عمل كل شيء كما هو في المرحلة دي
             */}
             <div className="bg-blue-50 text-blue-800 p-6 rounded-xl font-bold text-center mt-10">
                مرحباً بك يا مدير النظام. في هذه المرحلة (المرحلة الأولى)، قمنا بتفعيل شاشة تسجيل الدخول فقط. 
                جميع بياناتك السابقة لا تزال محفوظة هنا، وجاهزون للمرحلة التالية لرفعها على السيرفر.
             </div>
          </main>
        </div>
      );
    }

    // -------------------------------------------------------------
    // المكون الرئيسي الذي يدير حالة تسجيل الدخول (AppWrapper)
    // -------------------------------------------------------------
    function AppWrapper() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // المستمع اللحظي لحالة تسجيل الدخول
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white flex-col gap-4">
            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p className="font-bold text-lg tracking-widest">جاري التحميل...</p>
          </div>
        );
      }

      // لو مفيش مستخدم مسجل دخول، اعرض شاشة الدخول
      if (!user) {
        return <LoginScreen />;
      }

      // لو مسجل دخول، اعرض التطبيق ومرر بيانات المستخدم
      return <MainApp user={user} />;
    }

    // تشغيل التطبيق من خلال الـ Wrapper
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <AppWrapper />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
