<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RealStateApp</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; font-weight: bold !important; font-size: 1.1rem !important; }
      .print-hide { display: none !important; }
      .print-show { display: block !important; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      th, td { border: 2px solid black !important; padding: 4px 8px !important; }
      .print-row-text { font-size: 0.95rem !important; }
      .print-header { font-size: 1.2rem !important; }
    }
    @keyframes slideUp { from { transform: translateY(10%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body className="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const getTodayStr = () => new Date().toISOString().substring(0, 10);
    const todayDateStr = getTodayStr();

    const dict = {
      ar: {
        appTitle: "RealStateApp",
        tab_dash: "الرئيسية", tab_tx: "إيراد/مصروف", tab_cust: "العهد", tab_inv: "الوحدات", tab_sales: "المبيعات", tab_rep: "التقارير",
        income: "إيراد", expense: "مصروف", addIncome: "➕ إضافة إيراد", addExpense: "➖ تسجيل مصروف",
        date: "التاريخ", amount: "المبلغ (ج.م)", desc: "البيان (التفاصيل)",
        custody: "العهدة / الخزينة", building: "العمارة", unit: "الوحدة", category: "تصنيف المصروف",
        save: "حفظ في السجل", update: "تحديث البيانات", cancel: "إلغاء", edit: "تعديل", delete: "حذف",
        allCustodies: "-- الخزينة العامة --", allBuildings: "-- عام --", selectCat: "-- اختر التصنيف --",
        monthDues: "مستحق هذا الشهر", activeCustody: "الاستعلام السريع عن العهد", net: "الصافي",
        addCat: "إضافة تصنيف مصروفات", newCustody: "تسليم عهدة لمسؤول جديد", settings: "الإعدادات والأمان",
        backup: "النسخ الاحتياطي للأمان", reset: "إعادة ضبط المصنع",
        lang: "لغة البرنامج / Language", yes: "نعم متأكد", no: "إلغاء", txTitle: "تسجيل حركة نقدية",
        showDetails: "التفاصيل ▼", hideDetails: "إخفاء ▲", opBalance: "رصيد أول المدة"
      },
      en: {
        appTitle: "RealStateApp",
        tab_dash: "Dashboard", tab_tx: "In/Out", tab_cust: "Safes", tab_inv: "Units", tab_sales: "Sales", tab_rep: "Reports",
        income: "Income", expense: "Expense", addIncome: "➕ Add Income", addExpense: "➖ Add Expense",
        date: "Date", amount: "Amount", desc: "Description",
        custody: "Safe / Custody", building: "Building", unit: "Unit", category: "Category",
        save: "Save", update: "Update", cancel: "Cancel", edit: "Edit", delete: "Delete",
        allCustodies: "-- Main Safe --", allBuildings: "-- General --", selectCat: "-- Select Category --",
        monthDues: "Due This Month", activeCustody: "Safes Balances", net: "Net",
        addCat: "Add Expense Category", newCustody: "Add New Safe", settings: "Settings & Security",
        backup: "Backup & Restore", reset: "Factory Reset",
        lang: "Language / لغة البرنامج", yes: "Yes", no: "Cancel", txTitle: "Record Transaction",
        showDetails: "Details ▼", hideDetails: "Hide ▲", opBalance: "Opening Balance"
      }
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 m-4 bg-red-50 border-2 border-red-500 rounded-2xl text-red-900 shadow-xl">
              <h2 className="text-2xl font-black mb-3">⚠️ حدث خطأ في النظام</h2>
              <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full bg-red-600 text-white py-4 rounded-xl font-black">🔄 مسح التعارض وإعادة تشغيل التطبيق</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function NumberInput({ name, value, onChange, placeholder, className, required }) {
      const displayVal = (value !== '' && value !== undefined && value !== null && !isNaN(value)) ? Number(value).toLocaleString('en-US') : '';
      return ( <input type="text" name={name} inputMode="numeric" value={displayVal} placeholder={placeholder} required={required} className={className} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ''); onChange(raw); }} /> );
    }

    function MultiSelectDropdown({ options, selected, onChange, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);
      useEffect(() => {
        const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);
      
      const selectedLabels = (selected || []).map(id => options.find(o => o.id === id)?.label).filter(Boolean);
      const displayTxt = selectedLabels.length === 0 ? placeholder : (selectedLabels.length <= 2 ? selectedLabels.join(' + ') : `محدد (${selectedLabels.length})`);

      return (
        <div className="relative z-20 w-full" ref={dropdownRef}>
          <div className="w-full border-2 border-slate-200 p-3 text-sm rounded-xl bg-white cursor-pointer font-bold flex justify-between items-center shadow-sm hover:border-blue-400 transition" onClick={() => setIsOpen(!isOpen)}>
            <span className="truncate">{displayTxt}</span><span className="text-xs text-blue-600">▼</span>
          </div>
          {isOpen && (
            <div className="absolute top-full right-0 w-full bg-white border-2 border-slate-200 mt-1 shadow-2xl max-h-48 overflow-y-auto z-50 p-2 space-y-2 rounded-xl animate-fade-in">
              <label className="flex items-center gap-2 cursor-pointer font-bold border-b pb-2 text-slate-700 hover:bg-slate-50 p-1 rounded"><input type="checkbox" checked={(selected || []).length===0} onChange={()=>onChange([])} className="w-4 h-4 text-blue-600"/> الكل / غير محدد</label>
              {(options || []).map(opt => (
                <label key={opt.id} className="flex items-center gap-2 cursor-pointer whitespace-nowrap text-sm hover:bg-slate-50 p-1 rounded transition">
                  <input type="checkbox" checked={(selected || []).includes(opt.id)} className="w-4 h-4 text-blue-600" onChange={(e)=>{ const newIds = e.target.checked ? [...(selected || []), opt.id] : (selected || []).filter(id=>id!==opt.id); onChange(newIds); }}/> {opt.label}
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

    const initialData = { pinCode: '0000', buildings: [], units: [], categories: [], contracts: [], installments: [], custodies: [], transactions: [] };

    function MainApp() {
      const [lang, setLang] = useState(() => localStorage.getItem('real_estate_lang') || 'ar');
      const t = dict[lang];

      useEffect(() => {
        localStorage.setItem('real_estate_lang', lang);
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('real_estate_core_data');
        if (saved) { try { const parsed = JSON.parse(saved); return { ...initialData, ...parsed }; } catch (e) { return initialData; } }
        return initialData;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState({ show: false, msg: '', isError: false });
      const [appModal, setAppModal] = useState({ show: false, type: '', props: {} });
      const [editingTxId, setEditingTxId] = useState(null);

      const [newBuilding, setNewBuilding] = useState('');
      const [newUnit, setNewUnit] = useState({ buildingId: '', unitNumber: '', price: '' });
      const [newCategory, setNewCategory] = useState('');
      const [newCustody, setNewCustody] = useState({ personName: '', totalAmount: '', notes: '' });
      
      const [newTransaction, setNewTransaction] = useState({ type: 'income', amount: '', categoryId: '', buildingId: '', custodyId: '', description: '', date: todayDateStr });
      const [newContract, setNewContract] = useState({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' });
      
      const [reportType, setReportType] = useState('transactions'); 
      const [reportFilter, setReportFilter] = useState({ startDate: '', endDate: '', custodyIds: [], buildingIds: [] });
      const [dashboardCustodyFilter, setDashboardCustodyFilter] = useState(() => { try { const s=localStorage.getItem('real_estate_last_custody'); if(!s) return []; const p = JSON.parse(s); return Array.isArray(p) ? p : [p].filter(Boolean); }catch(e){return [];} });
      
      const [selectedCustodies, setSelectedCustodies] = useState([]);
      const [custodyTabSub, setCustodyTabSub] = useState('income');
      const [custodySearch, setCustodySearch] = useState('');
      const [descFocus, setDescFocus] = useState(false);
      const [showMonthDetails, setShowMonthDetails] = useState(false);
      const [expandedBuildings, setExpandedBuildings] = useState({});
      const [custodyNameFocus, setCustodyNameFocus] = useState(false);
      const [showOverdue, setShowOverdue] = useState(false);

      useEffect(() => { localStorage.setItem('real_estate_core_data', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('real_estate_last_custody', JSON.stringify(dashboardCustodyFilter)); }, [dashboardCustodyFilter]);

      const isExiting = useRef(false);
      useEffect(() => {
        window.history.pushState(null, '', window.location.href);
        const handlePopState = () => {
          if (isExiting.current) return;
          setAppModal({ show: true, type: 'CONFIRM', props: { 
            title: lang==='ar'?'تأكيد الخروج':'Exit', message: lang==='ar'?'هل تريد الخروج من البرنامج؟':'Do you want to exit?', 
            onConfirm: () => { isExiting.current = true; window.history.go(-2); } 
          }});
          window.history.pushState(null, '', window.location.href);
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [lang]);

      const showMsg = (msg, isError = false) => { setToast({ show: true, msg, isError }); setTimeout(() => setToast(p => ({ ...p, show: false })), 3500); };
      const closeModal = () => setAppModal({ show: false, type: '', props: {} });
      const requirePin = (onSuccess) => setAppModal({ show: true, type: 'PIN', props: { onSuccess } });
      const formatShortDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].substring(2)}` : d; };

      const allDescriptions = useMemo(() => {
        const descs = [];
        for (let i = (data.transactions || []).length - 1; i >= 0; i--) { const d = data.transactions[i]?.description; if (d && !descs.includes(d)) descs.push(d); }
        return descs;
      }, [data.transactions]);
      const filteredDescs = newTransaction.description ? allDescriptions.filter(d => d.includes(newTransaction.description) && d !== newTransaction.description) : [];

      const uniqueCustodyNames = useMemo(() => [...new Set((data.custodies||[]).map(c=>c.personName))], [data.custodies]);
      const filteredCustodyNames = newCustody.personName ? uniqueCustodyNames.filter(n => n.includes(newCustody.personName) && n !== newCustody.personName) : [];

      const custodyCalculations = useMemo(() => {
        return (data.custodies || []).map(c => {
          const expenses = (data.transactions || []).filter(tx => tx.type === 'expense' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          const incomes = (data.transactions || []).filter(tx => tx.type === 'income' && tx.custodyId === c.id).reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
          return { ...c, used: expenses, incomes, remaining: Number(c.totalAmount || 0) + incomes - expenses };
        });
      }, [data]);

      let dashboardNet = 0;
      if (dashboardCustodyFilter.length === 0) {
         const inc = (data.transactions||[]).filter(t=>t.type==='income' && !t.custodyId).reduce((s,t)=>s+Number(t.amount||0),0);
         const exp = (data.transactions||[]).filter(t=>t.type==='expense' && !t.custodyId).reduce((s,t)=>s+Number(t.amount||0),0);
         dashboardNet = inc - exp;
      } else if (dashboardCustodyFilter.includes('ALL')) {
         const inc = (data.transactions||[]).filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
         const exp = (data.transactions||[]).filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
         const initCust = (data.custodies||[]).reduce((s,c)=>s+Number(c.totalAmount||0),0);
         dashboardNet = initCust + inc - exp;
      } else {
         dashboardNet = custodyCalculations.filter(c => dashboardCustodyFilter.includes(c.id)).reduce((s, c) => s + c.remaining, 0);
      }

      const selectedCustodiesObjs = selectedCustodies.length > 0 ? (data.custodies || []).filter(c => selectedCustodies.includes(c.id)) : (data.custodies || []);
      const totalOpeningBalance = selectedCustodiesObjs.reduce((sum, c) => sum + Number(c.totalAmount || 0), 0);

      const filteredCustodyTrans = useMemo(() => {
        return (data.transactions || []).filter(t => {
          if ((selectedCustodies || []).length > 0 && !(selectedCustodies || []).includes(t.custodyId)) return false;
          if (t.type !== custodyTabSub) return false;
          if (custodySearch && !t.description?.includes(custodySearch)) return false;
          return true;
        }).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
      }, [data, selectedCustodies, custodyTabSub, custodySearch]);

      const reportData = useMemo(() => {
        let openingBalance = 0;
        let selectedCustodyObjsR = (reportFilter.custodyIds || []).length > 0 ? (data.custodies || []).filter(c => (reportFilter.custodyIds || []).includes(c.id)) : (data.custodies || []);
        
        selectedCustodyObjsR.forEach(c => {
           let bal = Number(c.totalAmount || 0);
           if (reportFilter.startDate) {
              const beforeTrans = (data.transactions || []).filter(t => t.custodyId === c.id && t.date < reportFilter.startDate);
              bal += beforeTrans.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
              bal -= beforeTrans.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
           }
           openingBalance += bal;
        });

        const custodyName = (reportFilter.custodyIds || []).length === 0 ? (lang==='ar'?'كل العهد / الخزينة العامة':'General Safe') : selectedCustodyObjsR.map(c=>c.personName).join(' + ');
        const buildingName = (reportFilter.buildingIds || []).length === 0 ? (lang==='ar'?'كل العمارات والوحدات':'All Buildings') : (data.buildings||[]).filter(b=>reportFilter.buildingIds.includes(b.id)).map(b=>b.name).join(' + ');

        const filtered = (data.transactions || []).filter(t => {
          if (reportFilter.startDate && t.date < reportFilter.startDate) return false;
          if (reportFilter.endDate && t.date > reportFilter.endDate) return false;
          if ((reportFilter.custodyIds || []).length > 0 && !(reportFilter.custodyIds || []).includes(t.custodyId)) return false;
          if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(t.buildingId)) return false;
          return true;
        }).sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));

        const incomes = filtered.filter(t => t.type === 'income');
        const expenses = filtered.filter(t => t.type === 'expense');
        const totalIncomes = incomes.reduce((s,t) => s + Number(t.amount || 0), 0);
        const totalExpenses = expenses.reduce((s,t) => s + Number(t.amount || 0), 0);
        
        return { openingBalance, incomes, expenses, totalIncomes, totalExpenses, finalBalance: openingBalance + totalIncomes - totalExpenses, custodyName, buildingName };
      }, [data, reportFilter, lang]);

      const reportInstallments = useMemo(() => {
        return (data.installments || []).filter(i => {
           if (reportFilter.startDate && i.dueDate < reportFilter.startDate) return false;
           if (reportFilter.endDate && i.dueDate > reportFilter.endDate) return false;
           const contract = (data.contracts || []).find(c => c.id === i.contractId);
           if ((reportFilter.buildingIds || []).length > 0 && !(reportFilter.buildingIds || []).includes(contract?.buildingId)) return false;
           return true;
        }).sort((a,b) => new Date(a.dueDate || 0) - new Date(b.dueDate || 0));
      }, [data, reportFilter]);

      const handlePrint = () => {
        const originalTitle = document.title;
        const printName = reportType === 'transactions' ? reportData.custodyName : 'تقرير_الاقساط';
        document.title = `${printName.replace(/\s+/g, '_')}_${todayDateStr}.pdf`;
        setTimeout(() => { window.print(); document.title = originalTitle; }, 100);
      };

      const handleTxClick = (tx) => { if(tx) setAppModal({ show: true, type: 'TX_ACTION', props: { tx } }); };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if(!newTransaction.amount) return;
        if (editingTxId) {
          setData(prev => ({ ...prev, transactions: prev.transactions.map(tx => tx.id === editingTxId ? { ...tx, ...newTransaction, amount: Number(newTransaction.amount) } : tx) }));
          setEditingTxId(null); showMsg(lang==='ar'?'تم التحديث':'Updated');
        } else {
          const item = { id: 't_' + Date.now(), ...newTransaction, amount: Number(newTransaction.amount) };
          setData(prev => ({ ...prev, transactions: [...(prev.transactions || []), item] })); showMsg(lang==='ar'?'تم الحفظ':'Saved');
        }
        setNewTransaction(prev => ({ ...prev, amount: '', description: '', date: getTodayStr() })); 
      };

      const handleResetFactory = () => { 
        requirePin(() => {
          setAppModal({show: true, type: 'CONFIRM', props: {
            title: lang==='ar'?'إعادة ضبط المصنع':'Factory Reset',
            message: lang==='ar'?'سيتم مسح كافة البيانات نهائياً. هل أنت متأكد؟':'All data will be permanently deleted. Are you sure?',
            onConfirm: () => { localStorage.clear(); window.location.reload(); }
          }});
        });
      };
      
      const addBuilding = (e) => { e.preventDefault(); setData(p=>({...p, buildings: [...(p.buildings||[]), {id: 'b_'+Date.now(), name: newBuilding}]})); setNewBuilding(''); showMsg(lang==='ar'?'تمت الإضافة':'Added'); };
      const addUnit = (e) => { e.preventDefault(); setData(p => ({ ...p, units: [...(p.units || []), { id: 'u_' + Date.now(), ...newUnit, status: 'available' }] })); setNewUnit({ buildingId: '', unitNumber: '', price: '' }); showMsg(lang==='ar'?'تمت الإضافة':'Added'); };
      
      const addContract = (e) => { 
        e.preventDefault(); const unit = (data.units || []).find(u => u.id === newContract.unitId); if (!unit) return showMsg('اختر الوحدة أولاً', true); 
        const contractId = 'cont_' + Date.now(); const dp = Number(newContract.downPayment); const total = Number(newContract.totalAmount); const count = Number(newContract.installmentsCount); 
        const contract = { id: contractId, clientName: newContract.clientName, unitId: unit.id, buildingId: unit.buildingId, totalAmount: total, downPayment: dp, date: todayDateStr, status: 'active' }; 
        const newInsts = []; let curDate = new Date(newContract.firstInstallmentDate); const instAmount = count > 0 ? Math.round((total - dp) / count) : 0; 
        for(let i=0; i<count; i++) { 
          newInsts.push({ id: 'inst_' + Date.now() + '_' + i, contractId, amount: instAmount, dueDate: curDate.toISOString().split('T')[0], status: 'pending' }); 
          curDate.setMonth(curDate.getMonth() + Number(newContract.interval)); 
        } 
        const trans = { id: 't_' + Date.now(), type: 'income', amount: dp, buildingId: unit.buildingId, description: `مقدم تعاقد: ${newContract.clientName}`, date: todayDateStr }; 
        setData(prev => ({ ...prev, contracts: [...(prev.contracts || []), contract], installments: [...(prev.installments || []), ...newInsts], transactions: [...(prev.transactions || []), trans], units: (prev.units || []).map(u => u.id === unit.id ? { ...u, status: 'sold' } : u) })); 
        setNewContract({ clientName: '', unitId: '', totalAmount: '', downPayment: '', installmentsCount: '', firstInstallmentDate: '', interval: '1' }); showMsg(lang==='ar'?'تم التسجيل بنجاح':'Saved'); 
      };

      const payInstallment = (instId, fullAmount, clientName, buildingId, paidAmount, date, custodyId) => {
        const paid = Number(paidAmount);
        setData(prev => {
          let updatedInsts = prev.installments || [];
          if (paid >= fullAmount) updatedInsts = updatedInsts.map(i => i.id === instId ? { ...i, status: 'paid' } : i);
          else updatedInsts = updatedInsts.map(i => i.id === instId ? { ...i, amount: i.amount - paid } : i);
          const trans = { id: 't_' + Date.now(), type: 'income', amount: paid, buildingId, custodyId: custodyId || '', description: `تحصيل قسط ${paid < fullAmount ? '(جزئي)' : ''}: ${clientName}`, date: date || todayDateStr };
          return { ...prev, installments: updatedInsts, transactions: [...(prev.transactions || []), trans] };
        });
        showMsg(lang==='ar'?'تم التحصيل':'Collected');
      };

      const goToTransaction = (type) => {
        const preSelectedCustody = dashboardCustodyFilter.length > 0 && dashboardCustodyFilter[0] !== 'ALL' ? dashboardCustodyFilter[0] : '';
        setNewTransaction(prev => ({ ...prev, type, custodyId: preSelectedCustody, date: getTodayStr() }));
        setActiveTab('transactions');
      };

      const thisMonth = new Date().toISOString().substring(0, 7);
      const monthInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate?.startsWith(thisMonth)).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));
      const overdueInstallments = (data.installments || []).filter(i => i.status === 'pending' && i.dueDate < todayDateStr).sort((a,b)=>new Date(a.dueDate||0)-new Date(b.dueDate||0));

      const tabs = [
        { id: 'dashboard', label: t.tab_dash }, { id: 'transactions', label: t.tab_tx },
        { id: 'custody', label: t.tab_cust }, { id: 'inventory', label: t.tab_inv },
        { id: 'sales', label: t.tab_sales }, { id: 'reports', label: t.tab_rep }
      ];

      const sortedCustodies = [...(data.custodies || [])].reverse();
      const sortedBuildings = [...(data.buildings || [])].reverse();
      const sortedCategories = [...(data.categories || [])].reverse();

      const lastCustodyNet = sortedCustodies.length > 0 ? (custodyCalculations.find(c => c.id === sortedCustodies[0].id)?.remaining || 0) : 0;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">

                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-6 bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-inner">
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">من تاريخ</label><input type="date" className="w-full border-2 p-3 text-sm rounded-xl font-bold focus:border-blue-400 outline-none bg-white font-mono" value={reportFilter.startDate} onChange={e=>setReportFilter({...reportFilter, startDate: e.target.value})}/></div>
                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">إلى تاريخ</label><input type="date" className="w-full border-2 p-3 text-sm rounded-xl font-bold focus:border-blue-400 outline-none bg-white font-mono" value={reportFilter.endDate} onChange={e=>setReportFilter({...reportFilter, endDate: e.target.value})}/></div>
                    {reportType === 'transactions' && (
                      <div className="relative z-30">
                        <label className="text-xs font-bold text-slate-500 mb-1 block">العهدة (تحديد متعدد)</label>
                        <MultiSelectDropdown options={sortedCustodies.map(c => ({ id: c.id, label: c.personName }))} selected={reportFilter.custodyIds} onChange={(newIds) => setReportFilter({...reportFilter, custodyIds: newIds})} placeholder="-- كل العهد --" />
                      </div>
                    )}
                    <div className="relative z-20">
                      <label className="text-xs font-bold text-slate-500 mb-1 block">العمارة (تحديد متعدد)</label>
                      <MultiSelectDropdown options={sortedBuildings.map(b => ({ id: b.id, label: b.name }))} selected={reportFilter.buildingIds} onChange={(newIds) => setReportFilter({...reportFilter, buildingIds: newIds})} placeholder="-- كل العمارات --" />
                    </div>
                  </div>
                  <button onClick={handlePrint} className="w-full bg-slate-800 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-slate-900 transition-transform">🖨️ طباعة التقرير بصيغة PDF</button>
                </div>
              </div>
            )}

            {/* Settings Tab */}
            {activeTab === 'settings' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 print-hide animate-fade-in">
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200 md:col-span-2 flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                  <h4 className="font-bold text-lg">{t.lang}</h4>
                  <div className="flex bg-slate-700 p-1 rounded-xl">
                    <button onClick={() => setLang('ar')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'ar' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>عربي</button>
                    <button onClick={() => setLang('en')} className={`px-6 py-2 rounded-lg font-bold transition ${lang === 'en' ? 'bg-white text-slate-900 shadow-md' : 'text-slate-300 hover:text-white'}`}>English</button>
                  </div>
                </div>

                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">🏷️ {t.addCat}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, categories: [...(p.categories || []), {id: 'c_'+Date.now(), name: newCategory}]})); setNewCategory(''); showMsg('Added');}} className="flex flex-col gap-3 mb-4">
                    <input required type="text" placeholder="..." className="border-2 p-3 text-md w-full rounded-xl font-bold focus:border-blue-500 outline-none bg-slate-50" value={newCategory} onChange={e=>setNewCategory(e.target.value)}/>
                    <button className="bg-slate-800 text-white p-3 rounded-xl text-md font-bold shadow hover:bg-slate-900 transition">{t.addCat}</button>
                  </form>
                  <div className="flex flex-wrap gap-2">
                    {sortedCategories.map(c => (
                      <span key={c.id} onClick={() => setAppModal({ show: true, type: 'CAT_ACTION', props: { cat: c } })} className="bg-slate-100 border border-slate-200 p-2 px-3 rounded-lg text-xs font-bold text-slate-700 shadow-sm cursor-pointer hover:bg-blue-50 transition">{c.name}</span>
                    ))}
                  </div>
                </div>
                
                <div className="bg-white p-6 shadow-sm rounded-2xl border border-slate-200">
                  <h4 className="font-bold mb-4 text-slate-800 border-b pb-2 text-lg">👤 {t.newCustody}</h4>
                  <form onSubmit={(e)=>{e.preventDefault(); setData(p=>({...p, custodies: [...(p.custodies || []), {id: 'cus_'+Date.now(), ...newCustody}]})); setNewCustody({personName:'', totalAmount:'', notes:''}); showMsg('Saved');}} className="space-y-4 relative">
                    <div className="relative">
                      <input required type="text" placeholder="اسم المسؤول..." className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.personName} 
                        onChange={e=>setNewCustody({...newCustody, personName:e.target.value})} onFocus={() => setCustodyNameFocus(true)} onBlur={() => setTimeout(() => setCustodyNameFocus(false), 200)}/>
                      {custodyNameFocus && filteredCustodyNames.length > 0 && (
                        <div className="absolute top-full left-0 right-0 bg-white border-2 border-slate-200 mt-1 shadow-2xl z-50 max-h-48 overflow-y-auto rounded-xl animate-fade-in">
                          {filteredCustodyNames.map((n, idx) => <div key={idx} className="p-3 text-sm border-b hover:bg-blue-50 cursor-pointer font-bold text-slate-700" onMouseDown={() => setNewCustody({...newCustody, personName: n})}>{n}</div>)}
                        </div>
                      )}
                    </div>
                    <div>
                      <NumberInput required placeholder="0.00" className="border-2 p-3 text-sm w-full rounded-xl font-bold focus:border-blue-400 outline-none bg-slate-50" value={newCustody.totalAmount} onChange={v=>setNewCustody({...newCustody, totalAmount:v})}/>
                    </div>
                    <button className="bg-slate-800 text-white p-4 rounded-xl w-full text-md font-bold shadow-lg hover:bg-slate-900 transition">{t.save}</button>
                  </form>
                </div>

                <div className="bg-white p-8 shadow-sm rounded-2xl md:col-span-2 text-center border-2 border-dashed border-blue-400 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                  <h4 className="font-black mb-3 text-blue-900 text-2xl">💾 {t.backup}</h4>
                  <div className="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                    <button onClick={()=>{const b=new Blob([JSON.stringify(data)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`backup_${todayDateStr}.json`;l.click(); showMsg('Downloaded');}} className="bg-blue-600 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-blue-700 transition hover:-translate-y-1">⬇️ Backup</button>
                    <label className="bg-amber-500 text-white px-8 py-4 rounded-xl font-black text-lg shadow-lg hover:bg-amber-600 transition cursor-pointer hover:-translate-y-1">⬆️ Restore<input type="file" accept=".json" className="hidden" onChange={(e)=>{const r=new FileReader();r.onload=(ev)=>{try{setData(JSON.parse(ev.target.result));showMsg('Restored');}catch{showMsg('Invalid File',true);}};if(e.target.files[0])r.readAsText(e.target.files[0]);}}/></label>
                  </div>
                </div>

                <div className="bg-red-50 p-8 shadow-sm rounded-2xl md:col-span-2 border-2 border-red-300 mt-2 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-red-600"></div>
                  <button onClick={handleResetFactory} className="w-full bg-red-600 text-white py-4 rounded-xl text-xl font-black shadow-lg hover:bg-red-700 transition hover:-translate-y-1">🗑️ {t.reset}</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><MainApp /></ErrorBoundary>);
  </script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
  </script>
</body>
</html>
